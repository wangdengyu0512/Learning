<svg aria-label="订单服务写 orders topic 的 3 个分区，三个消费组各自维护 offset 独立消费" role="img" viewbox="0 0 880 470" width="100%" xmlns="http://www.w3.org/2000/svg"><style>:root { color-scheme: light; }
svg { background: #fffdf8; }
.diagram-ink { stroke: #0A0A0A; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: #B73B2F; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: #A7A19A; fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: #fffdf8; }
.node-fill-accent { fill: #F7E6E2; }
.node-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; fill: #0A0A0A; }
.node-label-accent { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 700; fill: #B73B2F; }
.edge-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; fill: #514C47; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; font-weight: 700; fill: #B73B2F; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="cap-ink" markerheight="8" markerwidth="8" orient="auto" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
<marker id="cap-verm" markerheight="8" markerwidth="8" orient="auto" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
</defs>
<!-- Producer (left) -->
<rect class="diagram-accent node-fill-accent" height="64" rx="6" width="150" x="24" y="190"></rect>
<text class="node-label-accent" text-anchor="middle" x="99" y="216">订单服务</text>
<text class="edge-label" text-anchor="middle" x="99" y="236">key = orderId</text>
<!-- orders topic boundary (center) -->
<rect class="diagram-soft" height="218" rx="8" width="250" x="250" y="120"></rect>
<text class="edge-label" font-weight="700" x="268" y="142">TOPIC orders（3 分区）</text>
<rect class="diagram-ink node-fill" height="44" rx="6" width="198" x="276" y="156"></rect>
<text class="node-label" text-anchor="middle" x="375" y="183">partition 0 · 日志</text>
<rect class="diagram-ink node-fill" height="44" rx="6" width="198" x="276" y="212"></rect>
<text class="node-label" text-anchor="middle" x="375" y="239">partition 1 · 日志</text>
<rect class="diagram-ink node-fill" height="44" rx="6" width="198" x="276" y="268"></rect>
<text class="node-label" text-anchor="middle" x="375" y="295">partition 2 · 日志</text>
<!-- producer -> topic -->
<line class="diagram-accent" marker-end="url(#cap-verm)" x1="174" x2="250" y1="222" y2="222"></line>
<text class="branch-label" text-anchor="middle" x="212" y="212">写</text>
<!-- 3 consumer groups (right), each reads ALL partitions, own offset -->
<!-- group 库存 -->
<rect class="diagram-ink node-fill" height="80" rx="8" width="250" x="600" y="58"></rect>
<text class="node-label" x="618" y="80">消费组 · 库存扣减</text>
<text class="edge-label" x="618" y="100">offset 库存 · 独立游标</text>
<text class="edge-label" fill="#B73B2F" x="618" y="122">不丢且不重复扣</text>
<!-- group 通知 -->
<rect class="diagram-ink node-fill" height="80" rx="8" width="250" x="600" y="170"></rect>
<text class="node-label" x="618" y="192">消费组 · 用户通知</text>
<text class="edge-label" x="618" y="212">offset 通知 · 独立游标</text>
<text class="edge-label" x="618" y="234">可容忍少量重复</text>
<!-- group 对账 (accent) -->
<rect class="diagram-accent node-fill-accent" height="80" rx="8" width="250" x="600" y="282"></rect>
<text class="node-label-accent" x="618" y="304">消费组 · 财务对账</text>
<text class="edge-label" x="618" y="324">offset 对账 · 独立游标</text>
<text class="edge-label" fill="#B73B2F" x="618" y="346">不丢 + 按订单有序</text>
<!-- topic -> each group (from topic right edge x=500) -->
<line class="diagram-ink" marker-end="url(#cap-ink)" x1="500" x2="600" y1="200" y2="98"></line>
<line class="diagram-ink" marker-end="url(#cap-ink)" x1="500" x2="600" y1="229" y2="210"></line>
<line class="diagram-accent" marker-end="url(#cap-verm)" x1="500" x2="600" y1="268" y2="322"></line>
<text class="edge-label" text-anchor="middle" x="556" y="138">各读全量</text>
<!-- bottom note about replay -->
<text class="edge-label" text-anchor="middle" x="375" y="332">读不删数据 → 可重放</text>
</svg>