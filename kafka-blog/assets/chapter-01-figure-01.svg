<svg aria-label="一条 append-only 日志，producer 在尾部追加，两个消费组的游标停在不同 offset" role="img" viewbox="0 0 720 280" width="100%" xmlns="http://www.w3.org/2000/svg"><style>:root { color-scheme: light; }
svg { background: #fffdf8; }
.diagram-ink { stroke: #0A0A0A; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: #B73B2F; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: #A7A19A; fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: #fffdf8; }
.node-fill-accent { fill: #F7E6E2; }
.node-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; fill: #0A0A0A; }
.node-label-accent { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 700; fill: #B73B2F; }
.edge-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; fill: #514C47; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; font-weight: 700; fill: #B73B2F; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="flow-ink" markerheight="8" markerwidth="8" orient="auto" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
<marker id="flow-verm" markerheight="8" markerwidth="8" orient="auto" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
</defs>
<!-- log label -->
<text class="edge-label" font-weight="700" x="20" y="150">LOG</text>
<!-- 8 offset cells, x from 70, each 70 wide -->
<rect class="diagram-ink node-fill" height="52" width="70" x="70" y="124"></rect>
<text class="node-label" text-anchor="middle" x="105" y="155">v0</text>
<text class="edge-label" text-anchor="middle" x="105" y="196">0</text>
<rect class="diagram-ink node-fill" height="52" width="70" x="140" y="124"></rect>
<text class="node-label" text-anchor="middle" x="175" y="155">v1</text>
<text class="edge-label" text-anchor="middle" x="175" y="196">1</text>
<rect class="diagram-ink node-fill" height="52" width="70" x="210" y="124"></rect>
<text class="node-label" text-anchor="middle" x="245" y="155">v2</text>
<text class="edge-label" text-anchor="middle" x="245" y="196">2</text>
<rect class="diagram-ink node-fill" height="52" width="70" x="280" y="124"></rect>
<text class="node-label" text-anchor="middle" x="315" y="155">v3</text>
<text class="edge-label" text-anchor="middle" x="315" y="196">3</text>
<rect class="diagram-ink node-fill" height="52" width="70" x="350" y="124"></rect>
<text class="node-label" text-anchor="middle" x="385" y="155">v4</text>
<text class="edge-label" text-anchor="middle" x="385" y="196">4</text>
<rect class="diagram-ink node-fill" height="52" width="70" x="420" y="124"></rect>
<text class="node-label" text-anchor="middle" x="455" y="155">v5</text>
<text class="edge-label" text-anchor="middle" x="455" y="196">5</text>
<rect class="diagram-ink node-fill" height="52" width="70" x="490" y="124"></rect>
<text class="node-label" text-anchor="middle" x="525" y="155">v6</text>
<text class="edge-label" text-anchor="middle" x="525" y="196">6</text>
<!-- next-write slot (dashed) -->
<rect class="diagram-soft node-fill" height="52" width="70" x="560" y="124"></rect>
<text class="edge-label" text-anchor="middle" x="595" y="155">下一条</text>
<text class="edge-label" text-anchor="middle" x="595" y="196">7</text>
<!-- producer appends at tail -->
<rect class="diagram-accent node-fill-accent" height="44" rx="6" width="160" x="540" y="32"></rect>
<text class="node-label-accent" text-anchor="middle" x="620" y="59">Producer 追加</text>
<line class="diagram-accent" marker-end="url(#flow-verm)" x1="620" x2="595" y1="76" y2="122"></line>
<!-- consumer group A cursor at offset 5 (box bottom) -->
<text class="branch-label" text-anchor="middle" x="455" y="240">组 A · offset 5</text>
<line class="diagram-accent" marker-end="url(#flow-verm)" x1="455" x2="455" y1="228" y2="178"></line>
<!-- consumer group B cursor at offset 2 -->
<text class="edge-label" font-weight="700" text-anchor="middle" x="245" y="240">组 B · offset 2</text>
<line class="diagram-ink" marker-end="url(#flow-ink)" x1="245" x2="245" y1="228" y2="178"></line>
</svg>