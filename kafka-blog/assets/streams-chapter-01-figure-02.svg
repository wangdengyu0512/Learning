<svg aria-label="两个实例各含若干流线程，线程持有 task，task 一一绑定输入分区，第六个线程因无 task 可分而闲置" role="img" viewBox="0 0 700 360" width="100%" xmlns="http://www.w3.org/2000/svg"><style>:root { color-scheme: light; }
svg { background: #fffdf8; }
.diagram-ink { stroke: #0A0A0A; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: #B73B2F; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: #A7A19A; fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: #fffdf8; }
.node-fill-accent { fill: #F7E6E2; }
.node-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; fill: #0A0A0A; }
.node-label-accent { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 700; fill: #B73B2F; }
.edge-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; fill: #514C47; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; font-weight: 700; fill: #B73B2F; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="ar-ink-l" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
</defs>
<!-- Instance A box -->
<rect class="diagram-soft" height="150" rx="6" width="300" x="20" y="30"></rect>
<text class="edge-label" font-weight="700" x="34" y="50">Instance A（JVM）</text>
<rect class="diagram-ink node-fill" height="44" rx="5" width="120" x="40" y="64"></rect>
<text class="node-label" text-anchor="middle" x="100" y="84">StreamThread</text>
<text class="edge-label" text-anchor="middle" x="100" y="100">task 0</text>
<rect class="diagram-ink node-fill" height="44" rx="5" width="120" x="180" y="64"></rect>
<text class="node-label" text-anchor="middle" x="240" y="84">StreamThread</text>
<text class="edge-label" text-anchor="middle" x="240" y="100">task 1</text>
<rect class="diagram-ink node-fill" height="44" rx="5" width="120" x="40" y="120"></rect>
<text class="node-label" text-anchor="middle" x="100" y="140">StreamThread</text>
<text class="edge-label" text-anchor="middle" x="100" y="156">task 2</text>
<!-- Instance B box -->
<rect class="diagram-soft" height="140" rx="6" width="300" x="20" y="200"></rect>
<text class="edge-label" font-weight="700" x="34" y="220">Instance B（JVM）</text>
<rect class="diagram-ink node-fill" height="44" rx="5" width="120" x="40" y="234"></rect>
<text class="node-label" text-anchor="middle" x="100" y="254">StreamThread</text>
<text class="edge-label" text-anchor="middle" x="100" y="270">task 3</text>
<rect class="diagram-ink node-fill-accent" height="44" rx="5" stroke="#B73B2F" width="120" x="180" y="234"></rect>
<text class="node-label-accent" text-anchor="middle" x="240" y="254">StreamThread</text>
<text class="branch-label" text-anchor="middle" x="240" y="270">闲置</text>
<!-- Partitions column -->
<text class="edge-label" font-weight="700" text-anchor="middle" x="560" y="24">输入 topic（4 分区）</text>
<rect class="diagram-ink node-fill" height="34" rx="5" width="120" x="500" y="64"></rect>
<text class="node-label" text-anchor="middle" x="560" y="86">partition 0</text>
<rect class="diagram-ink node-fill" height="34" rx="5" width="120" x="500" y="106"></rect>
<text class="node-label" text-anchor="middle" x="560" y="128">partition 1</text>
<rect class="diagram-ink node-fill" height="34" rx="5" width="120" x="500" y="148"></rect>
<text class="node-label" text-anchor="middle" x="560" y="170">partition 2</text>
<rect class="diagram-ink node-fill" height="34" rx="5" width="120" x="500" y="234"></rect>
<text class="node-label" text-anchor="middle" x="560" y="256">partition 3</text>
<!-- task -> partition binds -->
<line class="diagram-ink" marker-end="url(#ar-ink-l)" x1="160" x2="500" y1="92" y2="81"></line>
<line class="diagram-ink" marker-end="url(#ar-ink-l)" x1="300" x2="500" y1="92" y2="116"></line>
<line class="diagram-ink" marker-end="url(#ar-ink-l)" x1="160" x2="500" y1="148" y2="158"></line>
<line class="diagram-ink" marker-end="url(#ar-ink-l)" x1="160" x2="500" y1="262" y2="251"></line>
</svg>