<svg aria-label="不丢消息的四道防线叠加，每道防线堵住一个丢失窗口" role="img" viewbox="0 0 720 360" width="100%" xmlns="http://www.w3.org/2000/svg"><style>:root { color-scheme: light; }
svg { background: #fffdf8; }
.diagram-ink { stroke: #0A0A0A; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: #B73B2F; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: #A7A19A; fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: #fffdf8; }
.node-fill-accent { fill: #F7E6E2; }
.node-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; fill: #0A0A0A; }
.node-label-accent { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 700; fill: #B73B2F; }
.edge-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; fill: #514C47; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; font-weight: 700; fill: #B73B2F; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="ar-gap" markerheight="7" markerwidth="7" orient="auto" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
</defs>
<!-- record entering -->
<text class="edge-label" font-weight="700" text-anchor="middle" x="60" y="40">一条记录</text>
<text class="edge-label" text-anchor="middle" x="60" y="56">要安全落地</text>
<!-- 4 stacked defense bars -->
<rect class="diagram-ink node-fill" height="44" rx="4" width="430" x="150" y="24"></rect>
<text class="node-label" x="170" y="51">① acks=all</text>
<text class="edge-label" text-anchor="end" x="568" y="51">堵：leader 单方面确认</text>
<rect class="diagram-ink node-fill" height="44" rx="4" width="430" x="150" y="92"></rect>
<text class="node-label" x="170" y="119">② min.insync.replicas=2</text>
<text class="edge-label" text-anchor="end" x="568" y="119">堵：ISR 缩到 1 静默退化</text>
<rect class="diagram-ink node-fill" height="44" rx="4" width="430" x="150" y="160"></rect>
<text class="node-label" x="170" y="187">③ replication.factor=3</text>
<text class="edge-label" text-anchor="end" x="568" y="187">堵：单 broker 挂掉无冗余</text>
<rect class="diagram-accent node-fill-accent" height="44" rx="4" width="430" x="150" y="228"></rect>
<text class="node-label-accent" x="170" y="255">④ unclean.leader.election=false</text>
<text class="edge-label" text-anchor="end" x="568" y="255">堵：落后副本上位截断</text>
<!-- consumer side note -->
<rect class="diagram-soft node-fill" height="40" rx="4" width="430" x="150" y="296"></rect>
<text class="node-label" font-size="12" x="170" y="321">＋ 消费侧：处理后再提交 offset</text>
<text class="edge-label" text-anchor="end" x="568" y="321">堵：auto-commit 丢未处理段</text>
<!-- "缺一道就有缺口" arrow on the right -->
<line class="diagram-accent" marker-end="url(#ar-gap)" x1="640" x2="640" y1="40" y2="300"></line>
<text class="branch-label" text-anchor="middle" transform="rotate(90 664 175)" x="664" y="175">缺一道即有缺口</text>
</svg>