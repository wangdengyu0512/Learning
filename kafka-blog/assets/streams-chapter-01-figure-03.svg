<svg aria-label="拓扑从源 topic 经过滤映射处理器到聚合处理器再到汇 topic，中间被重分区内部 topic 切成两个子拓扑" role="img" viewBox="0 0 700 250" width="100%" xmlns="http://www.w3.org/2000/svg"><style>:root { color-scheme: light; }
svg { background: #fffdf8; }
.diagram-ink { stroke: #0A0A0A; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: #B73B2F; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: #A7A19A; fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: #fffdf8; }
.node-fill-accent { fill: #F7E6E2; }
.node-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; fill: #0A0A0A; }
.node-label-accent { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 700; fill: #B73B2F; }
.edge-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; fill: #514C47; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; font-weight: 700; fill: #B73B2F; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="ar-ink-t" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
</defs>
<!-- sub-topology 1 dashed box -->
<rect class="diagram-soft" height="120" rx="6" width="318" x="14" y="48"></rect>
<text class="edge-label" font-weight="700" x="28" y="40">子拓扑 1</text>
<!-- sub-topology 2 dashed box -->
<rect class="diagram-soft" height="120" rx="6" width="282" x="404" y="48"></rect>
<text class="edge-label" font-weight="700" x="418" y="40">子拓扑 2</text>
<!-- source topic -->
<rect class="diagram-ink node-fill" height="44" rx="5" width="100" x="26" y="86"></rect>
<text class="node-label" text-anchor="middle" x="76" y="106">source</text>
<text class="edge-label" text-anchor="middle" x="76" y="122">topic</text>
<!-- processor filter/map -->
<rect class="diagram-ink node-fill" height="44" rx="5" width="140" x="166" y="86"></rect>
<text class="node-label" text-anchor="middle" x="236" y="106">processor</text>
<text class="edge-label" text-anchor="middle" x="236" y="122">filter / map（改 key）</text>
<!-- repartition internal topic (the boundary) -->
<rect class="diagram-accent node-fill-accent" height="44" rx="5" width="68" x="334" y="86"></rect>
<text class="node-label-accent" font-size="11" text-anchor="middle" x="368" y="103">重分区</text>
<text class="branch-label" text-anchor="middle" x="368" y="119">topic</text>
<!-- processor aggregate -->
<rect class="diagram-ink node-fill" height="44" rx="5" width="140" x="430" y="86"></rect>
<text class="node-label" text-anchor="middle" x="500" y="106">processor</text>
<text class="edge-label" text-anchor="middle" x="500" y="122">aggregate</text>
<!-- sink topic -->
<rect class="diagram-ink node-fill" height="44" rx="5" width="74" x="600" y="86"></rect>
<text class="node-label" text-anchor="middle" x="637" y="106">sink</text>
<text class="edge-label" text-anchor="middle" x="637" y="122">topic</text>
<!-- arrows -->
<line class="diagram-ink" marker-end="url(#ar-ink-t)" x1="126" x2="166" y1="108" y2="108"></line>
<line class="diagram-ink" marker-end="url(#ar-ink-t)" x1="306" x2="334" y1="108" y2="108"></line>
<line class="diagram-ink" marker-end="url(#ar-ink-t)" x1="402" x2="430" y1="108" y2="108"></line>
<line class="diagram-ink" marker-end="url(#ar-ink-t)" x1="570" x2="600" y1="108" y2="108"></line>
<text class="edge-label" text-anchor="middle" x="350" y="200">改 key 的算子下游若要按 key 聚合 → 在此切开 → 物化成内部 topic</text>
</svg>