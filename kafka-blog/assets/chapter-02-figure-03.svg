<svg aria-label="eager 与 cooperative 再平衡对比：左侧所有分区被收回停止，右侧只有迁移的分区被收回其余继续" role="img" viewbox="0 0 820 340" width="100%" xmlns="http://www.w3.org/2000/svg"><style>:root { color-scheme: light; }
svg { background: #fffdf8; }
.diagram-ink { stroke: #0A0A0A; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: #B73B2F; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: #A7A19A; fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: #fffdf8; }
.node-fill-accent { fill: #F7E6E2; }
.node-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; fill: #0A0A0A; }
.node-label-accent { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 700; fill: #B73B2F; }
.edge-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; fill: #514C47; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; font-weight: 700; fill: #B73B2F; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="rb-ink" markerheight="7" markerwidth="7" orient="auto" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
</defs>
<!-- divider -->
<line class="diagram-soft" x1="410" x2="410" y1="20" y2="320"></line>
<!-- LEFT: eager -->
<text class="node-label-accent" text-anchor="middle" x="205" y="40">eager（急切式）</text>
<text class="edge-label" text-anchor="middle" x="205" y="58">再平衡时全部收回 · stop-the-world</text>
<!-- consumers C1,C2 + new C3 -->
<rect class="diagram-ink node-fill" height="40" rx="6" width="100" x="40" y="80"></rect>
<text class="node-label" text-anchor="middle" x="90" y="105">C1</text>
<rect class="diagram-ink node-fill" height="40" rx="6" width="100" x="155" y="80"></rect>
<text class="node-label" text-anchor="middle" x="205" y="105">C2</text>
<rect class="diagram-accent node-fill-accent" height="40" rx="6" width="100" x="270" y="80"></rect>
<text class="node-label-accent" text-anchor="middle" x="320" y="105">C3 新加入</text>
<!-- partitions row (all revoked => dashed, "停") -->
<rect class="diagram-soft" height="40" rx="4" width="48" x="40" y="170"></rect>
<text class="edge-label" text-anchor="middle" x="64" y="195">P0停</text>
<rect class="diagram-soft" height="40" rx="4" width="48" x="100" y="170"></rect>
<text class="edge-label" text-anchor="middle" x="124" y="195">P1停</text>
<rect class="diagram-soft" height="40" rx="4" width="48" x="160" y="170"></rect>
<text class="edge-label" text-anchor="middle" x="184" y="195">P2停</text>
<rect class="diagram-soft" height="40" rx="4" width="48" x="220" y="170"></rect>
<text class="edge-label" text-anchor="middle" x="244" y="195">P3停</text>
<rect class="diagram-soft" height="40" rx="4" width="48" x="280" y="170"></rect>
<text class="edge-label" text-anchor="middle" x="304" y="195">P4停</text>
<rect class="diagram-soft" height="40" rx="4" width="48" x="340" y="170"></rect>
<text class="edge-label" text-anchor="middle" x="364" y="195">P5停</text>
<text class="branch-label" text-anchor="middle" x="205" y="250">全部 6 个分区暂停消费</text>
<text class="edge-label" text-anchor="middle" x="205" y="270">直到新分配下发</text>
<!-- RIGHT: cooperative -->
<text class="node-label-accent" text-anchor="middle" x="615" y="40">cooperative（协作增量式）</text>
<text class="edge-label" text-anchor="middle" x="615" y="58">只收回要迁移的分区 · 其余继续流动</text>
<rect class="diagram-ink node-fill" height="40" rx="6" width="100" x="450" y="80"></rect>
<text class="node-label" text-anchor="middle" x="500" y="105">C1</text>
<rect class="diagram-ink node-fill" height="40" rx="6" width="100" x="565" y="80"></rect>
<text class="node-label" text-anchor="middle" x="615" y="105">C2</text>
<rect class="diagram-accent node-fill-accent" height="40" rx="6" width="100" x="680" y="80"></rect>
<text class="node-label-accent" text-anchor="middle" x="730" y="105">C3 新加入</text>
<!-- partitions: P0-P4 keep (ink, flowing), only P5 revoked->C3 (accent dashed) -->
<rect class="diagram-ink node-fill" height="40" rx="4" width="48" x="450" y="170"></rect>
<text class="edge-label" text-anchor="middle" x="474" y="195">P0✓</text>
<rect class="diagram-ink node-fill" height="40" rx="4" width="48" x="510" y="170"></rect>
<text class="edge-label" text-anchor="middle" x="534" y="195">P1✓</text>
<rect class="diagram-ink node-fill" height="40" rx="4" width="48" x="570" y="170"></rect>
<text class="edge-label" text-anchor="middle" x="594" y="195">P2✓</text>
<rect class="diagram-ink node-fill" height="40" rx="4" width="48" x="630" y="170"></rect>
<text class="edge-label" text-anchor="middle" x="654" y="195">P3✓</text>
<rect class="diagram-ink node-fill" height="40" rx="4" width="48" x="690" y="170"></rect>
<text class="edge-label" text-anchor="middle" x="714" y="195">P4✓</text>
<rect class="diagram-accent node-fill-accent" height="40" rx="4" width="48" x="750" y="170"></rect>
<text class="edge-label" fill="#B73B2F" text-anchor="middle" x="774" y="195">P5↦</text>
<!-- arrow: P5 moves to C3 -->
<line class="diagram-accent" marker-end="url(#rb-ink)" x1="774" x2="740" y1="170" y2="122"></line>
<text class="branch-label" text-anchor="middle" x="615" y="250">只有 P5 短暂暂停并迁移给 C3</text>
<text class="edge-label" text-anchor="middle" x="615" y="270">P0–P4 全程不间断消费</text>
</svg>