<svg aria-label="Kafka 整体架构：producer 写 leader、follower 同步、consumer group 读 leader、KRaft 管理元数据" role="img" viewbox="0 0 860 430" width="100%" xmlns="http://www.w3.org/2000/svg"><style>:root { color-scheme: light; }
svg { background: #fffdf8; }
.diagram-ink { stroke: #0A0A0A; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: #B73B2F; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: #A7A19A; fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: #fffdf8; }
.node-fill-accent { fill: #F7E6E2; }
.node-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; fill: #0A0A0A; }
.node-label-accent { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 700; fill: #B73B2F; }
.edge-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; fill: #514C47; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; font-weight: 700; fill: #B73B2F; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="a-ink" markerheight="8" markerwidth="8" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
<marker id="a-verm" markerheight="8" markerwidth="8" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
<marker id="a-soft" markerheight="7" markerwidth="7" orient="auto" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#A3A3A3"></path>
</marker>
</defs>
<!-- Broker cluster boundary -->
<rect class="diagram-soft" height="290" rx="8" width="370" x="250" y="78"></rect>
<text class="edge-label" font-weight="700" x="266" y="98">BROKER 集群</text>
<!-- Leader partition (accent) -->
<rect class="diagram-accent node-fill-accent" height="62" rx="6" stroke-width="2" width="270" x="300" y="120"></rect>
<text class="node-label-accent" text-anchor="middle" x="435" y="146">Partition leader</text>
<text class="edge-label" text-anchor="middle" x="435" y="166">唯一写入点 · 持有完整日志</text>
<!-- Follower 1 -->
<rect class="diagram-ink node-fill" height="56" rx="6" width="125" x="300" y="222"></rect>
<text class="node-label" text-anchor="middle" x="362" y="245">follower 1</text>
<text class="edge-label" text-anchor="middle" x="362" y="263">fetch 同步</text>
<!-- Follower 2 -->
<rect class="diagram-ink node-fill" height="56" rx="6" width="125" x="445" y="222"></rect>
<text class="node-label" text-anchor="middle" x="507" y="245">follower 2</text>
<text class="edge-label" text-anchor="middle" x="507" y="263">fetch 同步</text>
<!-- KRaft controller quorum -->
<rect class="diagram-soft" height="40" rx="6" width="270" x="300" y="312"></rect>
<text class="edge-label" font-weight="700" text-anchor="middle" x="435" y="337">KRaft controller quorum（元数据日志）</text>
<!-- Producer -->
<rect class="diagram-ink node-fill" height="56" rx="6" width="150" x="40" y="120"></rect>
<text class="node-label" text-anchor="middle" x="115" y="143">Producer</text>
<text class="edge-label" text-anchor="middle" x="115" y="161">acks 等待确认</text>
<!-- Consumer group -->
<rect class="diagram-ink node-fill" height="56" rx="6" width="150" x="680" y="120"></rect>
<text class="node-label" text-anchor="middle" x="755" y="143">Consumer group</text>
<text class="edge-label" text-anchor="middle" x="755" y="161">各自维护 offset</text>
<!-- Producer -> leader (hot path, accent) -->
<line class="diagram-accent" marker-end="url(#a-verm)" x1="190" x2="300" y1="148" y2="148"></line>
<text class="branch-label" text-anchor="middle" x="245" y="138">写 (热)</text>
<!-- leader -> consumer (hot path, accent) -->
<line class="diagram-accent" marker-end="url(#a-verm)" x1="570" x2="680" y1="148" y2="148"></line>
<text class="branch-label" text-anchor="middle" x="625" y="138">读 (热)</text>
<!-- follower fetch from leader (follower pulls; arrow points to leader) -->
<line class="diagram-ink" marker-end="url(#a-ink)" x1="362" x2="380" y1="222" y2="182"></line>
<line class="diagram-ink" marker-end="url(#a-ink)" x1="507" x2="490" y1="222" y2="182"></line>
<text class="edge-label" text-anchor="middle" x="435" y="208">follower 主动 fetch</text>
<!-- KRaft manages (dashed) -->
<line class="diagram-soft" marker-end="url(#a-soft)" x1="435" x2="435" y1="312" y2="282"></line>
</svg>