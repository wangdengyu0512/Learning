<svg aria-label="难度梯度金字塔：底层概念层回忆、中层原理层理解、顶层判别层迁移，标注各层题量" role="img" viewBox="0 0 680 380" width="100%" xmlns="http://www.w3.org/2000/svg"><style>:root { color-scheme: light; }
svg { background: #fffdf8; }
.diagram-ink { stroke: #0A0A0A; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: #B73B2F; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: #A7A19A; fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: #fffdf8; }
.node-fill-accent { fill: #F7E6E2; }
.node-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; fill: #0A0A0A; }
.node-label-accent { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 700; fill: #B73B2F; }
.edge-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; fill: #514C47; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; font-weight: 700; fill: #B73B2F; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="arrow-ink" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
</defs>
<!-- Cognitive-demand axis on the left -->
<line class="diagram-ink" marker-end="url(#arrow-ink)" x1="70" x2="70" y1="330" y2="50"></line>
<text class="edge-label" font-weight="700" x="56" y="44">认知要求 ↑</text>
<!-- Bottom tier: 概念层 (recall) — widest -->
<polygon class="diagram-ink node-fill" points="150,330 590,330 510,250 230,250"></polygon>
<text class="node-label" text-anchor="middle" x="370" y="285">概念层 · 回忆</text>
<text class="edge-label" text-anchor="middle" x="370" y="305">7 题 · 对应 01 概念</text>
<!-- Middle tier: 原理层 (understand) -->
<polygon class="diagram-ink node-fill" points="230,248 510,248 440,168 300,168"></polygon>
<text class="node-label" text-anchor="middle" x="370" y="203">原理层 · 理解</text>
<text class="edge-label" text-anchor="middle" x="370" y="223">8 题 · 对应 02 原理</text>
<!-- Top tier: 判别层 (transfer) — accent, narrowest -->
<polygon class="diagram-accent node-fill-accent" points="300,166 440,166 370,86 370,86" stroke-width="2"></polygon>
<text class="node-label-accent" text-anchor="middle" x="370" y="138">判别层</text>
<text class="edge-label" text-anchor="middle" x="370" y="156">迁移 · 5 题</text>
<!-- Annotation pointing at the apex -->
<text class="branch-label" x="470" y="110">面试主战场</text>
<line class="diagram-accent" marker-end="url(#arrow-ink)" x1="466" x2="412" y1="106" y2="116"></line>
<!-- Verb labels on right gutter, aligned to each tier -->
<text class="edge-label" x="600" y="294">能复述</text>
<text class="edge-label" x="600" y="212">能解释为什么</text>
<text class="edge-label" x="600" y="126">能迁移判别</text>
</svg>