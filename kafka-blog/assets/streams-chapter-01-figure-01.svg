<svg aria-label="左侧 KStream 事件流与右侧 KTable 最新值表通过物化与差异日志双向转换" role="img" viewBox="0 0 680 300" width="100%" xmlns="http://www.w3.org/2000/svg"><style>:root { color-scheme: light; }
svg { background: #fffdf8; }
.diagram-ink { stroke: #0A0A0A; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: #B73B2F; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: #A7A19A; fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: #fffdf8; }
.node-fill-accent { fill: #F7E6E2; }
.node-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; fill: #0A0A0A; }
.node-label-accent { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 700; fill: #B73B2F; }
.edge-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; fill: #514C47; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; font-weight: 700; fill: #B73B2F; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="ar-ink-d" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
<marker id="ar-verm-d" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
</defs>
<!-- Left: KStream column -->
<text class="node-label-accent" text-anchor="middle" x="120" y="34">KStream（事件流）</text>
<rect class="diagram-ink node-fill" height="34" rx="5" width="160" x="40" y="52"></rect>
<text class="node-label" text-anchor="middle" x="120" y="74">(alice, 1)</text>
<rect class="diagram-ink node-fill" height="34" rx="5" width="160" x="40" y="92"></rect>
<text class="node-label" text-anchor="middle" x="120" y="114">(bob, 5)</text>
<rect class="diagram-ink node-fill" height="34" rx="5" width="160" x="40" y="132"></rect>
<text class="node-label" text-anchor="middle" x="120" y="154">(alice, 3)</text>
<rect class="diagram-ink node-fill" height="34" rx="5" width="160" x="40" y="172"></rect>
<text class="node-label" text-anchor="middle" x="120" y="194">(alice, null)</text>
<text class="edge-label" text-anchor="middle" x="120" y="232">append-only · 每条都留</text>
<!-- Right: KTable column -->
<text class="node-label-accent" text-anchor="middle" x="560" y="34">KTable（最新值表）</text>
<rect class="diagram-ink node-fill" height="34" rx="5" width="160" x="480" y="92"></rect>
<text class="node-label" text-anchor="middle" x="560" y="114">bob → 5</text>
<rect class="diagram-ink node-fill" height="34" rx="5" width="160" x="480" y="132"></rect>
<text class="node-label" text-anchor="middle" x="560" y="154">alice → 3</text>
<text class="edge-label" text-anchor="middle" x="560" y="196">每 key 最新 · null 删除</text>
<!-- Bidirectional arrows between columns -->
<line class="diagram-accent" marker-end="url(#ar-verm-d)" x1="208" x2="472" y1="112" y2="112"></line>
<text class="branch-label" text-anchor="middle" x="340" y="104">流 → 表：物化（折叠）</text>
<line class="diagram-ink" marker-end="url(#ar-ink-d)" x1="472" x2="208" y1="150" y2="150"></line>
<text class="edge-label" text-anchor="middle" x="340" y="170">表 → 流：差异日志（changelog）</text>
</svg>