<svg aria-label="陷阱按失败类别与严重度二维分类，并标注配置因果链" role="img" viewbox="0 0 760 400" width="100%" xmlns="http://www.w3.org/2000/svg"><style>:root { color-scheme: light; }
svg { background: #fffdf8; }
.diagram-ink { stroke: #0A0A0A; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: #B73B2F; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: #A7A19A; fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: #fffdf8; }
.node-fill-accent { fill: #F7E6E2; }
.node-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; fill: #0A0A0A; }
.node-label-accent { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 700; fill: #B73B2F; }
.edge-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; fill: #514C47; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; font-weight: 700; fill: #B73B2F; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="ar-ink" markerheight="7" markerwidth="7" orient="auto" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
<marker id="ar-verm" markerheight="7" markerwidth="7" orient="auto" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
</defs>
<!-- Axes -->
<line class="diagram-ink" marker-end="url(#ar-ink)" x1="120" x2="730" y1="350" y2="350"></line>
<line class="diagram-ink" marker-end="url(#ar-ink)" x1="120" x2="120" y1="350" y2="40"></line>
<text class="edge-label" font-weight="700" text-anchor="middle" x="425" y="384">失败类别（按根因机制）</text>
<text class="edge-label" font-weight="700" text-anchor="middle" transform="rotate(-90 44 195)" x="44" y="195">严重度</text>
<!-- X category labels -->
<text class="edge-label" text-anchor="middle" x="235" y="368">数据丢失</text>
<text class="edge-label" text-anchor="middle" x="425" y="368">正确性</text>
<text class="edge-label" text-anchor="middle" x="620" y="368">性能 / 运维</text>
<!-- Severity bands (dashed guides) -->
<line class="diagram-soft" x1="120" x2="700" y1="120" y2="120"></line>
<line class="diagram-soft" x1="120" x2="700" y1="235" y2="235"></line>
<text class="edge-label" fill="#B73B2F" text-anchor="end" x="700" y="92">不可逆</text>
<text class="edge-label" text-anchor="end" x="700" y="208">可补救</text>
<text class="edge-label" text-anchor="end" x="700" y="322">可调优</text>
<!-- Data-loss cluster (high severity, left) -->
<rect class="diagram-accent node-fill-accent" height="48" rx="6" width="156" x="160" y="58"></rect>
<text class="node-label-accent" text-anchor="middle" x="238" y="78">acks=1 / unclean</text>
<text class="edge-label" text-anchor="middle" x="238" y="95">已提交记录消失</text>
<!-- Correctness cluster (mid severity, center) -->
<rect class="diagram-ink node-fill" height="48" rx="6" width="150" x="350" y="150"></rect>
<text class="node-label" text-anchor="middle" x="425" y="170">重复 / 乱序</text>
<text class="edge-label" text-anchor="middle" x="425" y="187">幂等可去重</text>
<!-- Performance cluster (low severity, right) -->
<rect class="diagram-ink node-fill" height="48" rx="6" width="158" x="542" y="262"></rect>
<text class="node-label" text-anchor="middle" x="621" y="282">再平衡风暴 / 倾斜</text>
<text class="edge-label" text-anchor="middle" x="621" y="299">配置可缓解</text>
<!-- Causal chain inset (bottom-left, shows pitfalls are not isolated) -->
<text class="edge-label" fill="#B73B2F" font-weight="700" x="128" y="60">因果链</text>
<line class="diagram-soft" marker-end="url(#ar-verm)" x1="316" x2="348" y1="82" y2="160"></line>
<text class="branch-label" text-anchor="middle" x="332" y="128">↘</text>
</svg>