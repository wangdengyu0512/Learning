<svg aria-label="Kafka Streams 概念地图：以嵌入式库为中心，KStream/KTable/GlobalKTable、Topology、Task=Partition、Window/Time、EOS v2、State Store 环绕；State Store 持久化到 Changelog topic 用朱红副线强调真相源在 Kafka" role="img" viewBox="0 0 900 560" width="100%" xmlns="http://www.w3.org/2000/svg"><style>:root { color-scheme: light; }
svg { background: #fffdf8; }
.diagram-ink { stroke: #0A0A0A; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: #B73B2F; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: #A7A19A; fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: #fffdf8; }
.node-fill-accent { fill: #F7E6E2; }
.node-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; fill: #0A0A0A; }
.node-label-accent { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 700; fill: #B73B2F; }
.edge-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; fill: #514C47; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; font-weight: 700; fill: #B73B2F; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="arrow-ink" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
<marker id="arrow-vermilion" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
</defs>
<!-- ===== Central hub: Streams app = embedded library ===== -->
<rect class="diagram-accent node-fill-accent" height="76" rx="8" stroke-width="2" width="210" x="345" y="242"></rect>
<text class="node-label-accent" font-size="14" text-anchor="middle" x="450" y="272">Streams 应用</text>
<text class="node-label-accent" font-size="14" text-anchor="middle" x="450" y="294">= 嵌入式库</text>
<!-- ===== Top: KStream / KTable / GlobalKTable ===== -->
<rect class="diagram-ink node-fill" height="58" rx="6" width="260" x="320" y="40"></rect>
<text class="node-label" text-anchor="middle" x="450" y="64">KStream / KTable / GlobalKTable</text>
<text class="edge-label" text-anchor="middle" x="450" y="84">流、表两种视图</text>
<!-- spoke: bottom edge of top box (y=98) → top edge of hub (y=242) -->
<line class="diagram-ink" marker-end="url(#arrow-ink)" x1="450" x2="450" y1="98" y2="242"></line>
<text class="edge-label" text-anchor="middle" x="450" y="175">流表对偶</text>
<!-- ===== Top-right: Topology ===== -->
<rect class="diagram-ink node-fill" height="58" rx="6" width="220" x="650" y="118"></rect>
<text class="node-label" text-anchor="middle" x="760" y="142">Topology 拓扑</text>
<text class="edge-label" text-anchor="middle" x="760" y="162">source→processor→sink</text>
<!-- spoke: left edge of box (x=650,y=176 corner area) → top-right corner of hub (555,242) -->
<line class="diagram-ink" marker-end="url(#arrow-ink)" x1="650" x2="556" y1="176" y2="244"></line>
<text class="edge-label" text-anchor="middle" x="636" y="208">编译为</text>
<!-- ===== Right: Task = Partition ===== -->
<rect class="diagram-ink node-fill" height="58" rx="6" width="220" x="650" y="252"></rect>
<text class="node-label" text-anchor="middle" x="760" y="276">Task = Partition</text>
<text class="edge-label" text-anchor="middle" x="760" y="296">并行单位，缩放上限</text>
<!-- spoke: left edge of box (x=650) → right edge of hub (x=555) -->
<line class="diagram-ink" marker-end="url(#arrow-ink)" x1="650" x2="555" y1="281" y2="281"></line>
<!-- ===== Bottom-right: Window / Time ===== -->
<rect class="diagram-ink node-fill" height="58" rx="6" width="220" x="650" y="386"></rect>
<text class="node-label" text-anchor="middle" x="760" y="410">Window / Time</text>
<text class="edge-label" text-anchor="middle" x="760" y="430">event-time + stream-time</text>
<!-- spoke: left edge of box (x=650,y=386 corner area) → bottom-right corner of hub (555,318) -->
<line class="diagram-ink" marker-end="url(#arrow-ink)" x1="650" x2="556" y1="386" y2="316"></line>
<text class="edge-label" text-anchor="middle" x="636" y="352">有状态算子用</text>
<!-- ===== Bottom: EOS v2 ===== -->
<rect class="diagram-ink node-fill" height="58" rx="6" width="240" x="330" y="462"></rect>
<text class="node-label" text-anchor="middle" x="450" y="486">EOS v2（事务）</text>
<text class="edge-label" text-anchor="middle" x="450" y="506">read-process-write 原子</text>
<!-- spoke: top edge of box (y=462) → bottom edge of hub (y=318) -->
<line class="diagram-ink" marker-end="url(#arrow-ink)" x1="450" x2="450" y1="462" y2="318"></line>
<text class="edge-label" text-anchor="middle" x="450" y="395">端到端</text>
<!-- ===== Left: State Store (RocksDB) ===== -->
<rect class="diagram-ink node-fill" height="58" rx="6" width="220" x="30" y="252"></rect>
<text class="node-label" text-anchor="middle" x="140" y="276">State Store</text>
<text class="edge-label" text-anchor="middle" x="140" y="296">本地 RocksDB</text>
<!-- spoke: right edge of box (x=250) → left edge of hub (x=345) -->
<line class="diagram-ink" marker-end="url(#arrow-ink)" x1="250" x2="345" y1="281" y2="281"></line>
<text class="edge-label" text-anchor="middle" x="297" y="273">有状态算子用</text>
<!-- ===== Top-left: Changelog topic (vermilion sub-line, truth source) ===== -->
<rect class="diagram-accent node-fill" height="58" rx="6" width="220" x="30" y="110"></rect>
<text class="node-label-accent" text-anchor="middle" x="140" y="134">Changelog topic</text>
<text class="edge-label" text-anchor="middle" x="140" y="154">真相源在 Kafka</text>
<!-- vermilion sub-line: from State Store top edge (140,252) up to Changelog bottom edge (140,168) -->
<line class="diagram-accent" marker-end="url(#arrow-vermilion)" x1="140" x2="140" y1="252" y2="168"></line>
<text class="branch-label" text-anchor="middle" x="140" y="210">持久化到</text>
</svg>