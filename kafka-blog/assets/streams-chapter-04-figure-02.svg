<svg aria-label="JVM 进程内堆与堆外内存对比，RocksDB 在堆外按每 store 分配，-Xmx 管不到，总和顶破容器上限触发 OOMKill" role="img" viewBox="0 0 720 400" width="100%" xmlns="http://www.w3.org/2000/svg"><style>:root { color-scheme: light; }
svg { background: #fffdf8; }
.diagram-ink { stroke: #0A0A0A; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: #B73B2F; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: #A7A19A; fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: #fffdf8; }
.node-fill-accent { fill: #F7E6E2; }
.node-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; fill: #0A0A0A; }
.node-label-accent { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 700; fill: #B73B2F; }
.edge-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; fill: #514C47; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; font-weight: 700; fill: #B73B2F; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="arrow-ink2" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
<marker id="arrow-verm2" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
</defs>
<!-- Container memory limit boundary (dashed accent), the kill line -->
<rect class="diagram-accent" fill="none" height="310" rx="8" stroke-dasharray="6 4" stroke-width="2" width="470" x="40" y="50"></rect>
<text class="branch-label" x="52" y="42">容器内存上限（内核盯着这条线）</text>
<!-- JVM process box inside the container -->
<rect class="diagram-ink node-fill" height="262" rx="6" width="422" x="64" y="74"></rect>
<text class="edge-label" font-weight="700" x="76" y="94">JVM 进程</text>
<!-- Heap region (left) -->
<rect class="diagram-ink node-fill" height="210" rx="5" width="180" x="86" y="108"></rect>
<text class="node-label" text-anchor="middle" x="176" y="130">堆 (heap)</text>
<text class="edge-label" text-anchor="middle" x="176" y="150">-Xmx 管这里</text>
<text class="edge-label" text-anchor="middle" x="176" y="168">GC 看着正常</text>
<line class="diagram-soft" x1="106" x2="246" y1="186" y2="186"></line>
<text class="edge-label" text-anchor="middle" x="176" y="212">used heap</text>
<text class="edge-label" text-anchor="middle" x="176" y="230">离 -Xmx 还远</text>
<rect class="diagram-soft" fill="rgba(163,163,163,0.10)" height="58" rx="4" width="140" x="106" y="244"></rect>
<text class="edge-label" text-anchor="middle" x="176" y="277">空余（误导信号）</text>
<!-- Off-heap region (right) -->
<rect class="diagram-accent node-fill-accent" height="210" rx="5" width="180" x="286" y="108"></rect>
<text class="node-label-accent" text-anchor="middle" x="376" y="130">堆外 (off-heap)</text>
<text class="edge-label" text-anchor="middle" x="376" y="148">RocksDB · 每 store 一份</text>
<text class="edge-label" text-anchor="middle" x="376" y="166">-Xmx 管不到</text>
<!-- per-store stacked little boxes -->
<rect class="diagram-ink node-fill" height="34" rx="3" width="152" x="300" y="178"></rect>
<text class="edge-label" text-anchor="middle" x="376" y="199">block cache ≈50MiB</text>
<rect class="diagram-ink node-fill" height="34" rx="3" width="152" x="300" y="218"></rect>
<text class="edge-label" text-anchor="middle" x="376" y="239">memtable 写缓冲</text>
<rect class="diagram-ink node-fill" height="34" rx="3" width="152" x="300" y="258"></rect>
<text class="edge-label" text-anchor="middle" x="376" y="279">index/filter 块</text>
<text class="edge-label" text-anchor="middle" x="376" y="308">× N 个 store</text>
<!-- Kill arrow: off-heap pushes past the container line -->
<line class="diagram-accent" marker-end="url(#arrow-verm2)" x1="466" x2="520" y1="150" y2="150"></line>
<text class="node-label-accent" x="540" y="138">顶破上限</text>
<text class="edge-label" x="540" y="158">堆+堆外 &gt; 容器</text>
<text class="edge-label" x="540" y="176">→ 内核 OOMKill</text>
<text class="edge-label" x="540" y="194">(exit 137)</text>
<!-- "raise -Xmx makes it worse" note -->
<line class="diagram-soft" marker-end="url(#arrow-ink2)" x1="540" x2="540" y1="240" y2="270"></line>
<text class="edge-label" x="540" y="232">调大 -Xmx</text>
<text class="edge-label" x="540" y="288">→ 堆吃更多额度</text>
<text class="edge-label" x="540" y="306">→ 堆外更挤</text>
<text class="branch-label" x="540" y="324">OOMKill 反而更早</text>
</svg>