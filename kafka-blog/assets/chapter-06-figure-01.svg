<svg aria-label="难度梯度金字塔：底层概念层回忆、中层原理层理解、顶层判别层迁移，逐层收窄并标注题量" role="img" viewbox="0 0 720 440" width="100%" xmlns="http://www.w3.org/2000/svg"><style>:root { color-scheme: light; }
svg { background: #fffdf8; }
.diagram-ink { stroke: #0A0A0A; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: #B73B2F; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: #A7A19A; fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: #fffdf8; }
.node-fill-accent { fill: #F7E6E2; }
.node-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; fill: #0A0A0A; }
.node-label-accent { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 700; fill: #B73B2F; }
.edge-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; fill: #514C47; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; font-weight: 700; fill: #B73B2F; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="climb" markerheight="8" markerwidth="8" orient="auto" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
</defs>
<!-- Pyramid: three stacked trapezoids, widest at bottom -->
<!-- Bottom layer: 概念层 (recall) -->
<polygon class="diagram-ink node-fill" points="110,360 610,360 530,278 190,278"></polygon>
<text class="node-label" text-anchor="middle" x="360" y="312">概念层 · 回忆 recall</text>
<text class="edge-label" text-anchor="middle" x="360" y="334">认得术语、复述定义（6 道）</text>
<!-- Middle layer: 原理层 (understand) -->
<polygon class="diagram-ink node-fill" points="190,276 530,276 458,194 262,194"></polygon>
<text class="node-label" text-anchor="middle" x="360" y="228">原理层 · 理解 understand</text>
<text class="edge-label" text-anchor="middle" x="360" y="250">讲清机制与取舍（8 道）</text>
<!-- Top layer: 判别层 (discriminate) -->
<polygon class="diagram-accent node-fill-accent" points="262,192 458,192 360,82 360,82"></polygon>
<text class="node-label-accent" text-anchor="middle" x="360" y="150">判别层</text>
<text class="edge-label" text-anchor="middle" x="360" y="170">迁移到新场景（6 道）</text>
<!-- climb arrow on the left, bottom to top -->
<line class="diagram-accent" marker-end="url(#climb)" x1="70" x2="70" y1="360" y2="92"></line>
<text class="branch-label" text-anchor="middle" transform="rotate(-90 48 232)" x="48" y="232">从记忆爬向迁移</text>
<!-- right-side stage annotations, aligned to each band, sitting outside the pyramid -->
<text class="edge-label" text-anchor="middle" x="636" y="322">对应 01 章</text>
<text class="edge-label" text-anchor="middle" x="636" y="238">对应 02 章</text>
<text class="edge-label" text-anchor="middle" x="636" y="150">综合全书</text>
<!-- baseline caption inside-frame note -->
<text class="edge-label" text-anchor="middle" x="360" y="404">底层越宽 = 题越基础、数量越多；越往上越少、越难</text>
</svg>