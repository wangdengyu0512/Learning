<svg aria-label="数据从 ProducerRecord 经序列化写入 broker 分区日志，再经 poll 反序列化成 ConsumerRecords 进入业务处理" role="img" viewbox="0 0 900 250" width="100%" xmlns="http://www.w3.org/2000/svg"><style>:root { color-scheme: light; }
svg { background: #fffdf8; }
.diagram-ink { stroke: #0A0A0A; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: #B73B2F; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: #A7A19A; fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: #fffdf8; }
.node-fill-accent { fill: #F7E6E2; }
.node-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; fill: #0A0A0A; }
.node-label-accent { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 700; fill: #B73B2F; }
.edge-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; fill: #514C47; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11px; font-weight: 700; fill: #B73B2F; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="d-flow" markerheight="8" markerwidth="8" orient="auto" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
</defs>
<text class="edge-label" font-weight="700" x="16" y="92">动作</text>
<text class="edge-label" font-weight="700" x="16" y="196">类型</text>
<!-- stage 1: ProducerRecord -->
<rect class="diagram-accent node-fill-accent" height="56" rx="6" width="150" x="60" y="62"></rect>
<text class="node-label-accent" text-anchor="middle" x="135" y="86">ProducerRecord</text>
<text class="edge-label" text-anchor="middle" x="135" y="105">业务对象</text>
<text class="edge-label" text-anchor="middle" x="135" y="196">&lt;K,V&gt;</text>
<line class="diagram-ink" marker-end="url(#d-flow)" x1="210" x2="258" y1="90" y2="90"></line>
<text class="edge-label" text-anchor="middle" x="234" y="80">序列化</text>
<!-- stage 2: broker partition log -->
<rect class="diagram-ink node-fill" height="56" rx="6" width="172" x="258" y="62"></rect>
<text class="node-label" text-anchor="middle" x="344" y="86">broker 分区日志</text>
<text class="edge-label" text-anchor="middle" x="344" y="105">append 到尾部</text>
<text class="edge-label" text-anchor="middle" x="344" y="196">byte[]</text>
<line class="diagram-ink" marker-end="url(#d-flow)" x1="430" x2="478" y1="90" y2="90"></line>
<text class="edge-label" text-anchor="middle" x="454" y="80">poll</text>
<!-- stage 3: ConsumerRecords -->
<rect class="diagram-ink node-fill" height="56" rx="6" width="160" x="478" y="62"></rect>
<text class="node-label" text-anchor="middle" x="558" y="86">ConsumerRecords</text>
<text class="edge-label" text-anchor="middle" x="558" y="105">一批记录</text>
<text class="edge-label" text-anchor="middle" x="558" y="196">&lt;K,V&gt;</text>
<line class="diagram-ink" marker-end="url(#d-flow)" x1="638" x2="686" y1="90" y2="90"></line>
<text class="edge-label" text-anchor="middle" x="662" y="80">遍历</text>
<!-- stage 4: business handling -->
<rect class="diagram-accent node-fill-accent" height="56" rx="6" width="160" x="686" y="62"></rect>
<text class="node-label-accent" text-anchor="middle" x="766" y="86">业务处理</text>
<text class="edge-label" text-anchor="middle" x="766" y="105">handle(value)</text>
<text class="edge-label" text-anchor="middle" x="766" y="196">V</text>
<!-- commit loop back -->
<line class="diagram-soft" marker-end="url(#d-flow)" x1="766" x2="766" y1="118" y2="156"></line>
<text class="branch-label" text-anchor="middle" x="766" y="172">处理后</text>
<line class="diagram-soft" x1="766" x2="346" y1="156" y2="156"></line>
<line class="diagram-soft" marker-end="url(#d-flow)" x1="346" x2="346" y1="156" y2="120"></line>
<text class="edge-label" text-anchor="middle" x="556" y="150">commitSync() 提交 offset 回 broker</text>
</svg>