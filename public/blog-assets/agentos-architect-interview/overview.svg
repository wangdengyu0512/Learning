<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">AgentOS 总体架构：从业务目标到可验证结果</title>
  <desc id="desc">业务目标和验收标准进入任务编排。业务上下文提供带来源的证据，分析模块生成方案，动作执行模块检查授权并按需等待人工批准，再操作业务系统。结果验收回查实际状态，将结论反馈给编排。持久化状态、事件、证据和运行记录支撑恢复与治理，业务系统保留事实所有权。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#0f766e"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
      .title { font-size: 24px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 19px; fill: #334155; }
      .note { font-size: 17px; fill: #475569; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .control { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="1000" rx="20" fill="#f8fafc"/>
  <text x="48" y="52" font-size="30" font-weight="700" fill="#0f172a">AgentOS · 从业务目标到可验证结果</text>
  <text x="48" y="85" class="body">模型提出方案，程序约束执行，人员承担需要额外授权的决策</text>

  <rect x="48" y="116" width="1104" height="88" rx="14" fill="#0f172a"/>
  <text x="76" y="151" font-size="23" font-weight="700" fill="#fff">业务入口 · 人员 / 数字岗位 / 业务事件</text>
  <text x="76" y="182" font-size="19" fill="#cbd5e1">明确目标、任务范围、验收标准和责任人</text>
  <path d="M600 204V260" class="flow"/>
  <text x="618" y="240" class="note">提交任务</text>

  <rect x="32" y="260" width="1136" height="484" rx="18" fill="#fff" stroke="#cbd5e1"/>
  <text x="56" y="295" class="title">AgentOS 运行机制</text>
  <text x="1140" y="294" text-anchor="end" class="note">逻辑职责，可按负载与隔离需要合并或拆分部署</text>

  <rect x="64" y="316" width="1072" height="92" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="88" y="352" class="title">任务编排 · 确定性主流程</text>
  <text x="88" y="384" class="body">步骤依赖 / 持久化进度 / 等待批准 / 事件唤醒 / 中断恢复 / 结束或转交</text>

  <path d="M184 408V465" class="control"/>
  <path d="M456 408V465" class="control"/>
  <path d="M728 408V465" class="control"/>
  <path d="M1000 408V465" class="control"/>
  <text x="600" y="443" text-anchor="middle" class="note">调度步骤，检查约束，记录状态</text>

  <rect x="64" y="468" width="240" height="144" rx="12" fill="#eef2ff" stroke="#a5b4fc"/>
  <rect x="336" y="468" width="240" height="144" rx="12" fill="#eef2ff" stroke="#a5b4fc"/>
  <rect x="608" y="468" width="240" height="144" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <rect x="880" y="468" width="256" height="144" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
  <g text-anchor="middle">
    <text x="184" y="505" class="title">业务上下文</text>
    <text x="184" y="539" class="body">事实、规则与历史资料</text>
    <text x="184" y="568" class="body">权限过滤 / 来源版本</text>
    <text x="184" y="595" class="note">交付可追溯的证据</text>
    <text x="456" y="505" class="title">分析</text>
    <text x="456" y="539" class="body">理解目标，生成方案</text>
    <text x="456" y="568" class="body">限定查询、时间与费用</text>
    <text x="456" y="595" class="note">信息不足则补充或转交</text>
    <text x="728" y="505" class="title">动作执行</text>
    <text x="728" y="539" class="body">授权校验 / 按需批准</text>
    <text x="728" y="568" class="body">前置条件 / 稳定动作标识</text>
    <text x="728" y="595" class="note">结果未知先核对</text>
    <text x="1008" y="505" class="title">结果验收</text>
    <text x="1008" y="539" class="body">回查实际业务状态</text>
    <text x="1008" y="568" class="body">对照目标与验收标准</text>
    <text x="1008" y="595" class="note">完成 / 继续 / 转交</text>
  </g>
  <path d="M304 540H334" class="flow"/>
  <path d="M576 540H606" class="flow"/>
  <path d="M848 540H878" class="flow"/>

  <path d="M1008 612V637H1152V362H1138" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#feedback)"/>
  <text x="1010" y="660" text-anchor="middle" font-size="17" fill="#0f766e">验收结论反馈编排</text>
  <path d="M184 784V614" class="flow"/>
  <path d="M728 612V782" class="flow"/>
  <path d="M1008 684V782" class="flow"/>
  <g class="note" text-anchor="middle">
    <text x="272" y="703">受控读取事实</text>
    <text x="812" y="703">写入与核对</text>
    <text x="1080" y="728">受控回查</text>
  </g>

  <rect x="48" y="784" width="1104" height="80" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="76" y="818" class="title">企业业务系统与知识源</text>
  <text x="76" y="848" class="body">业务系统保留当前事实的所有权；规则与历史资料按需检索，执行前重新校验关键条件</text>

  <rect x="48" y="888" width="1104" height="68" rx="12" fill="#e2e8f0"/>
  <text x="600" y="915" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">贯穿各模块的运行支撑：状态与事件 / 证据引用 / 批准记录 / 执行回执 / 版本与费用</text>
  <text x="600" y="943" text-anchor="middle" class="note">支撑恢复、审计与收益评估；状态更新和待发送事件在同一本地事务中提交</text>
  <text x="600" y="983" text-anchor="middle" class="note">实线：业务交接与外部依赖　虚线：编排控制　绿色回路：结果验收反馈</text>
</svg>
