<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc">
  <title id="title">AgentOS 初期部署架构</title>
  <desc id="desc">业务请求和人工批准进入应用服务，由任务编排维护步骤与等待条件。后台进程执行业务上下文、分析、动作执行和结果验收四项职责。应用服务与后台进程共用持久化存储，状态更新和待发送事件在同一本地事务中提交。事件投递唤醒后台进程，重复事件去重，执行节点通过租约和版本条件提交状态。模型服务提供推理，业务系统保留当前事实，动作执行受控写入，结果验收回查目标并反馈编排。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <marker id="event-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#0f766e"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
      .heading { font-size: 23px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 19px; fill: #334155; }
      .note { font-size: 17px; fill: #475569; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .event { fill: none; stroke: #0f766e; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#event-arrow); }
    </style>
  </defs>
  <rect width="1120" height="1100" rx="20" fill="#f8fafc"/>
  <text x="40" y="49" font-size="30" font-weight="700" fill="#0f172a">AgentOS · 初期部署架构</text>
  <text x="40" y="82" class="body">应用服务承接任务，后台进程执行步骤，持久化状态支撑等待与恢复</text>

  <rect x="40" y="110" width="1040" height="74" rx="12" fill="#0f172a"/>
  <text x="560" y="141" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">业务入口与人工处理</text>
  <text x="560" y="169" text-anchor="middle" font-size="18" fill="#cbd5e1">提交目标与验收标准 / 查询进度 / 批准方案 / 接管异常</text>
  <path d="M320 184V224" class="flow"/>

  <rect x="40" y="226" width="560" height="146" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="64" y="262" class="heading">应用服务 · 任务编排</text>
  <text x="64" y="295" class="body">步骤依赖 / 等待条件 / 流程与配置版本</text>
  <text x="64" y="326" class="body">批准绑定对象、参数、范围与有效期</text>
  <text x="64" y="354" class="note">根据验收结论推进、结束或转交任务</text>
  <rect x="640" y="226" width="440" height="146" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="664" y="262" class="heading">事件投递与任务唤醒</text>
  <text x="664" y="295" class="body">读取已提交事件，触发可运行步骤</text>
  <text x="664" y="326" class="body">重复事件去重 / 租约与版本检查</text>
  <text x="664" y="354" class="note">初期可由后台进程轮询实现</text>

  <path d="M320 372V438" class="flow"/>
  <text x="338" y="410" class="note">保存任务与批准</text>
  <path d="M860 440V374" class="event"/>
  <text x="878" y="410" class="note">异步投递</text>
  <rect x="40" y="440" width="1040" height="126" rx="12" fill="#fff" stroke="#94a3b8"/>
  <text x="64" y="475" class="heading">共用持久化存储</text>
  <text x="64" y="507" class="body">任务与步骤状态 / 证据引用 / 批准记录 / 动作标识与回执 / 版本与费用</text>
  <rect x="64" y="523" width="992" height="29" rx="6" fill="#e0f2fe"/>
  <text x="560" y="544" text-anchor="middle" font-size="18" fill="#075985">同一本地事务：状态更新 + 待发送事件</text>

  <path d="M320 630V568" class="flow" marker-start="url(#arrow)"/>
  <text x="338" y="604" class="note">读取进度，提交状态、证据与验收结论</text>
  <path d="M1080 300H1100V666H1058" class="event"/>

  <rect x="40" y="630" width="1016" height="226" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <text x="64" y="669" class="heading">后台执行进程</text>
  <text x="1032" y="668" text-anchor="end" class="note">等待时释放资源，恢复时校验状态与版本</text>
  <rect x="64" y="692" width="220" height="134" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
  <rect x="312" y="692" width="220" height="134" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
  <rect x="560" y="692" width="224" height="134" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <rect x="812" y="692" width="220" height="134" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <g text-anchor="middle">
    <text x="174" y="727" class="heading">业务上下文</text>
    <text x="174" y="761" class="body">权限过滤 / 来源版本</text>
    <text x="174" y="794" class="note">获取事实与规则证据</text>
    <text x="422" y="727" class="heading">分析</text>
    <text x="422" y="761" class="body">基于证据生成方案</text>
    <text x="422" y="794" class="note">限制查询、时间与费用</text>
    <text x="672" y="727" class="heading">动作执行</text>
    <text x="672" y="761" class="body">授权与前置条件校验</text>
    <text x="672" y="794" class="note">稳定标识 / 超时先核对</text>
    <text x="922" y="727" class="heading">结果验收</text>
    <text x="922" y="761" class="body">回查实际业务状态</text>
    <text x="922" y="794" class="note">对照目标，反馈编排</text>
  </g>
  <path d="M284 755H310" class="flow"/>
  <path d="M532 755H558" class="flow"/>
  <path d="M784 755H810" class="flow"/>

  <path d="M174 826V936" class="flow"/>
  <path d="M422 826V936" class="flow"/>
  <path d="M672 826V936" class="flow"/>
  <path d="M922 826V936" class="flow"/>
  <g text-anchor="middle" class="note">
    <text x="174" y="895">受控查询</text>
    <text x="422" y="895">推理调用</text>
    <text x="672" y="895">受控写入 / 核对</text>
    <text x="922" y="895">受控回查</text>
  </g>
  <rect x="64" y="938" width="220" height="72" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <rect x="312" y="938" width="220" height="72" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <rect x="560" y="938" width="472" height="72" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <g text-anchor="middle">
    <text x="174" y="968" font-size="20" font-weight="700" fill="#0f172a">业务系统 / 知识资料</text>
    <text x="174" y="995" class="note">实时事实与有效规则</text>
    <text x="422" y="968" font-size="20" font-weight="700" fill="#0f172a">模型服务</text>
    <text x="422" y="995" class="note">提供推理能力</text>
    <text x="796" y="968" font-size="20" font-weight="700" fill="#0f172a">业务系统 · 保留当前事实所有权</text>
    <text x="796" y="995" class="note">集中管理业务凭证与外部操作入口</text>
  </g>
  <text x="560" y="1045" text-anchor="middle" class="note">实线：调用或读写依赖　绿色虚线：事件投递与唤醒；两处业务系统可为同一系统</text>
  <text x="560" y="1075" text-anchor="middle" class="note">初期可共用应用代码与数据库；出现扩容、故障隔离或独立发布需求后再拆分服务</text>
</svg>
