<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="向量检索中后过滤、前过滤和索引内过滤三种策略对比" role="img" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
<style>.box{fill:#fff;stroke:#242424;stroke-width:1.4}.bad{fill:#fff1ec;stroke:#d94a2b;stroke-width:1.7}.good{fill:#edf8f1;stroke:#4a8f65;stroke-width:1.7}.edge{stroke:#555;stroke-width:1.3;fill:none;marker-end:url(#a)}.t{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#242424;font-size:14px;font-weight:700}.s{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#666;font-size:12px}.r{fill:#d94a2b}.g{fill:#387b50}</style><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>
<text class="t" x="450" y="30" text-anchor="middle">查询目标：语义最近且 tenant_id = A 的 Top-K</text>
<rect class="bad" x="32" y="70" width="256" height="364" rx="10"/><text class="t r" x="160" y="103" text-anchor="middle">Post-filter</text><text class="s" x="160" y="125" text-anchor="middle">先 ANN，再筛 metadata</text><rect class="box" x="78" y="158" width="164" height="50" rx="6"/><text class="s" x="160" y="188" text-anchor="middle">全库 ANN 只取 K 条</text><path class="edge" d="M160 208V252"/><rect class="box" x="78" y="252" width="164" height="50" rx="6"/><text class="s" x="160" y="282" text-anchor="middle">删除不属于 A 的结果</text><path class="edge" d="M160 302V346"/><text class="t r" x="160" y="374" text-anchor="middle">可能返回少于 K 条</text><text class="s" x="160" y="398" text-anchor="middle">还会漏掉候选窗外的真近邻</text>
<rect class="bad" x="322" y="70" width="256" height="364" rx="10"/><text class="t r" x="450" y="103" text-anchor="middle">Pre-filter</text><text class="s" x="450" y="125" text-anchor="middle">先取合格子集，再跑 ANN</text><rect class="box" x="368" y="158" width="164" height="50" rx="6"/><text class="s" x="450" y="188" text-anchor="middle">摘掉所有非 A 节点</text><path class="edge" d="M450 208V252"/><rect class="box" x="368" y="252" width="164" height="50" rx="6"/><text class="s" x="450" y="282" text-anchor="middle">在残余图中导航</text><path class="edge" d="M450 302V346"/><text class="t r" x="450" y="374" text-anchor="middle">图连通性可能被切断</text><text class="s" x="450" y="398" text-anchor="middle">大子集上又慢又可能掉召回</text>
<rect class="good" x="612" y="70" width="256" height="364" rx="10"/><text class="t g" x="740" y="103" text-anchor="middle">Integrated filtering</text><text class="s" x="740" y="125" text-anchor="middle">过滤进入图遍历过程</text><rect class="box" x="658" y="158" width="164" height="50" rx="6"/><text class="s" x="740" y="180" text-anchor="middle">灰点不计入结果</text><text class="s" x="740" y="197" text-anchor="middle">但仍可借边继续走</text><path class="edge" d="M740 208V252"/><rect class="box" x="658" y="252" width="164" height="50" rx="6"/><text class="s" x="740" y="275" text-anchor="middle">候选不足则继续扫描</text><text class="s" x="740" y="292" text-anchor="middle">或回退精确子集扫描</text><path class="edge" d="M740 302V346"/><text class="t g" x="740" y="374" text-anchor="middle">把正确性放在算法内部</text><text class="s" x="740" y="398" text-anchor="middle">代价转为实现和运维复杂度</text>
<text class="s" x="450" y="474" text-anchor="middle">过滤不是 SQL WHERE 的简单附加项，而是 ANN 图结构与业务条件之间的冲突</text>
</svg>
