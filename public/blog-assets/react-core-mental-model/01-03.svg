<svg aria-label="单向数据流：App 持有 state，props 实线向下传给 Display 和 Button，事件虚线从 Button 绕行回到 App" role="img" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg"><style>
  svg { background: #fbfaf7; }
  .diagram-ink { stroke: #24211d; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .diagram-accent { stroke: #b73b2f; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .diagram-soft { stroke: #aaa39a; fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
  .node-fill { fill: #fffdf8; }
  .node-fill-accent { fill: #f8e6e1; }
  .node-label { font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: #24211d; }
  .node-label-accent { font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #b73b2f; }
  .edge-label { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; fill: #615b54; paint-order: stroke; stroke: #fbfaf7; stroke-width: 4px; stroke-linejoin: round; }
  .branch-label { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #b73b2f; paint-order: stroke; stroke: #fbfaf7; stroke-width: 4px; stroke-linejoin: round; }
  text { font-family: Inter, system-ui, sans-serif; }
</style>
<defs>
<marker id="tree-ink" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
<marker id="tree-soft" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#A3A3A3"></path>
</marker>
</defs>
<rect class="diagram-accent node-fill-accent" height="54" rx="6" width="140" x="270" y="40"></rect>
<text class="node-label-accent" text-anchor="middle" x="340" y="63">App</text>
<text class="edge-label" text-anchor="middle" x="340" y="81">持有 count</text>
<rect class="diagram-ink node-fill" height="54" rx="6" width="160" x="70" y="200"></rect>
<text class="node-label" text-anchor="middle" x="150" y="223">Display</text>
<text class="edge-label" text-anchor="middle" x="150" y="241">props: count</text>
<rect class="diagram-ink node-fill" height="54" rx="6" width="160" x="450" y="200"></rect>
<text class="node-label" text-anchor="middle" x="530" y="223">Button</text>
<text class="edge-label" text-anchor="middle" x="530" y="241">props: onClick</text>
<line class="diagram-ink" marker-end="url(#tree-ink)" x1="300" x2="165" y1="94" y2="200"></line>
<text class="edge-label" text-anchor="middle" x="205" y="150">count ↓</text>
<line class="diagram-ink" marker-end="url(#tree-ink)" x1="380" x2="505" y1="94" y2="200"></line>
<text class="edge-label" text-anchor="middle" x="470" y="150">onClick ↓</text>
<polyline class="diagram-soft" fill="none" marker-end="url(#tree-soft)" points="610,212 645,212 645,60 412,60"></polyline>
<text class="edge-label" text-anchor="middle" x="548" y="50">事件：调用回调 ↑</text>
</svg>