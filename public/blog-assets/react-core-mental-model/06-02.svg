<text class="node-label" text-anchor="middle" x="510" y="44">04</text>
<text class="node-label" text-anchor="middle" x="600" y="44">05</text>
<line class="diagram-soft" x1="240" x2="240" y1="60" y2="268"></line>
<line class="diagram-soft" x1="330" x2="330" y1="60" y2="268"></line>
<line class="diagram-soft" x1="420" x2="420" y1="60" y2="268"></line>
<line class="diagram-soft" x1="510" x2="510" y1="60" y2="268"></line>
<line class="diagram-soft" x1="600" x2="600" y1="60" y2="268"></line>
