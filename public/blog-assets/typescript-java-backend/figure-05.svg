<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="同样形状的两个类型：TypeScript 按结构判定可互相赋值，Java 按名字判定不兼容" height="250" role="img" viewBox="0 0 720 250" width="720" xmlns="http://www.w3.org/2000/svg"><style>
:root { --bg:#fff; --ink:#0a0a0a; --ink-soft:#525252; --ink-faint:#a3a3a3; --vermilion:#b73b2f; --vermilion-soft:rgba(183,59,47,.08); }
svg { background:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; }
.diagram-ink { stroke:var(--ink); fill:none; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
.diagram-accent { stroke:var(--vermilion); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.diagram-soft { stroke:var(--ink-faint); fill:none; stroke-width:1.1; stroke-dasharray:3 3; }
.node-fill { fill:var(--bg); }
.node-fill-accent { fill:var(--vermilion-soft); }
.node-label { font-size:13px; font-weight:500; fill:var(--ink); }
.node-label-accent { font-size:13px; font-weight:700; fill:var(--vermilion); }
.edge-label { font-family:Consolas,"SFMono-Regular",monospace; font-size:11px; fill:var(--ink-soft); paint-order:stroke; stroke:var(--bg); stroke-width:4px; stroke-linejoin:round; }
.branch-label { font-family:Consolas,"SFMono-Regular",monospace; font-size:11px; font-weight:700; fill:var(--vermilion); paint-order:stroke; stroke:var(--bg); stroke-width:4px; stroke-linejoin:round; }
</style>
<defs>
<marker id="ar-both" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
</defs>
<!-- left: TypeScript -->
<text class="node-label" text-anchor="middle" x="170" y="40">TypeScript · 按结构</text>
<rect class="diagram-ink node-fill" height="64" rx="6" width="110" x="40" y="70"></rect>
<text class="node-label" text-anchor="middle" x="95" y="98">Point2D</text>
<text class="edge-label" style="stroke:none" text-anchor="middle" x="95" y="118">{ x; y }</text>
<rect class="diagram-ink node-fill" height="64" rx="6" width="110" x="200" y="70"></rect>
<text class="node-label" text-anchor="middle" x="255" y="98">Vec2</text>
<text class="edge-label" style="stroke:none" text-anchor="middle" x="255" y="118">{ x; y }</text>
<line class="diagram-accent" marker-end="url(#ar-both)" marker-start="url(#ar-both)" x1="150" x2="200" y1="102" y2="102"></line>
<text class="branch-label" text-anchor="middle" x="175" y="166">✓ 可互相赋值</text>
<text class="edge-label" style="stroke:none" text-anchor="middle" x="175" y="190">形状相同即兼容</text>
<!-- divider -->
<line class="diagram-soft" x1="360" x2="360" y1="56" y2="210"></line>
<!-- right: Java -->
<text class="node-label" text-anchor="middle" x="550" y="40">Java · 按名字</text>
<rect class="diagram-ink node-fill" height="64" rx="6" width="110" x="420" y="70"></rect>
<text class="node-label" text-anchor="middle" x="475" y="98">Point2D</text>
<text class="edge-label" style="stroke:none" text-anchor="middle" x="475" y="118">{ x; y }</text>
<rect class="diagram-ink node-fill" height="64" rx="6" width="110" x="580" y="70"></rect>
<text class="node-label" text-anchor="middle" x="635" y="98">Vec2</text>
<text class="edge-label" style="stroke:none" text-anchor="middle" x="635" y="118">{ x; y }</text>
<line class="diagram-soft" x1="530" x2="580" y1="102" y2="102"></line>
<text class="branch-label" text-anchor="middle" x="555" y="106">✗</text>
<text class="branch-label" text-anchor="middle" x="555" y="166">✗ 不兼容</text>
<text class="edge-label" style="stroke:none" text-anchor="middle" x="555" y="190">无继承关系即不兼容</text>
</svg>