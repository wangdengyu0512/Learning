<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="enum 编译成带正反映射的真实 JS 对象并留在运行时，而字面量联合编译后什么都不剩" height="280" role="img" viewBox="0 0 720 280" width="720" xmlns="http://www.w3.org/2000/svg"><style>
:root { --bg:#fff; --ink:#0a0a0a; --ink-soft:#525252; --ink-faint:#a3a3a3; --vermilion:#b73b2f; --vermilion-soft:rgba(183,59,47,.08); }
svg { background:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; }
.diagram-ink { stroke:var(--ink); fill:none; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
.diagram-accent { stroke:var(--vermilion); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.diagram-soft { stroke:var(--ink-faint); fill:none; stroke-width:1.1; stroke-dasharray:3 3; }
.node-fill { fill:var(--bg); }
.node-fill-accent { fill:var(--vermilion-soft); }
.node-label { font-size:13px; font-weight:500; fill:var(--ink); }
.node-label-accent { font-size:13px; font-weight:700; fill:var(--vermilion); }
.edge-label { font-family:Consolas,"SFMono-Regular",monospace; font-size:11px; fill:var(--ink-soft); paint-order:stroke; stroke:var(--bg); stroke-width:4px; stroke-linejoin:round; }
.branch-label { font-family:Consolas,"SFMono-Regular",monospace; font-size:11px; font-weight:700; fill:var(--vermilion); paint-order:stroke; stroke:var(--bg); stroke-width:4px; stroke-linejoin:round; }
</style>
<defs>
<marker id="ar-e" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
</defs>
<!-- left: enum -->
<rect class="diagram-accent node-fill-accent" height="44" rx="6" width="300" x="20" y="30"></rect>
<text class="node-label-accent" text-anchor="middle" x="170" y="57">enum Color { Red, Green }</text>
<line class="diagram-ink" marker-end="url(#ar-e)" x1="170" x2="170" y1="74" y2="104"></line>
<text class="edge-label" style="stroke:none" text-anchor="middle" x="196" y="93">tsc</text>
<rect class="diagram-ink node-fill" height="110" rx="6" width="300" x="20" y="108"></rect>
<text class="node-label" text-anchor="middle" x="170" y="132">运行时留下真实 JS 对象</text>
<text class="edge-label" style="stroke:none" text-anchor="middle" x="170" y="158">{ Red: 0, Green: 1,</text>
<text class="edge-label" style="stroke:none" text-anchor="middle" x="170" y="178">0: "Red", 1: "Green" }</text>
<text class="branch-label" text-anchor="middle" x="170" y="202">正向 + 反向双映射</text>
<!-- divider -->
<line class="diagram-soft" x1="360" x2="360" y1="20" y2="240"></line>
<!-- right: union -->
<rect class="diagram-ink node-fill" height="44" rx="6" width="300" x="400" y="30"></rect>
<text class="node-label" text-anchor="middle" x="550" y="57">type Color = "Red" | "Green"</text>
<line class="diagram-ink" marker-end="url(#ar-e)" x1="550" x2="550" y1="74" y2="104"></line>
<text class="edge-label" style="stroke:none" text-anchor="middle" x="576" y="93">tsc</text>
<rect class="diagram-soft" height="110" rx="6" width="300" x="400" y="108"></rect>
<text class="node-label" text-anchor="middle" x="550" y="158">运行时：什么都不剩</text>
<text class="branch-label" text-anchor="middle" x="550" y="184">零开销（被擦除）</text>
</svg>