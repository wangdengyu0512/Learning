<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="TypeScript 的两个世界：编译期类型世界与运行时值世界，以 tsc 编译为擦除边界" height="460" role="img" viewBox="0 0 760 460" width="760" xmlns="http://www.w3.org/2000/svg"><style>
:root { --bg:#fff; --ink:#0a0a0a; --ink-soft:#525252; --ink-faint:#a3a3a3; --vermilion:#b73b2f; --vermilion-soft:rgba(183,59,47,.08); }
svg { background:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; }
.diagram-ink { stroke:var(--ink); fill:none; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
.diagram-accent { stroke:var(--vermilion); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.diagram-soft { stroke:var(--ink-faint); fill:none; stroke-width:1.1; stroke-dasharray:3 3; }
.node-fill { fill:var(--bg); }
.node-fill-accent { fill:var(--vermilion-soft); }
.node-label { font-size:13px; font-weight:500; fill:var(--ink); }
.node-label-accent { font-size:13px; font-weight:700; fill:var(--vermilion); }
.edge-label { font-family:Consolas,"SFMono-Regular",monospace; font-size:11px; fill:var(--ink-soft); paint-order:stroke; stroke:var(--bg); stroke-width:4px; stroke-linejoin:round; }
.branch-label { font-family:Consolas,"SFMono-Regular",monospace; font-size:11px; font-weight:700; fill:var(--vermilion); paint-order:stroke; stroke:var(--bg); stroke-width:4px; stroke-linejoin:round; }
</style>
<defs>
<marker id="arrow-ink" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
<marker id="arrow-vermilion" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
</defs>
<!-- Title -->
<rect class="diagram-accent node-fill-accent" height="48" rx="6" stroke-width="2" width="260" x="250" y="16"></rect>
<text class="node-label-accent" text-anchor="middle" x="380" y="38">TypeScript</text>
<text class="edge-label" text-anchor="middle" x="380" y="56">= JavaScript + 一层编译期类型</text>
<!-- arrows title -> two worlds -->
<line class="diagram-ink" marker-end="url(#arrow-ink)" x1="332" x2="200" y1="64" y2="90"></line>
<line class="diagram-ink" marker-end="url(#arrow-ink)" x1="428" x2="560" y1="64" y2="90"></line>
<!-- Left world container (dashed = ephemeral) -->
<rect class="diagram-soft" height="330" rx="8" width="300" x="30" y="92"></rect>
<text class="node-label" text-anchor="middle" x="180" y="116">编译期 · 类型世界</text>
<text class="edge-label" text-anchor="middle" x="180" y="133">tsc 检查后整框擦除</text>
<!-- Right world container (solid = real) -->
<rect class="diagram-ink" height="330" rx="8" width="300" x="430" y="92"></rect>
<text class="node-label" text-anchor="middle" x="580" y="116">运行时 · 值世界</text>
<text class="edge-label" text-anchor="middle" x="580" y="133">真正执行的 JavaScript</text>
<!-- Left nodes -->
<rect class="diagram-ink node-fill" height="44" rx="6" width="260" x="50" y="152"></rect>
<text class="node-label" text-anchor="middle" x="180" y="179">类型注解 / 推断</text>
<rect class="diagram-ink node-fill" height="44" rx="6" width="260" x="50" y="208"></rect>
<text class="node-label" text-anchor="middle" x="180" y="235">interface · type</text>
<rect class="diagram-ink node-fill" height="44" rx="6" width="260" x="50" y="264"></rect>
<text class="node-label" text-anchor="middle" x="180" y="291">联合 · 字面量 · 泛型</text>
<rect class="diagram-ink node-fill" height="44" rx="6" width="260" x="50" y="320"></rect>
<text class="node-label" text-anchor="middle" x="180" y="347">any · unknown · never</text>
<!-- Right nodes -->
<rect class="diagram-ink node-fill" height="44" rx="6" width="260" x="450" y="152"></rect>
<text class="node-label" text-anchor="middle" x="580" y="179">JS 值与变量</text>
<rect class="diagram-ink node-fill" height="44" rx="6" width="260" x="450" y="208"></rect>
<text class="node-label" text-anchor="middle" x="580" y="235">函数执行</text>
<rect class="diagram-ink node-fill" height="44" rx="6" width="260" x="450" y="264"></rect>
<text class="node-label" text-anchor="middle" x="580" y="291">narrowing 运行时辨型</text>
<rect class="diagram-accent node-fill-accent" height="44" rx="6" width="260" x="450" y="320"></rect>
<text class="node-label-accent" text-anchor="middle" x="580" y="342">enum</text>
<text class="edge-label" text-anchor="middle" x="580" y="358">少数会留到运行时的类型语法</text>
<!-- compile arrow across the clear gap (x 330..430) -->
<text class="branch-label" text-anchor="middle" x="380" y="280">tsc 编译</text>
<line class="diagram-accent" marker-end="url(#arrow-vermilion)" x1="332" x2="448" y1="286" y2="286"></line>
<text class="edge-label" text-anchor="middle" x="380" y="304">类型丢弃</text>
</svg>