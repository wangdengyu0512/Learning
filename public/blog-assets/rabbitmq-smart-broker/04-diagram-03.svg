<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="RabbitMQ / Kafka / Streams 选型决策树" role="img" viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg"><style>
.diagram-ink{stroke:#0A0A0A;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.diagram-accent{stroke:#B73B2F;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.diagram-soft{stroke:#A3A3A3;fill:none;stroke-width:1.1;stroke-dasharray:3 3}
.node-fill{fill:#FFFFFF}.node-fill-accent{fill:rgba(183,59,47,0.06)}
.node-label{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#0A0A0A}
.node-label-accent{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:700;fill:#B73B2F}
.edge-label{font-family:Consolas,monospace;font-size:11px;fill:#525252;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.branch-label{font-family:Consolas,monospace;font-size:11px;font-weight:700;fill:#B73B2F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<defs>
<marker id="ar-ink2" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
</defs>
<!-- start -->
<rect class="diagram-ink node-fill" height="38" rx="6" width="144" x="278" y="16"></rect>
<text class="node-label" text-anchor="middle" x="350" y="40">选型起点</text>
<!-- Q1 diamond -->
<polygon class="diagram-ink node-fill" points="350,72 470,118 350,164 230,118"></polygon>
<text class="node-label" text-anchor="middle" x="350" y="108">需要复杂路由 / RPC /</text>
<text class="node-label" text-anchor="middle" x="350" y="126">每消息工作流？</text>
<line class="diagram-ink" marker-end="url(#ar-ink2)" x1="350" x2="350" y1="54" y2="72"></line>
<!-- Q1 yes -> RabbitMQ terminal (left) -->
<line class="diagram-ink" marker-end="url(#ar-ink2)" x1="230" x2="118" y1="118" y2="118"></line>
<text class="branch-label" text-anchor="middle" x="190" y="108">是</text>
<rect class="diagram-accent node-fill-accent" height="44" rx="6" stroke-width="2" width="104" x="14" y="96"></rect>
<text class="node-label-accent" text-anchor="middle" x="66" y="123">RabbitMQ</text>
<!-- Q1 no -> Q2 -->
<line class="diagram-ink" marker-end="url(#ar-ink2)" x1="350" x2="350" y1="164" y2="190"></line>
<text class="branch-label" text-anchor="middle" x="368" y="182">否</text>
<!-- Q2 diamond -->
<polygon class="diagram-ink node-fill" points="350,190 478,238 350,286 222,238"></polygon>
<text class="node-label" text-anchor="middle" x="350" y="228">需要重放 / 事件溯源 /</text>
<text class="node-label" text-anchor="middle" x="350" y="246">超高吞吐？</text>
<!-- Q2 no -> RabbitMQ terminal (right, low-latency modest volume) -->
<line class="diagram-ink" marker-end="url(#ar-ink2)" x1="478" x2="582" y1="238" y2="238"></line>
<text class="branch-label" text-anchor="middle" x="528" y="228">否</text>
<rect class="diagram-accent node-fill-accent" height="60" rx="6" stroke-width="2" width="108" x="582" y="208"></rect>
<text class="node-label-accent" text-anchor="middle" x="636" y="232">RabbitMQ</text>
<text class="edge-label" text-anchor="middle" x="636" y="252">低延迟·中吞吐</text>
<!-- Q2 yes -> Q3 -->
<line class="diagram-ink" marker-end="url(#ar-ink2)" x1="350" x2="350" y1="286" y2="312"></line>
<text class="branch-label" text-anchor="middle" x="368" y="304">是</text>
<!-- Q3 diamond -->
<polygon class="diagram-ink node-fill" points="350,312 486,360 350,408 214,360"></polygon>
<text class="node-label" text-anchor="middle" x="350" y="350">想留在 RabbitMQ 生态、</text>
<text class="node-label" text-anchor="middle" x="350" y="368">吞吐不极端？</text>
<!-- Q3 yes -> Streams (left) -->
<line class="diagram-ink" marker-end="url(#ar-ink2)" x1="214" x2="118" y1="360" y2="360"></line>
<text class="branch-label" text-anchor="middle" x="178" y="350">是</text>
<rect class="diagram-accent node-fill-accent" height="44" rx="6" stroke-width="2" width="112" x="6" y="338"></rect>
<text class="node-label-accent" text-anchor="middle" x="62" y="356">RabbitMQ</text>
<text class="node-label-accent" text-anchor="middle" x="62" y="374">Streams</text>
<!-- Q3 no -> Kafka (right) -->
<line class="diagram-ink" marker-end="url(#ar-ink2)" x1="486" x2="582" y1="360" y2="360"></line>
<text class="branch-label" text-anchor="middle" x="528" y="350">否</text>
<rect class="diagram-ink node-fill" height="44" rx="6" width="104" x="582" y="338"></rect>
<text class="node-label" text-anchor="middle" x="634" y="365">Kafka</text>
</svg>