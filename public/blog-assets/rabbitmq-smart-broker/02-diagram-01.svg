<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="两段确认：Producer 到 Broker 到 Consumer，含 confirm 回执与 ack 回执" role="img" viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg"><style>
.diagram-ink{stroke:#0A0A0A;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.diagram-accent{stroke:#B73B2F;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.diagram-soft{stroke:#A3A3A3;fill:none;stroke-width:1.1;stroke-dasharray:3 3}
.node-fill{fill:#FFFFFF}.node-fill-accent{fill:rgba(183,59,47,0.06)}
.node-label{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#0A0A0A}
.node-label-accent{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:700;fill:#B73B2F}
.edge-label{font-family:Consolas,monospace;font-size:11px;fill:#525252;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.branch-label{font-family:Consolas,monospace;font-size:11px;font-weight:700;fill:#B73B2F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<defs>
<marker id="ar-ink" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
<marker id="ar-verm" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
</defs>
<rect class="diagram-ink node-fill" height="54" rx="6" width="118" x="22" y="98"></rect>
<text class="node-label" text-anchor="middle" x="81" y="123">Producer</text>
<text class="edge-label" text-anchor="middle" x="81" y="141">发送端</text>
<rect class="diagram-accent node-fill-accent" height="54" rx="6" stroke-width="2" width="118" x="291" y="98"></rect>
<text class="node-label-accent" text-anchor="middle" x="350" y="123">Broker</text>
<text class="edge-label" text-anchor="middle" x="350" y="141">队列</text>
<rect class="diagram-ink node-fill" height="54" rx="6" width="118" x="560" y="98"></rect>
<text class="node-label" text-anchor="middle" x="619" y="123">Consumer</text>
<text class="edge-label" text-anchor="middle" x="619" y="141">消费端</text>
<line class="diagram-ink" marker-end="url(#ar-ink)" x1="140" x2="291" y1="113" y2="113"></line>
<text class="edge-label" text-anchor="middle" x="215" y="105">publish</text>
<path class="diagram-accent" d="M 291 138 C 240 168, 191 168, 140 138" fill="none" marker-end="url(#ar-verm)"></path>
<text class="branch-label" text-anchor="middle" x="215" y="183">confirm：已托管</text>
<line class="diagram-ink" marker-end="url(#ar-ink)" x1="409" x2="560" y1="113" y2="113"></line>
<text class="edge-label" text-anchor="middle" x="484" y="105">deliver</text>
<path class="diagram-accent" d="M 560 138 C 509 168, 460 168, 409 138" fill="none" marker-end="url(#ar-verm)"></path>
<text class="branch-label" text-anchor="middle" x="484" y="183">ack：可删除</text>
<text class="edge-label" text-anchor="middle" x="215" y="222">补的接缝①：发送端</text>
<text class="edge-label" text-anchor="middle" x="484" y="222">补的接缝②：消费端</text>
</svg>