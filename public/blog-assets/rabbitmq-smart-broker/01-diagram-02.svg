<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="一条 routing key 为 payment.error 的消息经 topic exchange 的路由结果" role="img" viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg"><style>
.diagram-ink{stroke:#0A0A0A;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.diagram-accent{stroke:#B73B2F;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.diagram-soft{stroke:#A3A3A3;fill:none;stroke-width:1.1;stroke-dasharray:3 3}
.node-fill{fill:#FFFFFF}.node-fill-accent{fill:rgba(183,59,47,0.06)}
.node-label{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#0A0A0A}
.node-label-accent{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:700;fill:#B73B2F}
.edge-label{font-family:Consolas,monospace;font-size:11px;fill:#525252;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.branch-label{font-family:Consolas,monospace;font-size:11px;font-weight:700;fill:#B73B2F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<defs>
<marker id="ar-ink2" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
<marker id="ar-verm2" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
<marker id="ar-soft2" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#A3A3A3"></path>
</marker>
</defs>
<rect class="diagram-ink node-fill" height="50" rx="6" width="104" x="18" y="135"></rect>
<text class="node-label" text-anchor="middle" x="70" y="158">Producer</text>
<text class="edge-label" text-anchor="middle" x="70" y="176">发布</text>
<line class="diagram-ink" marker-end="url(#ar-ink2)" x1="122" x2="232" y1="160" y2="160"></line>
<text class="edge-label" text-anchor="middle" x="177" y="150">payment.error</text>
<rect class="diagram-accent node-fill-accent" height="64" rx="6" stroke-width="2" width="138" x="232" y="128"></rect>
<text class="node-label-accent" text-anchor="middle" x="301" y="153">topic exchange</text>
<text class="edge-label" text-anchor="middle" x="301" y="173">orders</text>
<rect class="diagram-ink node-fill" height="52" rx="6" width="154" x="528" y="36"></rect>
<text class="node-label" text-anchor="middle" x="605" y="59">alerts</text>
<text class="edge-label" text-anchor="middle" x="605" y="77">命中 ✓</text>
<rect class="diagram-ink node-fill" height="52" rx="6" width="154" x="528" y="134"></rect>
<text class="node-label" text-anchor="middle" x="605" y="157">payment-log</text>
<text class="edge-label" text-anchor="middle" x="605" y="175">命中 ✓</text>
<rect class="diagram-soft node-fill" height="52" rx="6" width="154" x="528" y="232"></rect>
<text class="node-label" text-anchor="middle" x="605" y="255">order-flow</text>
<text class="edge-label" text-anchor="middle" x="605" y="273">落空</text>
<line class="diagram-accent" marker-end="url(#ar-verm2)" x1="370" x2="528" y1="150" y2="64"></line>
<text class="branch-label" text-anchor="middle" x="455" y="98">*.error</text>
<line class="diagram-accent" marker-end="url(#ar-verm2)" x1="370" x2="528" y1="160" y2="160"></line>
<text class="branch-label" text-anchor="middle" x="449" y="151">payment.*</text>
<line class="diagram-soft" marker-end="url(#ar-soft2)" x1="370" x2="528" y1="172" y2="256"></line>
<text class="edge-label" text-anchor="middle" x="452" y="232">order.#</text>
</svg>