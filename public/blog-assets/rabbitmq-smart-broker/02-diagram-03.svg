<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="死信流：主队列经三类触发进 DLX，再分流到重试队列或死信队列" role="img" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg"><style>
.diagram-ink{stroke:#0A0A0A;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.diagram-accent{stroke:#B73B2F;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.diagram-soft{stroke:#A3A3A3;fill:none;stroke-width:1.1;stroke-dasharray:3 3}
.node-fill{fill:#FFFFFF}.node-fill-accent{fill:rgba(183,59,47,0.06)}
.node-label{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#0A0A0A}
.node-label-accent{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:700;fill:#B73B2F}
.edge-label{font-family:Consolas,monospace;font-size:11px;fill:#525252;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.branch-label{font-family:Consolas,monospace;font-size:11px;font-weight:700;fill:#B73B2F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<defs>
<marker id="ar-ink3" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
<marker id="ar-verm3" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
</defs>
<rect class="diagram-ink node-fill" height="58" rx="6" width="132" x="24" y="116"></rect>
<text class="node-label" text-anchor="middle" x="90" y="140">主队列</text>
<text class="edge-label" text-anchor="middle" x="90" y="159">orders</text>
<rect class="diagram-accent node-fill-accent" height="58" rx="6" stroke-width="2" width="118" x="300" y="116"></rect>
<text class="node-label-accent" text-anchor="middle" x="359" y="140">DLX</text>
<text class="edge-label" text-anchor="middle" x="359" y="159">死信交换机</text>
<rect class="diagram-ink node-fill" height="54" rx="6" width="132" x="552" y="48"></rect>
<text class="node-label" text-anchor="middle" x="618" y="71">重试队列</text>
<text class="edge-label" text-anchor="middle" x="618" y="89">延迟后回主队列</text>
<rect class="diagram-ink node-fill" height="54" rx="6" width="132" x="552" y="186"></rect>
<text class="node-label" text-anchor="middle" x="618" y="209">死信队列</text>
<text class="edge-label" text-anchor="middle" x="618" y="227">人工 / 归档</text>
<line class="diagram-accent" marker-end="url(#ar-verm3)" x1="156" x2="300" y1="145" y2="145"></line>
<text class="branch-label" text-anchor="middle" x="228" y="118">reject(requeue=false)</text>
<text class="branch-label" text-anchor="middle" x="228" y="160">TTL 过期 · 超长 · 超重试</text>
<line class="diagram-ink" marker-end="url(#ar-ink3)" x1="418" x2="552" y1="132" y2="80"></line>
<text class="edge-label" text-anchor="middle" x="486" y="100">可恢复</text>
<line class="diagram-ink" marker-end="url(#ar-ink3)" x1="418" x2="552" y1="158" y2="210"></line>
<text class="edge-label" text-anchor="middle" x="486" y="196">不可恢复</text>
<path class="diagram-soft" d="M 618 48 C 618 16, 90 16, 90 116" fill="none" marker-end="url(#ar-ink3)"></path>
<text class="edge-label" text-anchor="middle" x="350" y="14">退避后重投，x-death 计数累加</text>
</svg>