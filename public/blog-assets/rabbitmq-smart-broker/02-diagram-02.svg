<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="三层防护：durable 挡重启、persistent 挡常规、quorum 挡崩溃窗口" role="img" viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg"><style>
.diagram-ink{stroke:#0A0A0A;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.diagram-accent{stroke:#B73B2F;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.diagram-soft{stroke:#A3A3A3;fill:none;stroke-width:1.1;stroke-dasharray:3 3}
.node-fill{fill:#FFFFFF}.node-fill-accent{fill:rgba(183,59,47,0.06)}
.node-label{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#0A0A0A}
.node-label-accent{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:700;fill:#B73B2F}
.edge-label{font-family:Consolas,monospace;font-size:11px;fill:#525252;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.branch-label{font-family:Consolas,monospace;font-size:11px;font-weight:700;fill:#B73B2F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<defs>
<marker id="ar-ink2" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
<marker id="ar-verm2" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
</defs>
<text class="node-label" font-weight="700" text-anchor="middle" x="350" y="26">一条持久化消息要扛过的三种失败</text>
<rect class="diagram-ink node-fill" height="50" rx="6" width="460" x="120" y="52"></rect>
<text class="node-label" text-anchor="middle" x="350" y="74">durable 队列定义</text>
<text class="edge-label" text-anchor="middle" x="350" y="92">让队列在 broker 重启后仍存在</text>
<text class="branch-label" text-anchor="start" x="610" y="82">挡：重启</text>
<rect class="diagram-ink node-fill" height="50" rx="6" width="460" x="120" y="120"></rect>
<text class="node-label" text-anchor="middle" x="350" y="142">persistent 消息落盘</text>
<text class="edge-label" text-anchor="middle" x="350" y="160">消息标记写盘，配合 durable 才生效</text>
<text class="branch-label" text-anchor="start" x="610" y="150">挡：常规重启</text>
<rect class="diagram-accent node-fill-accent" height="58" rx="6" stroke-width="2" width="460" x="120" y="188"></rect>
<text class="node-label-accent" text-anchor="middle" x="350" y="211">quorum 多副本（Raft）</text>
<text class="edge-label" text-anchor="middle" x="350" y="229">提交到多数派副本后才回 confirm</text>
<text class="branch-label" text-anchor="start" x="610" y="220">挡：单机崩溃</text>
<rect class="diagram-soft node-fill" height="40" rx="6" width="460" x="120" y="266"></rect>
<text class="edge-label" text-anchor="middle" x="350" y="290">↑ 只有 classic：confirm 后 fsync 前的崩溃窗口仍丢 — quorum 关掉它</text>
<line class="diagram-soft" x1="100" x2="100" y1="77" y2="217"></line>
<text class="edge-label" text-anchor="middle" transform="rotate(-90 92 150)" x="92" y="150">防护逐层加深</text>
</svg>