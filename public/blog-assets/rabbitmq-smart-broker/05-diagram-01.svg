<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="三层难度梯度：概念层、原理层、判别层，难度自下而上递增" role="img" viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg"><style>
.diagram-ink{stroke:#0A0A0A;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.diagram-accent{stroke:#B73B2F;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.diagram-soft{stroke:#A3A3A3;fill:none;stroke-width:1.1;stroke-dasharray:3 3}
.node-fill{fill:#FFFFFF}.node-fill-accent{fill:rgba(183,59,47,0.06)}
.node-label{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#0A0A0A}
.node-label-accent{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:700;fill:#B73B2F}
.edge-label{font-family:Consolas,monospace;font-size:11px;fill:#525252;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.branch-label{font-family:Consolas,monospace;font-size:11px;font-weight:700;fill:#B73B2F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<defs>
<marker id="m-up" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
</defs>
<rect class="diagram-ink node-fill" height="58" rx="6" width="400" x="160" y="232"></rect>
<text class="node-label" text-anchor="middle" x="360" y="256">概念层 · 回忆</text>
<text class="edge-label" text-anchor="middle" x="360" y="276">对应 01 · 5 题</text>
<rect class="diagram-ink node-fill" height="58" rx="6" width="300" x="210" y="160"></rect>
<text class="node-label" text-anchor="middle" x="360" y="184">原理层 · 理解</text>
<text class="edge-label" text-anchor="middle" x="360" y="204">对应 02 · 03 · 7 题</text>
<rect class="diagram-accent node-fill-accent" height="58" rx="6" stroke-width="2" width="200" x="260" y="88"></rect>
<text class="node-label-accent" text-anchor="middle" x="360" y="112">判别层 · 迁移</text>
<text class="edge-label" text-anchor="middle" x="360" y="132">综合 01–04 · 5 题</text>
<line class="diagram-accent" marker-end="url(#m-up)" x1="96" x2="96" y1="288" y2="92"></line>
