<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="左右并排对照 RabbitMQ 路由删除架构与 Kafka 不可变日志架构" role="img" viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg"><style>
.diagram-ink{stroke:#0A0A0A;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.diagram-accent{stroke:#B73B2F;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.diagram-soft{stroke:#A3A3A3;fill:none;stroke-width:1.1;stroke-dasharray:3 3}
.node-fill{fill:#FFFFFF}.node-fill-accent{fill:rgba(183,59,47,0.06)}
.node-label{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#0A0A0A}
.node-label-accent{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:700;fill:#B73B2F}
.edge-label{font-family:Consolas,monospace;font-size:11px;fill:#525252;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.branch-label{font-family:Consolas,monospace;font-size:11px;font-weight:700;fill:#B73B2F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<defs>
<marker id="ar-ink" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
<marker id="ar-verm" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
</defs>
<text class="node-label-accent" text-anchor="middle" x="175" y="22">RabbitMQ · 被路由的临时信箱</text>
<text class="node-label" text-anchor="middle" x="525" y="22">Kafka · 可重放的持久账本</text>
<line class="diagram-soft" x1="350" x2="350" y1="36" y2="300"></line>
<!-- LEFT: RabbitMQ -->
<rect class="diagram-ink node-fill" height="40" rx="6" width="78" x="22" y="58"></rect>
<text class="node-label" text-anchor="middle" x="61" y="82">Producer</text>
<rect class="diagram-accent node-fill-accent" height="52" rx="6" stroke-width="2" width="92" x="128" y="52"></rect>
<text class="node-label-accent" text-anchor="middle" x="174" y="74">exchange</text>
<text class="edge-label" text-anchor="middle" x="174" y="92">路由</text>
<rect class="diagram-ink node-fill" height="44" rx="6" width="112" x="118" y="150"></rect>
<text class="node-label" text-anchor="middle" x="174" y="170">queue</text>
<text class="edge-label" text-anchor="middle" x="174" y="187">broker 持状态</text>
<rect class="diagram-ink node-fill" height="40" rx="6" width="112" x="118" y="240"></rect>
<text class="node-label" text-anchor="middle" x="174" y="264">Consumer</text>
<line class="diagram-ink" marker-end="url(#ar-ink)" x1="100" x2="128" y1="78" y2="78"></line>
<line class="diagram-accent" marker-end="url(#ar-verm)" x1="174" x2="174" y1="104" y2="150"></line>
<text class="branch-label" text-anchor="middle" x="174" y="128">binding</text>
<line class="diagram-ink" marker-end="url(#ar-ink)" x1="174" x2="174" y1="194" y2="240"></line>
<text class="edge-label" text-anchor="middle" x="206" y="220">push</text>
<path class="diagram-accent" d="M 230 260 C 290 260, 290 172, 232 172" fill="none" marker-end="url(#ar-verm)"></path>
<text class="branch-label" text-anchor="middle" x="300" y="218">ack→删除</text>
<!-- RIGHT: Kafka -->
<rect class="diagram-ink node-fill" height="40" rx="6" width="78" x="372" y="58"></rect>
<text class="node-label" text-anchor="middle" x="411" y="82">Producer</text>
<text class="edge-label" text-anchor="middle" x="525" y="128">partition（仅追加 · 不可变）</text>
<g>
<rect class="diagram-ink node-fill" height="40" width="34" x="392" y="138"></rect>
<rect class="diagram-ink node-fill" height="40" width="34" x="426" y="138"></rect>
<rect class="diagram-ink node-fill" height="40" width="34" x="460" y="138"></rect>
<rect class="diagram-ink node-fill" height="40" width="34" x="494" y="138"></rect>
<rect class="diagram-soft node-fill" height="40" width="34" x="528" y="138"></rect>
<rect class="diagram-soft node-fill" height="40" width="34" x="562" y="138"></rect>
<text class="edge-label" text-anchor="middle" x="409" y="163">0</text>
<text class="edge-label" text-anchor="middle" x="443" y="163">1</text>
<text class="edge-label" text-anchor="middle" x="477" y="163">2</text>
<text class="edge-label" text-anchor="middle" x="511" y="163">3</text>
<text class="edge-label" text-anchor="middle" x="545" y="163">4</text>
<text class="edge-label" text-anchor="middle" x="579" y="163">…</text>
</g>
<line class="diagram-ink" marker-end="url(#ar-ink)" x1="450" x2="470" y1="100" y2="136"></line>
<text class="edge-label" text-anchor="middle" x="430" y="120">append</text>
<rect class="diagram-ink node-fill" height="40" rx="6" width="116" x="470" y="240"></rect>
<text class="node-label" text-anchor="middle" x="528" y="264">Consumer</text>
<line class="diagram-accent" marker-end="url(#ar-verm)" x1="511" x2="528" y1="182" y2="240"></line>
<text class="branch-label" text-anchor="middle" x="556" y="214">offset=3</text>
<path class="diagram-soft" d="M 470 250 C 410 250, 410 182, 408 182" fill="none" marker-end="url(#ar-ink)"></path>
<text class="edge-label" text-anchor="middle" x="392" y="214">可倒带重读</text>
</svg>