<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="左侧 InnoDB 原地更新加 undo 链，右侧 PG 堆内多版本" role="img" viewbox="0 0 760 360" xmlns="http://www.w3.org/2000/svg"><style>:root {
  --bg: #ffffff;
  --ink: #0a0a0a;
  --ink-soft: #525252;
  --ink-faint: #a3a3a3;
  --vermilion: #b73b2f;
  --vermilion-soft: rgba(183, 59, 47, 0.08);
  --sans: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
}
.diagram-ink { stroke: var(--ink); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: var(--vermilion); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: var(--ink-faint); fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: var(--bg); }
.node-fill-accent { fill: var(--vermilion-soft); }
.node-label { font-family: var(--sans); font-size: 13px; font-weight: 500; fill: var(--ink); }
.node-label-accent { font-family: var(--sans); font-size: 13px; font-weight: 700; fill: var(--vermilion); }
.edge-label { font-family: var(--mono); font-size: 11px; fill: var(--ink-soft); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: var(--mono); font-size: 11px; font-weight: 700; fill: var(--vermilion); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="m-verm-m" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
<marker id="m-ink-m" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
</defs>
<line class="diagram-soft" x1="380" x2="380" y1="30" y2="340"></line>
<text class="node-label-accent" text-anchor="middle" x="190" y="22">InnoDB · undo</text>
<text class="node-label" text-anchor="middle" x="570" y="22">PostgreSQL · 堆内</text>
<!-- ===== LEFT InnoDB ===== -->
<!-- current row in clustered index -->
<rect class="diagram-accent node-fill-accent" height="58" rx="6" stroke-width="2" width="170" x="40" y="52"></rect>
<text class="node-label-accent" text-anchor="middle" x="125" y="74">当前行（原地）</text>
<text class="edge-label" text-anchor="middle" x="125" y="92">balance = 80</text>
<text class="edge-label" text-anchor="middle" x="125" y="105">DB_ROLL_PTR ↓</text>
<!-- roll ptr arrow into undo -->
<line class="diagram-ink" marker-end="url(#m-ink-m)" x1="125" x2="125" y1="110" y2="150"></line>
<text class="edge-label" text-anchor="start" x="132" y="133">回溯</text>
<!-- undo log chain -->
<rect class="diagram-ink node-fill" height="40" rx="4" width="170" x="40" y="150"></rect>
<text class="edge-label" text-anchor="middle" x="125" y="166">undo: 旧值 100</text>
<text class="edge-label" text-anchor="middle" x="125" y="181">DB_ROLL_PTR ↓</text>
<line class="diagram-soft" marker-end="url(#m-ink-m)" x1="125" x2="125" y1="190" y2="214"></line>
<rect class="diagram-soft node-fill" height="34" rx="4" width="170" x="40" y="214"></rect>
<text class="edge-label" text-anchor="middle" x="125" y="235">undo: 更旧值…</text>
<text class="edge-label" text-anchor="middle" x="125" y="282">读旧版本=沿 undo 链重建</text>
<text class="branch-label" text-anchor="middle" x="125" y="304">长事务 → undo 撑大</text>
<text class="edge-label" text-anchor="middle" x="125" y="324">表本身不膨胀</text>
<!-- ===== RIGHT PG ===== -->
<text class="node-label" text-anchor="middle" x="570" y="52">同一个 heap page</text>
<rect class="diagram-soft node-fill" height="58" rx="6" width="130" x="430" y="64"></rect>
<text class="edge-label" text-anchor="middle" x="495" y="86">v1 旧版本</text>
<text class="edge-label" text-anchor="middle" x="495" y="103">xmax = 205</text>
<text class="branch-label" text-anchor="middle" x="495" y="117">死元组</text>
<rect class="diagram-accent node-fill-accent" height="58" rx="6" stroke-width="2" width="130" x="580" y="64"></rect>
<text class="node-label-accent" text-anchor="middle" x="645" y="86">v2 新版本</text>
<text class="edge-label" text-anchor="middle" x="645" y="103">xmin = 205</text>
<text class="edge-label" text-anchor="middle" x="645" y="117">当前有效</text>
<line class="diagram-accent" marker-end="url(#m-verm-m)" x1="560" x2="578" y1="93" y2="93"></line>
<text class="edge-label" text-anchor="middle" x="570" y="160">两份完整 tuple 并存堆中</text>
<line class="diagram-ink" marker-end="url(#m-ink-m)" x1="495" x2="495" y1="170" y2="200"></line>
<rect class="diagram-ink node-fill" height="40" rx="4" width="280" x="430" y="200"></rect>
<text class="edge-label" text-anchor="middle" x="570" y="225">VACUUM 回收死元组</text>
<text class="edge-label" text-anchor="middle" x="570" y="282">读旧版本=直接读那份 tuple</text>
<text class="branch-label" text-anchor="middle" x="570" y="304">长事务 → 表+索引膨胀</text>
<text class="edge-label" text-anchor="middle" x="570" y="324">VACUUM 被老快照拦住</text>
</svg>