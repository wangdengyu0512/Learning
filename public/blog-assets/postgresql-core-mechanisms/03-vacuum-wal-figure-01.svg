<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="普通 VACUUM 与 VACUUM FULL 的对比" role="img" viewbox="0 0 640 360" xmlns="http://www.w3.org/2000/svg"><style>:root {
  --bg: #ffffff;
  --ink: #0a0a0a;
  --ink-soft: #525252;
  --ink-faint: #a3a3a3;
  --vermilion: #b73b2f;
  --vermilion-soft: rgba(183, 59, 47, 0.08);
  --sans: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
}
.diagram-ink { stroke: var(--ink); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: var(--vermilion); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: var(--ink-faint); fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: var(--bg); }
.node-fill-accent { fill: var(--vermilion-soft); }
.node-label { font-family: var(--sans); font-size: 13px; font-weight: 500; fill: var(--ink); }
.node-label-accent { font-family: var(--sans); font-size: 13px; font-weight: 700; fill: var(--vermilion); }
.edge-label { font-family: var(--mono); font-size: 11px; fill: var(--ink-soft); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: var(--mono); font-size: 11px; font-weight: 700; fill: var(--vermilion); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="m-verm" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
<marker id="m-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
</defs>
<!-- left: plain VACUUM -->
<text class="node-label" text-anchor="middle" x="160" y="28">普通 VACUUM</text>
<text class="edge-label" text-anchor="middle" x="160" y="45">同一文件 · 大小不变</text>
<!-- before file (left) -->
<rect class="diagram-ink node-fill" height="240" rx="4" width="84" x="60" y="60"></rect>
<rect class="diagram-ink node-fill" height="40" width="76" x="64" y="64"></rect>
<text class="edge-label" text-anchor="middle" x="102" y="88">live</text>
<rect class="node-fill-accent" height="40" stroke="none" width="76" x="64" y="106"></rect>
<text class="branch-label" text-anchor="middle" x="102" y="130">dead</text>
<rect class="diagram-ink node-fill" height="40" width="76" x="64" y="148"></rect>
<text class="edge-label" text-anchor="middle" x="102" y="172">live</text>
<rect class="node-fill-accent" height="40" stroke="none" width="76" x="64" y="190"></rect>
<text class="branch-label" text-anchor="middle" x="102" y="214">dead</text>
<rect class="diagram-ink node-fill" height="64" width="76" x="64" y="232"></rect>
<text class="edge-label" text-anchor="middle" x="102" y="268">live</text>
<line class="diagram-ink" marker-end="url(#m-ink)" x1="148" x2="186" y1="180" y2="180"></line>
<!-- after file (left) - same size, dead marked reusable -->
<rect class="diagram-ink node-fill" height="240" rx="4" width="84" x="190" y="60"></rect>
<rect class="diagram-ink node-fill" height="40" width="76" x="194" y="64"></rect>
<text class="edge-label" text-anchor="middle" x="232" y="88">live</text>
<rect class="diagram-soft node-fill" height="40" width="76" x="194" y="106"></rect>
<text class="edge-label" text-anchor="middle" x="232" y="124">可复用</text>
<text class="edge-label" text-anchor="middle" x="232" y="140">空洞</text>
<rect class="diagram-ink node-fill" height="40" width="76" x="194" y="148"></rect>
<text class="edge-label" text-anchor="middle" x="232" y="172">live</text>
<rect class="diagram-soft node-fill" height="40" width="76" x="194" y="190"></rect>
<text class="edge-label" text-anchor="middle" x="232" y="208">可复用</text>
<text class="edge-label" text-anchor="middle" x="232" y="224">空洞</text>
<rect class="diagram-ink node-fill" height="64" width="76" x="194" y="232"></rect>
<text class="edge-label" text-anchor="middle" x="232" y="268">live</text>
<text class="edge-label" text-anchor="middle" x="232" y="316">文件等长</text>
<text class="branch-label" text-anchor="middle" x="160" y="338">不还盘 · 不锁表</text>
<!-- divider -->
<line class="diagram-soft" x1="320" x2="320" y1="56" y2="320"></line>
<!-- right: VACUUM FULL -->
<text class="node-label-accent" text-anchor="middle" x="480" y="28">VACUUM FULL</text>
<text class="edge-label" text-anchor="middle" x="480" y="45">重写到新文件 · 还盘</text>
<!-- old file (right) -->
<rect class="diagram-soft node-fill" height="240" rx="4" width="84" x="370" y="60"></rect>
<rect class="diagram-ink node-fill" height="40" width="76" x="374" y="64"></rect>
<text class="edge-label" text-anchor="middle" x="412" y="88">live</text>
<rect class="node-fill-accent" height="40" stroke="none" width="76" x="374" y="106"></rect>
<text class="branch-label" text-anchor="middle" x="412" y="130">dead</text>
<rect class="diagram-ink node-fill" height="40" width="76" x="374" y="148"></rect>
<text class="edge-label" text-anchor="middle" x="412" y="172">live</text>
<rect class="node-fill-accent" height="40" stroke="none" width="76" x="374" y="190"></rect>
<text class="branch-label" text-anchor="middle" x="412" y="214">dead</text>
<rect class="diagram-ink node-fill" height="64" width="76" x="374" y="232"></rect>
<text class="edge-label" text-anchor="middle" x="412" y="268">live</text>
<text class="branch-label" text-anchor="middle" x="412" y="316">旧文件释放</text>
<line class="diagram-accent" marker-end="url(#m-verm)" x1="458" x2="520" y1="160" y2="160"></line>
<text class="branch-label" text-anchor="middle" x="489" y="150">重写</text>
<!-- new file (right) - smaller, packed -->
<rect class="diagram-accent node-fill" height="120" rx="4" stroke-width="2" width="84" x="524" y="120"></rect>
<rect class="diagram-ink node-fill" height="36" width="76" x="528" y="124"></rect>
<text class="edge-label" text-anchor="middle" x="566" y="146">live</text>
<rect class="diagram-ink node-fill" height="36" width="76" x="528" y="162"></rect>
<text class="edge-label" text-anchor="middle" x="566" y="184">live</text>
<rect class="diagram-ink node-fill" height="36" width="76" x="528" y="200"></rect>
<text class="edge-label" text-anchor="middle" x="566" y="222">live</text>
<text class="branch-label" text-anchor="middle" x="566" y="256">紧凑 · 变小</text>
<text class="edge-label" text-anchor="middle" x="566" y="316">ACCESS EXCL 锁</text>
</svg>