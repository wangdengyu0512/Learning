<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="B-tree 的 root、internal、leaf 三层结构，叶子双向链指向 ctid" role="img" viewbox="0 0 600 340" xmlns="http://www.w3.org/2000/svg"><style>:root {
  --bg: #ffffff;
  --ink: #0a0a0a;
  --ink-soft: #525252;
  --ink-faint: #a3a3a3;
  --vermilion: #b73b2f;
  --vermilion-soft: rgba(183, 59, 47, 0.08);
  --sans: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
}
.diagram-ink { stroke: var(--ink); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: var(--vermilion); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: var(--ink-faint); fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: var(--bg); }
.node-fill-accent { fill: var(--vermilion-soft); }
.node-label { font-family: var(--sans); font-size: 13px; font-weight: 500; fill: var(--ink); }
.node-label-accent { font-family: var(--sans); font-size: 13px; font-weight: 700; fill: var(--vermilion); }
.edge-label { font-family: var(--mono); font-size: 11px; fill: var(--ink-soft); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: var(--mono); font-size: 11px; font-weight: 700; fill: var(--vermilion); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="m-ink-bt" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
<marker id="m-verm-bt" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
</defs>
<!-- root -->
<rect class="diagram-ink node-fill-accent" height="40" rx="4" width="100" x="250" y="20"></rect>
<text class="node-label" text-anchor="middle" x="300" y="44">root</text>
<!-- internal -->
<rect class="diagram-ink node-fill" height="40" rx="4" width="110" x="120" y="110"></rect>
<text class="node-label" text-anchor="middle" x="175" y="134">internal</text>
<rect class="diagram-ink node-fill" height="40" rx="4" width="110" x="370" y="110"></rect>
<text class="node-label" text-anchor="middle" x="425" y="134">internal</text>
<!-- root -> internal -->
<line class="diagram-ink" marker-end="url(#m-ink-bt)" x1="285" x2="200" y1="60" y2="108"></line>
<line class="diagram-ink" marker-end="url(#m-ink-bt)" x1="315" x2="400" y1="60" y2="108"></line>
<!-- leaves -->
<rect class="diagram-ink node-fill" height="44" rx="4" width="96" x="40" y="200"></rect>
<text class="edge-label" text-anchor="middle" x="88" y="220">leaf · 键有序</text>
<text class="edge-label" text-anchor="middle" x="88" y="236">10 · 14 · 19</text>
<rect class="diagram-ink node-fill" height="44" rx="4" width="96" x="216" y="200"></rect>
<text class="edge-label" text-anchor="middle" x="264" y="220">leaf</text>
<text class="edge-label" text-anchor="middle" x="264" y="236">23 · 28 · 30</text>
<rect class="diagram-ink node-fill" height="44" rx="4" width="96" x="392" y="200"></rect>
<text class="edge-label" text-anchor="middle" x="440" y="220">leaf</text>
<text class="edge-label" text-anchor="middle" x="440" y="236">41 · 50 · 62</text>
<!-- internal -> leaf -->
<line class="diagram-ink" marker-end="url(#m-ink-bt)" x1="160" x2="100" y1="150" y2="198"></line>
<line class="diagram-ink" marker-end="url(#m-ink-bt)" x1="190" x2="252" y1="150" y2="198"></line>
<line class="diagram-ink" marker-end="url(#m-ink-bt)" x1="425" x2="440" y1="150" y2="198"></line>
<!-- leaf doubly-linked -->
<line class="diagram-soft" marker-end="url(#m-ink-bt)" x1="136" x2="214" y1="216" y2="216"></line>
<line class="diagram-soft" marker-end="url(#m-ink-bt)" x1="214" x2="136" y1="228" y2="228"></line>
<line class="diagram-soft" marker-end="url(#m-ink-bt)" x1="312" x2="390" y1="216" y2="216"></line>
<line class="diagram-soft" marker-end="url(#m-ink-bt)" x1="390" x2="312" y1="228" y2="228"></line>
<!-- one leaf entry -> ctid in heap -->
<rect class="diagram-accent node-fill-accent" height="40" rx="4" stroke-width="1.6" width="200" x="216" y="288"></rect>
<text class="node-label-accent" text-anchor="middle" x="316" y="312">heap：ctid (block, offset)</text>
<line class="diagram-accent" marker-end="url(#m-verm-bt)" x1="264" x2="300" y1="244" y2="286"></line>
<text class="branch-label" text-anchor="middle" x="300" y="270">回表</text>
</svg>