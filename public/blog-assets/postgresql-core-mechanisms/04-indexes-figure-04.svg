<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="回表与 index-only scan 两条路径对比" role="img" viewbox="0 0 620 320" xmlns="http://www.w3.org/2000/svg"><style>:root {
  --bg: #ffffff;
  --ink: #0a0a0a;
  --ink-soft: #525252;
  --ink-faint: #a3a3a3;
  --vermilion: #b73b2f;
  --vermilion-soft: rgba(183, 59, 47, 0.08);
  --sans: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
}
.diagram-ink { stroke: var(--ink); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: var(--vermilion); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: var(--ink-faint); fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: var(--bg); }
.node-fill-accent { fill: var(--vermilion-soft); }
.node-label { font-family: var(--sans); font-size: 13px; font-weight: 500; fill: var(--ink); }
.node-label-accent { font-family: var(--sans); font-size: 13px; font-weight: 700; fill: var(--vermilion); }
.edge-label { font-family: var(--mono); font-size: 11px; fill: var(--ink-soft); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: var(--mono); font-size: 11px; font-weight: 700; fill: var(--vermilion); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="m-ink-io" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
<marker id="m-verm-io" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
</defs>
<!-- shared start: index -->
<rect class="diagram-ink node-fill" height="56" rx="5" width="120" x="40" y="130"></rect>
<text class="node-label" text-anchor="middle" x="100" y="154">索引项</text>
<text class="edge-label" text-anchor="middle" x="100" y="172">(key, ctid)</text>
<!-- upper path: 回表 -->
<text class="node-label" text-anchor="middle" x="100" y="40">上路 · 回表</text>
<line class="diagram-ink" marker-end="url(#m-ink-io)" x1="160" x2="250" y1="150" y2="86"></line>
<rect class="diagram-ink node-fill" height="56" rx="5" width="150" x="250" y="58"></rect>
<text class="edge-label" text-anchor="middle" x="325" y="82">回 heap page</text>
<text class="edge-label" text-anchor="middle" x="325" y="100">读整行 · 随机 I/O</text>
<line class="diagram-ink" marker-end="url(#m-ink-io)" x1="400" x2="486" y1="86" y2="86"></line>
<rect class="diagram-ink node-fill" height="56" rx="5" width="110" x="486" y="58"></rect>
<text class="node-label" text-anchor="middle" x="541" y="90">返回行</text>
<!-- lower path: index-only -->
<text class="node-label-accent" text-anchor="middle" x="100" y="296">下路 · index-only</text>
<line class="diagram-accent" marker-end="url(#m-verm-io)" x1="160" x2="250" y1="166" y2="230"></line>
<polygon class="diagram-accent node-fill-accent" points="250,230 330,202 410,230 330,258"></polygon>
<text class="branch-label" text-anchor="middle" x="330" y="227">VM = all-visible？</text>
<text class="edge-label" text-anchor="middle" x="330" y="244">查可见性图</text>
<line class="diagram-accent" marker-end="url(#m-verm-io)" x1="410" x2="486" y1="230" y2="230"></line>
<text class="branch-label" text-anchor="middle" x="448" y="220">是</text>
<rect class="diagram-accent node-fill-accent" height="56" rx="5" stroke-width="1.6" width="110" x="486" y="202"></rect>
<text class="node-label-accent" text-anchor="middle" x="541" y="226">直接返回</text>
<text class="edge-label" text-anchor="middle" x="541" y="244">不回堆</text>
<!-- 否 branch back to 回表 -->
<line class="diagram-soft" marker-end="url(#m-ink-io)" x1="330" x2="330" y1="202" y2="118"></line>
<text class="branch-label" text-anchor="start" x="342" y="160">否 → 回堆</text>
</svg>