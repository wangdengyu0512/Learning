<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="WAL 写入流程与崩溃恢复" role="img" viewbox="0 0 640 340" xmlns="http://www.w3.org/2000/svg"><style>:root {
  --bg: #ffffff;
  --ink: #0a0a0a;
  --ink-soft: #525252;
  --ink-faint: #a3a3a3;
  --vermilion: #b73b2f;
  --vermilion-soft: rgba(183, 59, 47, 0.08);
  --sans: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
}
.diagram-ink { stroke: var(--ink); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: var(--vermilion); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: var(--ink-faint); fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: var(--bg); }
.node-fill-accent { fill: var(--vermilion-soft); }
.node-label { font-family: var(--sans); font-size: 13px; font-weight: 500; fill: var(--ink); }
.node-label-accent { font-family: var(--sans); font-size: 13px; font-weight: 700; fill: var(--vermilion); }
.edge-label { font-family: var(--mono); font-size: 11px; fill: var(--ink-soft); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: var(--mono); font-size: 11px; font-weight: 700; fill: var(--vermilion); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="m-verm-w" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
<marker id="m-ink-w" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
</defs>
<!-- step 1: txn modifies page in buffer -->
<rect class="diagram-ink node-fill" height="64" rx="6" width="150" x="30" y="40"></rect>
<text class="node-label" text-anchor="middle" x="105" y="66">① 事务改页</text>
<text class="edge-label" text-anchor="middle" x="105" y="86">在 shared_buffers</text>
<!-- step 2: append WAL (sequential) -->
<rect class="diagram-accent node-fill-accent" height="64" rx="6" stroke-width="1.6" width="150" x="30" y="150"></rect>
<text class="node-label-accent" text-anchor="middle" x="105" y="176">② 先写 WAL</text>
<text class="edge-label" text-anchor="middle" x="105" y="196">顺序 append</text>
<line class="diagram-accent" marker-end="url(#m-verm-w)" x1="105" x2="105" y1="104" y2="148"></line>
<text class="branch-label" text-anchor="start" x="113" y="130">改页前</text>
<!-- step 3: commit fsync WAL -->
<rect class="diagram-accent node-fill" height="64" rx="6" stroke-width="1.6" width="160" x="245" y="150"></rect>
<text class="node-label-accent" text-anchor="middle" x="325" y="176">③ COMMIT</text>
<text class="edge-label" text-anchor="middle" x="325" y="196">fsync WAL 落盘</text>
<line class="diagram-accent" marker-end="url(#m-verm-w)" x1="180" x2="243" y1="182" y2="182"></line>
<!-- WAL file (durable) -->
<rect class="diagram-ink node-fill" height="64" rx="6" width="160" x="245" y="40"></rect>
<text class="node-label" text-anchor="middle" x="325" y="62">WAL 文件</text>
<text class="edge-label" text-anchor="middle" x="325" y="82">磁盘 · 顺序日志</text>
<line class="diagram-soft" marker-end="url(#m-ink-w)" x1="180" x2="244" y1="172" y2="120"></line>
<!-- step 4: dirty page async flush later -->
<rect class="diagram-soft node-fill" height="64" rx="6" width="150" x="470" y="40"></rect>
<text class="node-label" text-anchor="middle" x="545" y="62">④ 数据页</text>
<text class="edge-label" text-anchor="middle" x="545" y="82">稍后异步刷盘</text>
<line class="diagram-soft" marker-end="url(#m-ink-w)" x1="405" x2="468" y1="72" y2="72"></line>
<text class="edge-label" text-anchor="middle" x="437" y="58">不阻塞</text>
<text class="edge-label" text-anchor="middle" x="437" y="100">commit</text>
<!-- recovery flow at bottom -->
<line class="diagram-soft" x1="40" x2="600" y1="250" y2="250"></line>
<text class="branch-label" text-anchor="start" x="40" y="278">崩溃后恢复</text>
<rect class="diagram-ink node-fill" height="50" rx="6" width="170" x="160" y="258"></rect>
<text class="edge-label" text-anchor="middle" x="245" y="280">从 checkpoint 起</text>
<text class="edge-label" text-anchor="middle" x="245" y="296">读 WAL</text>
<rect class="diagram-accent node-fill-accent" height="50" rx="6" stroke-width="1.6" width="170" x="370" y="258"></rect>
<text class="branch-label" text-anchor="middle" x="455" y="280">重放 redo</text>
<text class="edge-label" text-anchor="middle" x="455" y="296">到一致状态</text>
<line class="diagram-accent" marker-end="url(#m-verm-w)" x1="330" x2="368" y1="283" y2="283"></line>
</svg>