<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="BRIN 为每段 block range 存 min/max 摘要并排除不相交的段" role="img" viewbox="0 0 600 240" xmlns="http://www.w3.org/2000/svg"><style>:root {
  --bg: #ffffff;
  --ink: #0a0a0a;
  --ink-soft: #525252;
  --ink-faint: #a3a3a3;
  --vermilion: #b73b2f;
  --vermilion-soft: rgba(183, 59, 47, 0.08);
  --sans: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
}
.diagram-ink { stroke: var(--ink); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: var(--vermilion); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: var(--ink-faint); fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: var(--bg); }
.node-fill-accent { fill: var(--vermilion-soft); }
.node-label { font-family: var(--sans); font-size: 13px; font-weight: 500; fill: var(--ink); }
.node-label-accent { font-family: var(--sans); font-size: 13px; font-weight: 700; fill: var(--vermilion); }
.edge-label { font-family: var(--mono); font-size: 11px; fill: var(--ink-soft); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: var(--mono); font-size: 11px; font-weight: 700; fill: var(--vermilion); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="m-verm-br" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
</defs>
<!-- query -->
<text class="node-label" text-anchor="middle" x="300" y="24">查询：created_at ∈ [300, 360]</text>
<!-- BRIN summary row -->
<text class="edge-label" text-anchor="middle" x="70" y="64">BRIN 摘要</text>
<rect class="diagram-soft node-fill" height="40" rx="3" width="100" x="130" y="46"></rect>
<text class="edge-label" text-anchor="middle" x="180" y="71">[100,180]</text>
<rect class="diagram-accent node-fill-accent" height="40" rx="3" width="100" x="246" y="46"></rect>
<text class="branch-label" text-anchor="middle" x="296" y="71">[280,370]</text>
<rect class="diagram-soft node-fill" height="40" rx="3" width="100" x="362" y="46"></rect>
<text class="edge-label" text-anchor="middle" x="412" y="71">[400,520]</text>
<!-- block ranges row -->
<text class="edge-label" text-anchor="middle" x="70" y="154">block range</text>
<rect class="diagram-ink node-fill" height="48" rx="3" width="100" x="130" y="130"></rect>
<text class="edge-label" text-anchor="middle" x="180" y="150">段 #0</text>
<text class="branch-label" text-anchor="middle" x="180" y="168">跳过</text>
<rect class="diagram-ink node-fill" height="48" rx="3" width="100" x="246" y="130"></rect>
<text class="edge-label" text-anchor="middle" x="296" y="150">段 #1</text>
<text class="node-label-accent" text-anchor="middle" x="296" y="168">进候选</text>
<rect class="diagram-ink node-fill" height="48" rx="3" width="100" x="362" y="130"></rect>
<text class="edge-label" text-anchor="middle" x="412" y="150">段 #2</text>
<text class="branch-label" text-anchor="middle" x="412" y="168">跳过</text>
<!-- summary -> block link (only matching one) -->
<line class="diagram-accent" marker-end="url(#m-verm-br)" x1="296" x2="296" y1="86" y2="128"></line>
<!-- bitmap heap scan note -->
<text class="edge-label" text-anchor="middle" x="296" y="210">候选段交给 bitmap heap scan 二次校验</text>
<line class="diagram-soft" marker-end="url(#m-verm-br)" x1="296" x2="296" y1="178" y2="196"></line>
</svg>