<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="选择性从低到高时最优扫描方式的变化谱" role="img" viewbox="0 0 720 250" xmlns="http://www.w3.org/2000/svg"><style>:root {
  --bg: #ffffff;
  --ink: #0a0a0a;
  --ink-soft: #525252;
  --ink-faint: #a3a3a3;
  --vermilion: #b73b2f;
  --vermilion-soft: rgba(183, 59, 47, 0.08);
  --sans: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
}
.diagram-ink { stroke: var(--ink); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: var(--vermilion); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: var(--ink-faint); fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: var(--bg); }
.node-fill-accent { fill: var(--vermilion-soft); }
.node-label { font-family: var(--sans); font-size: 13px; font-weight: 500; fill: var(--ink); }
.node-label-accent { font-family: var(--sans); font-size: 13px; font-weight: 700; fill: var(--vermilion); }
.edge-label { font-family: var(--mono); font-size: 11px; fill: var(--ink-soft); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: var(--mono); font-size: 11px; font-weight: 700; fill: var(--vermilion); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<lineargradient id="sel-grad" x1="0" x2="1" y1="0" y2="0">
<stop offset="0" stop-color="#B73B2F" stop-opacity="0.10"></stop>
<stop offset="0.5" stop-color="#B73B2F" stop-opacity="0.16"></stop>
<stop offset="1" stop-color="#B73B2F" stop-opacity="0.22"></stop>
</lineargradient>
<marker id="m5-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
</defs>
<!-- the spectrum bar -->
<rect fill="url(#sel-grad)" height="40" rx="4" stroke="#E5E5E5" stroke-width="1" width="640" x="40" y="60"></rect>
<!-- axis line under the bar -->
<line class="diagram-ink" marker-end="url(#m5-ink)" x1="40" x2="680" y1="120" y2="120"></line>
<text class="edge-label" text-anchor="start" x="40" y="142">命中极少（高选择性）</text>
<text class="edge-label" text-anchor="end" x="680" y="142">命中大半（低选择性）</text>
<!-- segment dividers -->
<line class="diagram-soft" x1="253" x2="253" y1="56" y2="104"></line>
<line class="diagram-soft" x1="467" x2="467" y1="56" y2="104"></line>
<!-- segment labels (13px name + 11px sublabel) -->
<text class="node-label-accent" text-anchor="middle" x="146" y="44">index / index-only</text>
<text class="edge-label" text-anchor="middle" x="146" y="85">精确定位少量行</text>
<text class="node-label-accent" text-anchor="middle" x="360" y="44">bitmap heap scan</text>
<text class="edge-label" text-anchor="middle" x="360" y="85">位图合并·成批回堆</text>
<text class="node-label-accent" text-anchor="middle" x="573" y="44">seq scan</text>
<text class="edge-label" text-anchor="middle" x="573" y="85">顺序扫全表</text>
<!-- bottom note -->
<text class="node-label" text-anchor="middle" x="360" y="186">没有永远最快的扫描——同一查询，数据分布一变就换方式</text>
<text class="edge-label" text-anchor="middle" x="360" y="210">命中比例（选择性）是规划器选扫描的主轴</text>
</svg>