<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="左侧 MySQL 两层架构三套日志，右侧 PG 单 WAL 三职责" role="img" viewbox="0 0 760 330" xmlns="http://www.w3.org/2000/svg"><style>:root {
  --bg: #ffffff;
  --ink: #0a0a0a;
  --ink-soft: #525252;
  --ink-faint: #a3a3a3;
  --vermilion: #b73b2f;
  --vermilion-soft: rgba(183, 59, 47, 0.08);
  --sans: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
}
.diagram-ink { stroke: var(--ink); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: var(--vermilion); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: var(--ink-faint); fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: var(--bg); }
.node-fill-accent { fill: var(--vermilion-soft); }
.node-label { font-family: var(--sans); font-size: 13px; font-weight: 500; fill: var(--ink); }
.node-label-accent { font-family: var(--sans); font-size: 13px; font-weight: 700; fill: var(--vermilion); }
.edge-label { font-family: var(--mono); font-size: 11px; fill: var(--ink-soft); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: var(--mono); font-size: 11px; font-weight: 700; fill: var(--vermilion); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="m-verm-l" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
<marker id="m-ink-l" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
</defs>
<line class="diagram-soft" x1="380" x2="380" y1="30" y2="310"></line>
<text class="node-label-accent" text-anchor="middle" x="190" y="22">MySQL · 三套日志</text>
<text class="node-label" text-anchor="middle" x="570" y="22">PostgreSQL · 单 WAL</text>
<!-- ===== LEFT MySQL two layers ===== -->
<rect class="diagram-ink node-fill" height="44" rx="6" width="308" x="36" y="44"></rect>
<text class="node-label" text-anchor="middle" x="190" y="64">server 层</text>
<text class="edge-label" text-anchor="middle" x="190" y="80">解析·优化·执行·复制</text>
<rect class="diagram-ink node-fill" height="44" rx="6" width="308" x="36" y="96"></rect>
<text class="node-label" text-anchor="middle" x="190" y="116">存储引擎层 · InnoDB</text>
<text class="edge-label" text-anchor="middle" x="190" y="132">可插拔</text>
<!-- three logs -->
<rect class="diagram-ink node-fill" height="52" rx="4" width="92" x="36" y="176"></rect>
<text class="node-label" text-anchor="middle" x="82" y="197">redo</text>
<text class="edge-label" text-anchor="middle" x="82" y="214">物理·恢复</text>
<rect class="diagram-ink node-fill" height="52" rx="4" width="92" x="144" y="176"></rect>
<text class="node-label" text-anchor="middle" x="190" y="197">undo</text>
<text class="edge-label" text-anchor="middle" x="190" y="214">回滚·MVCC</text>
<rect class="diagram-accent node-fill-accent" height="52" rx="4" width="92" x="252" y="176"></rect>
<text class="node-label-accent" text-anchor="middle" x="298" y="197">binlog</text>
<text class="edge-label" text-anchor="middle" x="298" y="214">逻辑·复制</text>
<!-- layer to logs -->
<line class="diagram-ink" marker-end="url(#m-ink-l)" x1="82" x2="82" y1="140" y2="174"></line>
<line class="diagram-ink" marker-end="url(#m-ink-l)" x1="190" x2="190" y1="140" y2="174"></line>
<line class="diagram-accent" marker-end="url(#m-verm-l)" x1="298" x2="298" y1="140" y2="174"></line>
<text class="edge-label" text-anchor="middle" x="190" y="262">redo+binlog 两阶段提交</text>
<text class="branch-label" text-anchor="middle" x="190" y="284">group commit 批量 fsync</text>
<!-- ===== RIGHT PG single WAL ===== -->
<rect class="diagram-accent node-fill-accent" height="56" rx="6" stroke-width="2" width="168" x="486" y="60"></rect>
<text class="node-label-accent" text-anchor="middle" x="570" y="84">单一 WAL</text>
<text class="edge-label" text-anchor="middle" x="570" y="102">存储执行一体·无分层</text>
<!-- three duties -->
<rect class="diagram-ink node-fill" height="50" rx="4" width="92" x="430" y="170"></rect>
<text class="edge-label" text-anchor="middle" x="476" y="190">崩溃</text>
<text class="edge-label" text-anchor="middle" x="476" y="206">恢复</text>
<rect class="diagram-ink node-fill" height="50" rx="4" width="92" x="524" y="170"></rect>
<text class="edge-label" text-anchor="middle" x="570" y="190">物理流</text>
<text class="edge-label" text-anchor="middle" x="570" y="206">复制</text>
<rect class="diagram-ink node-fill" height="50" rx="4" width="92" x="618" y="170"></rect>
<text class="edge-label" text-anchor="middle" x="664" y="190">逻辑</text>
<text class="edge-label" text-anchor="middle" x="664" y="206">解码</text>
<line class="diagram-accent" marker-end="url(#m-verm-l)" x1="500" x2="476" y1="116" y2="168"></line>
<line class="diagram-accent" marker-end="url(#m-verm-l)" x1="570" x2="570" y1="116" y2="168"></line>
<line class="diagram-accent" marker-end="url(#m-verm-l)" x1="640" x2="664" y1="116" y2="168"></line>
<text class="edge-label" text-anchor="middle" x="570" y="262">一套日志承担三件事</text>
<text class="branch-label" text-anchor="middle" x="570" y="284">无需独立 undo 日志</text>
</svg>