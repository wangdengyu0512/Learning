<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="一个堆 Page 中同一行的两个版本 v1 与 v2" role="img" viewbox="0 0 600 320" xmlns="http://www.w3.org/2000/svg"><style>:root {
  --bg: #ffffff;
  --ink: #0a0a0a;
  --ink-soft: #525252;
  --ink-faint: #a3a3a3;
  --vermilion: #b73b2f;
  --vermilion-soft: rgba(183, 59, 47, 0.08);
  --sans: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
}
.diagram-ink { stroke: var(--ink); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.diagram-accent { stroke: var(--vermilion); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.diagram-soft { stroke: var(--ink-faint); fill: none; stroke-width: 1.1; stroke-dasharray: 3 3; }
.node-fill { fill: var(--bg); }
.node-fill-accent { fill: var(--vermilion-soft); }
.node-label { font-family: var(--sans); font-size: 13px; font-weight: 500; fill: var(--ink); }
.node-label-accent { font-family: var(--sans); font-size: 13px; font-weight: 700; fill: var(--vermilion); }
.edge-label { font-family: var(--mono); font-size: 11px; fill: var(--ink-soft); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.branch-label { font-family: var(--mono); font-size: 11px; font-weight: 700; fill: var(--vermilion); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }</style>
<defs>
<marker id="m-ink2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
<marker id="m-verm2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
</defs>
<!-- page frame label -->
<text class="node-label" text-anchor="middle" x="300" y="26">同一个 heap page</text>
<!-- v1 box -->
<rect class="diagram-ink node-fill" height="118" rx="6" width="220" x="40" y="48"></rect>
<text class="node-label" text-anchor="middle" x="150" y="74">v1（旧版本）</text>
<line class="diagram-ink" stroke-width="1" x1="40" x2="260" y1="86" y2="86"></line>
<text class="edge-label" text-anchor="middle" x="150" y="110">xmin = 100</text>
<text class="branch-label" text-anchor="middle" x="150" y="132">xmax = 205</text>
<text class="edge-label" text-anchor="middle" x="150" y="153">已被盖失效戳</text>
<!-- v2 box -->
<rect class="diagram-accent node-fill-accent" height="118" rx="6" stroke-width="2" width="220" x="340" y="48"></rect>
<text class="node-label-accent" text-anchor="middle" x="450" y="74">v2（新版本）</text>
<line class="diagram-accent" stroke-width="1" x1="340" x2="560" y1="86" y2="86"></line>
<text class="edge-label" text-anchor="middle" x="450" y="110">xmin = 205</text>
<text class="edge-label" text-anchor="middle" x="450" y="132">xmax = 0</text>
<text class="edge-label" text-anchor="middle" x="450" y="153">当前有效</text>
<!-- UPDATE arrow -->
<line class="diagram-accent" marker-end="url(#m-verm2)" x1="260" x2="338" y1="107" y2="107"></line>
<text class="branch-label" text-anchor="middle" x="299" y="98">UPDATE</text>
<!-- caption inside: dead tuple note -->
<rect class="diagram-soft node-fill" height="84" rx="6" width="220" x="40" y="200"></rect>
<text class="edge-label" text-anchor="middle" x="150" y="228">事务 205 提交后</text>
<text class="edge-label" text-anchor="middle" x="150" y="250">v1 再无人可见</text>
<text class="branch-label" text-anchor="middle" x="150" y="270">→ 成死元组</text>
<rect class="diagram-soft node-fill" height="84" rx="6" width="220" x="340" y="200"></rect>
<text class="edge-label" text-anchor="middle" x="450" y="228">VACUUM 回收 v1</text>
<text class="edge-label" text-anchor="middle" x="450" y="250">腾出的槽位</text>
<text class="edge-label" text-anchor="middle" x="450" y="270">可被后续行复用</text>
<line class="diagram-ink" marker-end="url(#m-ink2)" x1="150" x2="150" y1="166" y2="198"></line>
<line class="diagram-soft" marker-end="url(#m-ink2)" x1="260" x2="338" y1="242" y2="242"></line>
</svg>