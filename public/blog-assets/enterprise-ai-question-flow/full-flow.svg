<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1230" viewBox="0 0 1440 1230" role="img" aria-labelledby="title desc">
  <title id="title">从一条用户提问到订单交付闭环</title>
  <desc id="desc">按照时间从上到下，展示数据流、业务流和负责方。先分析并回答问题，用户选择并审批后执行，最后以签收验证结果，并将实际状态反馈到数据和任务。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#50657d"/></marker>
    <marker id="feedback" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f73"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #172c44; }
      .title { font-size: 32px; font-weight: 700; }
      .sub { font-size: 20px; fill: #52677e; }
      .head { font-size: 23px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 700; }
      .body { font-size: 19px; }
      .small { font-size: 18px; fill: #52677e; }
      .flow { fill: none; stroke: #50657d; stroke-width: 2.5; marker-end: url(#arrow); }
      .cell { stroke: #cbd8e6; stroke-width: 1.5; rx: 12; }
    </style>
  </defs>
  <rect width="1440" height="1230" rx="20" fill="#f5f8fc"/>
  <text x="56" y="61" class="title">从一条用户提问到订单交付闭环</text>
  <text x="56" y="99" class="sub">案例：为什么没发货？能否按期送达？有哪些处理方案？</text>
  <rect x="56" y="125" width="1328" height="62" rx="12" fill="#e9e4fa"/>
  <text x="80" y="163" class="body">WBM 贯穿全程：对象与关系 · 状态与规则 · 动作与约束 · 目标与反馈</text>
  <text x="76" y="232" class="head">阶段</text>
  <text x="273" y="232" class="head">数据流：信息如何变化</text>
  <text x="733" y="232" class="head">业务流：状态如何推进</text>
  <text x="1186" y="232" class="head">主要负责方</text>

  <text x="76" y="294" class="label">01 定位</text>
  <rect x="250" y="255" width="430" height="78" class="cell" fill="#eaf2ff"/>
  <text x="270" y="287" class="body">提问 + 身份 + 页面上下文</text>
  <text x="270" y="315" class="small">→ 订单标识、目标、访问范围</text>
  <path d="M 684 294 H 707" class="flow"/>
  <rect x="715" y="255" width="430" height="78" class="cell" fill="#fff3df"/>
  <text x="735" y="287" class="body">建立分析任务，明确完成条件</text>
  <text x="735" y="315" class="small">对象不唯一时先澄清</text>
  <text x="1180" y="285" class="small">协调数字员工</text>
  <text x="1180" y="313" class="small">Agent OS</text>

  <path d="M 465 337 V 354" class="flow"/><path d="M 930 337 V 354" class="flow"/>
  <text x="76" y="398" class="label">02 核查</text>
  <rect x="250" y="359" width="430" height="78" class="cell" fill="#eaf2ff"/>
  <text x="270" y="391" class="body">订单、合同、库存、工单、采购</text>
  <text x="270" y="419" class="small">→ 带来源、时间和版本的事实</text>
  <path d="M 684 398 H 707" class="flow"/>
  <rect x="715" y="359" width="430" height="78" class="cell" fill="#fff3df"/>
  <text x="735" y="391" class="body">确认物料缺口 400 件、工单等待</text>
  <text x="735" y="419" class="small">常规补货预计晚于合同交期</text>
  <text x="1180" y="389" class="small">Data OS</text>
  <text x="1180" y="417" class="small">专业数字员工</text>

  <path d="M 465 441 V 458" class="flow"/><path d="M 930 441 V 458" class="flow"/>
  <text x="76" y="502" class="label">03 方案</text>
  <rect x="250" y="463" width="430" height="78" class="cell" fill="#eaf2ff"/>
  <text x="270" y="495" class="body">资源 + 规则 + 时间与成本计算</text>
  <text x="270" y="523" class="small">→ 候选方案、依据和成立条件</text>
  <path d="M 684 502 H 707" class="flow"/>
  <rect x="715" y="463" width="430" height="78" class="cell" fill="#fff3df"/>
  <text x="735" y="495" class="body">回答问题，比较等待、调拨、分批</text>
  <text x="735" y="523" class="small">分析可完成；订单仍未发生改变</text>
  <text x="1180" y="493" class="small">专业数字员工</text>
  <text x="1180" y="521" class="small">计算与规则服务</text>

  <path d="M 465 545 V 562" class="flow"/><path d="M 930 545 V 562" class="flow"/>
  <text x="76" y="606" class="label">04 授权</text>
  <rect x="250" y="567" width="430" height="78" class="cell" fill="#eaf2ff"/>
  <text x="270" y="599" class="body">用户选择 + 方案版本 + 费用上限</text>
  <text x="270" y="627" class="small">→ 明确范围的审批与授权记录</text>
  <path d="M 684 606 H 707" class="flow"/>
  <rect x="715" y="567" width="430" height="78" class="cell" fill="#fff3df"/>
  <text x="735" y="599" class="body">建立执行任务，按规则完成审批</text>
  <text x="735" y="627" class="small">执行前再次核验资源与版本</text>
  <text x="1180" y="597" class="small">用户、审批人</text>
  <text x="1180" y="625" class="small">Agent OS</text>

  <path d="M 465 649 V 666" class="flow"/><path d="M 930 649 V 666" class="flow"/>
  <text x="76" y="710" class="label">05 执行</text>
  <rect x="250" y="671" width="430" height="78" class="cell" fill="#eaf2ff"/>
  <text x="270" y="703" class="body">获批动作参数 → 外部单据与回执</text>
  <text x="270" y="731" class="small">记录已成功步骤和未知结果</text>
  <path d="M 684 710 H 707" class="flow"/>
  <rect x="715" y="671" width="430" height="78" class="cell" fill="#fff3df"/>
  <text x="735" y="703" class="body">预留物料 → 调拨 → 排产 → 预约</text>
  <text x="735" y="731" class="small">以业务系统的生效状态确认动作</text>
  <text x="1180" y="701" class="small">执行数字员工</text>
  <text x="1180" y="729" class="small">ERP / WMS 等</text>

  <path d="M 465 753 V 770" class="flow"/><path d="M 930 753 V 770" class="flow"/>
  <text x="76" y="814" class="label">06 跟踪</text>
  <rect x="250" y="775" width="430" height="78" class="cell" fill="#eaf2ff"/>
  <text x="270" y="807" class="body">收货、生产、质检、出库与运输事件</text>
  <text x="270" y="835" class="small">→ 最新状态、预测与偏差</text>
  <path d="M 684 814 H 707" class="flow"/>
  <rect x="715" y="775" width="430" height="78" class="cell" fill="#fff3df"/>
  <text x="735" y="807" class="body">推进实际履约，处理延迟与异常</text>
  <text x="735" y="835" class="small">条件变化时重算；越权则重新决策</text>
  <text x="1180" y="805" class="small">Data OS</text>
  <text x="1180" y="833" class="small">Agent OS / 人员</text>

  <path d="M 465 857 V 874" class="flow"/><path d="M 930 857 V 874" class="flow"/>
  <text x="76" y="918" class="label">07 验收</text>
  <rect x="250" y="879" width="430" height="78" class="cell" fill="#eaf2ff"/>
  <text x="270" y="911" class="body">实际签收记录 → 数量与时间核验</text>
  <text x="270" y="939" class="small">1,000 件，示例签收：10 月 25 日 11:40</text>
  <path d="M 684 918 H 707" class="flow"/>
  <rect x="715" y="879" width="430" height="78" class="cell" fill="#fff3df"/>
  <text x="735" y="911" class="body">满足约定后，关闭本次交付任务</text>
  <text x="735" y="939" class="small">回复完成、动作成功、交付达成分别验收</text>
  <text x="1180" y="909" class="small">验证任务</text>
  <text x="1180" y="937" class="small">业务负责人</text>

  <path d="M 465 961 V 991" class="flow"/><path d="M 930 961 V 991" class="flow"/>
  <rect x="250" y="998" width="895" height="94" rx="12" fill="#ddf3ed" stroke="#91c9bc" stroke-width="1.5"/>
  <text x="275" y="1034" class="label">结果回流：更新业务事实、对象状态与任务记录</text>
  <text x="275" y="1068" class="body">保留证据与偏差；规则、模型和策略改进经过验证后再发布</text>
  <path d="M 250 1045 H 220 V 397 H 243" fill="none" stroke="#087f73" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#feedback)"/>
  <text x="76" y="1062" class="small">状态反馈</text>
  <rect x="56" y="1124" width="1328" height="64" rx="12" fill="#e9eef5"/>
  <text x="80" y="1164" class="body">阅读方式：从上往下追踪同一订单；横向对照信息产物与业务变化。全部数字和日期均为案例假设。</text>
</svg>
