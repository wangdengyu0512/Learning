<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1030" viewBox="0 0 1260 1030" role="img" aria-labelledby="title desc">
<title id="title">数字员工平台：数字岗位、AgentOS 与 Data OS 融合架构</title>
<desc id="desc">数字岗位定义责任与验收，AgentOS 编排并持久执行任务，Data OS 提供可信上下文。工具网关经授权直接调用业务系统，源系统确认后的变化回流底座。WBM 语义、权限、审批和质量治理贯穿各层。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#496478"/></marker>
<marker id="write" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#b35c22"/></marker>
</defs>
<rect width="1260" height="1030" rx="20" fill="#f5f7fb"/>
<style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#24384b}.heading{font-size:24px;font-weight:700}.label{font-size:19px;font-weight:600}.body{font-size:17px}.note{font-size:16px;fill:#53687b}.line{fill:none;stroke:#496478;stroke-width:2.2}</style>

<text x="40" y="44" class="heading" text-anchor="start">数字员工平台：岗位交付、受控执行与可信上下文</text>
<text x="40" y="70" class="note" text-anchor="start">沿用 Agent Workforce → AgentOS → Data OS 分工，以业务任务贯通三层</text>
<rect x="40" y="92" width="920" height="60" rx="12" fill="#eaf0f8" stroke="#ced9e4"/>
<text x="500" y="129" class="label" text-anchor="middle">统一入口：工作台 · 业务系统 · 消息渠道 · 定时任务 / 业务事件</text>
<path d="M500 153 V180" class="line" marker-end="url(#arrow)"/>
<rect x="40" y="182" width="920" height="126" rx="12" fill="#eef0fe" stroke="#bfc7ed"/>
<text x="60" y="216" class="heading" text-anchor="start">数字岗位层  Agent Workforce</text>
<text x="60" y="250" class="label" text-anchor="start">岗位职责与能力绑定       流程模板与专业技能       人工接管与验收标准</text>
<text x="60" y="283" class="body" text-anchor="start">业务负责人定义：为谁工作、允许做什么、何时转交、交付什么</text>
<path d="M500 309 V350" class="line" marker-end="url(#arrow)"/>
<text x="515" y="337" class="note" text-anchor="start">业务目标 · 流程约束 · 交付要求</text>
<rect x="40" y="352" width="920" height="200" rx="12" fill="#eaf4ff" stroke="#abcbe8"/>
<text x="60" y="386" class="heading" text-anchor="start">执行层  AgentOS</text>
<text x="60" y="415" class="label" text-anchor="start">任务与计划 · 能力版本 · 编排调度 · 策略审批 · 结果校验</text>
<rect x="60" y="432" width="425" height="63" rx="12" fill="#ffffff" stroke="#ced9e4"/>
<text x="77" y="457" class="label" text-anchor="start">Agent Harness / Runtime</text>
<text x="77" y="482" class="body" text-anchor="start">模型与工具循环 · 上下文 · 暂停恢复</text>
<rect x="505" y="432" width="435" height="63" rx="12" fill="#ffffff" stroke="#ced9e4"/>
<text x="523" y="457" class="label" text-anchor="start">工具网关与产物管理</text>
<text x="523" y="482" class="body" text-anchor="start">参数授权 · 幂等 · 回执核验 · 成果交付</text>
<text x="60" y="530" class="body" text-anchor="start">持久状态：Task / Plan / Attempt / Turn · 事件与快照 · Inbox / Outbox</text>
<path d="M450 554 V608" class="line" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="470" y="578" class="note" text-anchor="start">任务对象 / 时效 / 质量要求 ↓</text>
<text x="470" y="600" class="note" text-anchor="start">↑ 事实 / 规则 / 计算 / 证据 / 使用限制</text>
<rect x="40" y="610" width="920" height="184" rx="12" fill="#e9f6ef" stroke="#abd3be"/>
<text x="60" y="645" class="heading" text-anchor="start">企业数据与知识底座  Data OS</text>
<text x="60" y="680" class="label" text-anchor="start">上下文服务：对象查询 · 关系查询 · 指标计算 · 知识检索</text>
<text x="60" y="716" class="label" text-anchor="start">语义与状态：统一对象 · 有效关系 · 规则版本 · 状态视图</text>
<text x="60" y="752" class="label" text-anchor="start">接入与加工：同步 / 事件 · 文档解析 · 来源追溯 · 权限与质量</text>
<text x="60" y="780" class="note" text-anchor="start">事实、规则、推断分别表达；时效、缺失项与用途约束随结果返回</text>
<path d="M450 854 V796" class="line" marker-end="url(#arrow)"/>
<text x="470" y="824" class="note" text-anchor="start">源系统确认的事实 · 事件 / 同步 · 状态更新</text>
<text x="470" y="846" class="note" text-anchor="start">业务变化回流，经验经审核后发布为知识或技能</text>
<rect x="40" y="856" width="920" height="86" rx="12" fill="#f1f3f6" stroke="#ced9e4"/>
<text x="60" y="890" class="label" text-anchor="start">既有业务系统与知识来源</text>
<text x="60" y="921" class="body" text-anchor="start">CRM · ERP · 告警 / 资源 / 工单系统 · 文档 / 数据库（权威业务记录）</text>
<path d="M940 465 H1000 V898 H962" class="line" marker-end="url(#write)" style="stroke:#b35c22"/>
<text x="984" y="680" class="note" text-anchor="start">受</text>
<text x="984" y="705" class="note" text-anchor="start">控</text>
<text x="984" y="730" class="note" text-anchor="start">写</text>
<text x="984" y="755" class="note" text-anchor="start">入</text>
<rect x="1030" y="92" width="190" height="850" rx="12" fill="#fff7e9" stroke="#e6cda5"/>
<text x="1125" y="132" class="label" text-anchor="middle">跨层契约与治理</text>
<text x="1125" y="181" class="body" text-anchor="middle">WBM 共享语义</text>
<text x="1125" y="214" class="body" text-anchor="middle">对象 · 关系 · 状态</text>
<text x="1125" y="242" class="body" text-anchor="middle">规则 · 动作 · 结果</text>
<text x="1125" y="320" class="body" text-anchor="middle">身份与对象权限</text>
<text x="1125" y="362" class="body" text-anchor="middle">审批与人工责任</text>
<text x="1125" y="404" class="body" text-anchor="middle">数据质量与时效</text>
<text x="1125" y="446" class="body" text-anchor="middle">版本与来源追溯</text>
<text x="1125" y="488" class="body" text-anchor="middle">执行预算与配额</text>
<text x="1125" y="530" class="body" text-anchor="middle">审计与运行观测</text>
<text x="1125" y="572" class="body" text-anchor="middle">验收与回归评测</text>
<text x="1125" y="694" class="body" text-anchor="middle">任务结束前检查</text>
<text x="1125" y="735" class="body" text-anchor="middle">产物是否合格</text>
<text x="1125" y="773" class="body" text-anchor="middle">证据是否有效</text>
<text x="1125" y="811" class="body" text-anchor="middle">动作是否确认</text>
<text x="40" y="980" class="label" text-anchor="start">验收闭环：交付物可用 + 证据可追溯 + 业务动作已核验</text>
<text x="40" y="1008" class="note" text-anchor="start">设计方案：业务系统保留事实所有权，AgentOS 保存执行过程，Data OS 提供带约束的业务上下文。</text>
</svg>
