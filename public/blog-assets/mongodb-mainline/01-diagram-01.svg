<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="左侧关系型用 users/orders/order_items 三张表加外键，右侧 MongoDB 用一个内嵌文档" role="img" viewbox="0 0 720 360" xmlns="http://www.w3.org/2000/svg"><style>.node-fill{fill:#ffffff}.node-fill-accent{fill:#fff1ec}
.diagram-ink{stroke:#242424;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.diagram-accent{stroke:#d94a2b;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.diagram-soft{stroke:#a3a3a3;fill:none;stroke-width:1.1;stroke-dasharray:3 3}
.node-label{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#242424}
.node-label-accent{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:700;fill:#d94a2b}
.edge-label{font-family:Consolas,monospace;font-size:11px;fill:#666;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.branch-label{font-family:Consolas,monospace;font-size:11px;font-weight:700;fill:#d94a2b;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
<defs>
<marker id="ar-soft" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#A3A3A3"></path>
</marker>
</defs>
<text class="node-label" text-anchor="middle" x="160" y="34">关系型：结构决定摆放</text>
<text class="node-label-accent" text-anchor="middle" x="545" y="34">文档：访问决定摆放</text>
<line class="diagram-soft" x1="360" x2="360" y1="20" y2="344"></line>
<!-- 左：三张表 -->
<rect class="diagram-ink node-fill" height="46" rx="6" width="160" x="75" y="56"></rect>
<text class="node-label" text-anchor="middle" x="155" y="79">users</text>
<text class="edge-label" text-anchor="middle" x="155" y="95">id · name</text>
<rect class="diagram-ink node-fill" height="46" rx="6" width="160" x="75" y="146"></rect>
<text class="node-label" text-anchor="middle" x="155" y="169">orders</text>
<text class="edge-label" text-anchor="middle" x="155" y="185">id · user_id</text>
<rect class="diagram-ink node-fill" height="46" rx="6" width="180" x="75" y="236"></rect>
<text class="node-label" text-anchor="middle" x="165" y="259">order_items</text>
<text class="edge-label" text-anchor="middle" x="165" y="275">order_id · sku</text>
<line class="diagram-soft" marker-end="url(#ar-soft)" x1="150" x2="150" y1="146" y2="104"></line>
<text class="edge-label" text-anchor="middle" x="196" y="128">user_id</text>
<line class="diagram-soft" marker-end="url(#ar-soft)" x1="162" x2="162" y1="236" y2="194"></line>
<text class="edge-label" text-anchor="middle" x="208" y="218">order_id</text>
<text class="edge-label" text-anchor="middle" x="160" y="312">一次详情查询</text>
<text class="branch-label" text-anchor="middle" x="160" y="330">= 3-way JOIN</text>
<!-- 右：一个文档 -->
<rect class="diagram-accent node-fill-accent" height="208" rx="6" stroke-width="1.8" width="290" x="400" y="56"></rect>
<text class="edge-label" font-weight="700" x="416" y="80">order 文档</text>
<text class="edge-label" x="416" y="100">_id · total · status</text>
<rect class="diagram-ink node-fill" height="42" rx="4" width="250" x="420" y="114"></rect>
<text class="node-label" text-anchor="middle" x="545" y="140">customer: { name, tier }</text>
<rect class="diagram-ink node-fill" height="76" rx="4" width="250" x="420" y="166"></rect>
<text class="node-label" text-anchor="middle" x="545" y="192">items: [ {sku,qty}, {sku,qty} ]</text>
<text class="edge-label" text-anchor="middle" x="545" y="222">↑ 内嵌数组，随文档一起读出</text>
<text class="edge-label" text-anchor="middle" x="545" y="312">一次详情查询</text>
<text class="branch-label" text-anchor="middle" x="545" y="330">= 按 _id 单次读</text>
</svg>