<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="一次写入的时间线：t0 primary 本地 durable，此刻 w:1 返回；t0 到 t1 之间是危险窗口；t1 多数确认后不可回滚" role="img" viewbox="0 0 720 260" xmlns="http://www.w3.org/2000/svg"><style>.node-fill{fill:#ffffff}.node-fill-accent{fill:#fff1ec}
.diagram-ink{stroke:#242424;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.diagram-accent{stroke:#d94a2b;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.diagram-soft{stroke:#a3a3a3;fill:none;stroke-width:1.1;stroke-dasharray:3 3}
.node-label{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#242424}
.node-label-accent{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:700;fill:#d94a2b}
.edge-label{font-family:Consolas,monospace;font-size:11px;fill:#666;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.branch-label{font-family:Consolas,monospace;font-size:11px;font-weight:700;fill:#d94a2b;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
<defs>
<marker id="ar-ink" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"></path>
</marker>
</defs>
<text class="node-label" text-anchor="middle" x="360" y="34">一次写入的两个时刻：返回 ≠ 不可回滚</text>
<!-- 时间主轴 -->
<line class="diagram-ink" marker-end="url(#ar-ink)" x1="80" x2="660" y1="150" y2="150"></line>
<text class="edge-label" x="668" y="154">time</text>
<!-- t0 标记 -->
<line class="diagram-ink" x1="200" x2="200" y1="108" y2="186"></line>
<circle cx="200" cy="150" fill="#0A0A0A" r="4"></circle>
<text class="node-label" text-anchor="middle" x="200" y="100">t0</text>
<text class="edge-label" text-anchor="middle" x="200" y="206">primary 本地 durable</text>
<text class="branch-label" text-anchor="middle" x="200" y="222">w:1 此刻返回</text>
<!-- t1 标记 -->
<line class="diagram-accent" x1="520" x2="520" y1="108" y2="186"></line>
<circle cx="520" cy="150" fill="#B73B2F" r="4"></circle>
<text class="node-label-accent" text-anchor="middle" x="520" y="100">t1</text>
<text class="edge-label" text-anchor="middle" x="520" y="206">多数确认 = majority commit</text>
<text class="branch-label" text-anchor="middle" x="520" y="222">此后不可回滚</text>
<!-- 危险窗口：t0→t1 用 accent 弧线/括号标注 -->
<path class="diagram-accent" d="M 200 78 Q 360 56 520 78"></path>
<text class="branch-label" text-anchor="middle" x="360" y="64">危险窗口：此时 failover，w:1 的写就丢</text>
</svg>