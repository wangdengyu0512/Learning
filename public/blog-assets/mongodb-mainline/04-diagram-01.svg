<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="WiredTiger 一个 B-tree page 的结构：page 上挂版本链 v3 到 v1，最新在内存 cache，旧版本指向磁盘 history store" role="img" viewbox="0 0 700 320" xmlns="http://www.w3.org/2000/svg"><style>.node-fill{fill:#ffffff}.node-fill-accent{fill:#fff1ec}
.diagram-ink{stroke:#242424;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.diagram-accent{stroke:#d94a2b;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.diagram-soft{stroke:#a3a3a3;fill:none;stroke-width:1.1;stroke-dasharray:3 3}
.node-label{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#242424}
.node-label-accent{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:700;fill:#d94a2b}
.edge-label{font-family:Consolas,monospace;font-size:11px;fill:#666;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.branch-label{font-family:Consolas,monospace;font-size:11px;font-weight:700;fill:#d94a2b;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
<defs>
<marker id="ar-ink" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"></path>
</marker>
<marker id="ar-acc" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
</defs>
<!-- cache 边界 -->
<rect class="diagram-soft" height="244" rx="8" width="370" x="40" y="54"></rect>
<text class="edge-label" font-weight="700" x="58" y="76">cache（内存）</text>
<!-- B-tree page -->
<rect class="diagram-ink node-fill" height="48" rx="6" width="120" x="68" y="98"></rect>
<text class="node-label" text-anchor="middle" x="128" y="120">B-tree page</text>
<text class="edge-label" text-anchor="middle" x="128" y="136">update chain</text>
<!-- 版本链 v3 v2 v1 -->
<rect class="diagram-accent node-fill-accent" height="40" rx="5" stroke-width="1.8" width="120" x="234" y="92"></rect>
<text class="node-label-accent" text-anchor="middle" x="294" y="110">v3 最新</text>
<text class="edge-label" text-anchor="middle" x="294" y="125">活跃快照可见</text>
<rect class="diagram-ink node-fill" height="38" rx="5" width="120" x="234" y="160"></rect>
<text class="node-label" text-anchor="middle" x="294" y="184">v2 旧版本</text>
<rect class="diagram-ink node-fill" height="38" rx="5" width="120" x="234" y="222"></rect>
<text class="node-label" text-anchor="middle" x="294" y="246">v1 旧版本</text>
<line class="diagram-ink" marker-end="url(#ar-ink)" x1="188" x2="234" y1="120" y2="114"></line>
<line class="diagram-ink" x1="294" x2="294" y1="132" y2="158"></line>
<line class="diagram-ink" x1="294" x2="294" y1="198" y2="220"></line>
<!-- 数据文件 + history store（磁盘） -->
<rect class="diagram-ink node-fill" height="56" rx="6" width="196" x="468" y="92"></rect>
<text class="node-label" text-anchor="middle" x="566" y="116">数据文件（磁盘）</text>
<text class="edge-label" text-anchor="middle" x="566" y="134">最新值落这里</text>
<rect class="diagram-ink node-fill" height="62" rx="6" width="196" x="468" y="200"></rect>
<text class="node-label" text-anchor="middle" x="566" y="226">history store</text>
<text class="edge-label" text-anchor="middle" x="566" y="244">磁盘 · 旧版本归宿</text>
<line class="diagram-accent" marker-end="url(#ar-acc)" x1="354" x2="468" y1="110" y2="116"></line>
<text class="edge-label" text-anchor="middle" x="412" y="100">页重整</text>
<line class="diagram-ink" marker-end="url(#ar-ink)" x1="354" x2="466" y1="180" y2="218"></line>
<line class="diagram-ink" marker-end="url(#ar-ink)" x1="354" x2="466" y1="240" y2="234"></line>
<text class="edge-label" text-anchor="middle" x="412" y="276">旧版本被推进 history store，无活跃引用即丢弃</text>
</svg>