<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="ObjectId 的 12 字节布局：4 字节时间戳、5 字节随机值、3 字节计数器" role="img" viewbox="0 0 680 220" xmlns="http://www.w3.org/2000/svg"><style>.node-fill{fill:#ffffff}.node-fill-accent{fill:#fff1ec}
.diagram-ink{stroke:#242424;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.diagram-accent{stroke:#d94a2b;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.diagram-soft{stroke:#a3a3a3;fill:none;stroke-width:1.1;stroke-dasharray:3 3}
.node-label{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#242424}
.node-label-accent{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:700;fill:#d94a2b}
.edge-label{font-family:Consolas,monospace;font-size:11px;fill:#666;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.branch-label{font-family:Consolas,monospace;font-size:11px;font-weight:700;fill:#d94a2b;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
<text class="node-label" text-anchor="middle" x="340" y="42">ObjectId = 12 字节 = 4 + 5 + 3</text>
<rect class="diagram-accent node-fill-accent" height="58" rx="6" stroke-width="1.8" width="190" x="60" y="64"></rect>
<text class="node-label-accent" text-anchor="middle" x="155" y="90">时间戳</text>
<text class="edge-label" text-anchor="middle" x="155" y="108">4 字节 · 秒级</text>
<rect class="diagram-ink node-fill" height="58" rx="6" width="240" x="250" y="64"></rect>
<text class="node-label" text-anchor="middle" x="370" y="90">随机值</text>
<text class="edge-label" text-anchor="middle" x="370" y="108">5 字节 · 机器+进程</text>
<rect class="diagram-ink node-fill" height="58" rx="6" width="130" x="490" y="64"></rect>
<text class="node-label" text-anchor="middle" x="555" y="90">计数器</text>
<text class="edge-label" text-anchor="middle" x="555" y="108">3 字节 · 自增</text>
<line class="diagram-accent" x1="155" x2="155" y1="138" y2="160"></line>
<text class="edge-label" text-anchor="middle" x="340" y="182">前 4 字节让 ObjectId 近似按时间递增 → 可排序，但直接做 shard key = 热点（06 章）</text>
</svg>