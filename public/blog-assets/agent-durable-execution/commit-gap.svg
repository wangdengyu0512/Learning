<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">外部提交与本地回执之间的故障窗口</title>
  <desc id="desc">本地保存动作键并发送请求，ERP 创建订单并原子记录动作键，Worker 在记录回执前崩溃。新 Worker 读取原动作键，向 ERP 查询已有订单，持久化证据后继续。查询未知时必须保留未知状态。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#475569"/></marker></defs>
  <rect width="960" height="640" rx="20" fill="#f8fafc"/>
  <g font-family="system-ui, 'Microsoft YaHei', sans-serif">
    <text x="40" y="50" font-size="26" font-weight="700" fill="#0f172a">订单已创建，回执尚未保存</text>
    <text x="40" y="80" font-size="16" fill="#475569">本例假设 ERP 支持动作去重与按动作键查询。</text>
    <rect x="40" y="106" width="400" height="44" rx="10" fill="#dbeafe"/>
    <rect x="520" y="106" width="400" height="44" rx="10" fill="#dcfce7"/>
    <g font-size="20" font-weight="600" text-anchor="middle" fill="#0f172a"><text x="240" y="135">Worker ＋ 工作流存储</text><text x="720" y="135">ERP ＋ 订单存储</text></g>
    <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"><path d="M240 155v385"/><path d="M720 155v385"/></g>
    <g font-size="17" fill="#0f172a">
      <rect x="70" y="169" width="340" height="40" rx="8" fill="#eff6ff"/><text x="90" y="195">1. 保存原动作键 K 及订单参数</text>
      <text x="380" y="230">2. 创建订单（K）</text>
      <path d="M245 244H713" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="540" y="258" width="360" height="56" rx="8" fill="#f0fdf4"/><text x="558" y="281">3. 提交订单 PO-17</text><text x="558" y="303" font-size="15">订单与 K 的去重记录原子持久化</text>
    </g>
    <rect x="40" y="330" width="880" height="68" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="60" y="357" font-size="19" font-weight="700" fill="#9a3412">4. Worker 崩溃：本地没有回执，ERP 已有订单</text>
    <text x="60" y="382" font-size="16" fill="#9a3412">本地显示未完成，不能据此判断外部未执行。</text>
    <g font-size="17" fill="#0f172a">
      <text x="60" y="430">5. 新 Worker 读取原动作键 K</text>
      <text x="385" y="457">查询原动作（K）</text>
      <path d="M245 470H713" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="377" y="498">返回已提交订单 PO-17</text>
      <path d="M715 511H247" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="60" y="532" width="390" height="40" rx="8" fill="#eff6ff"/><text x="78" y="558">6. 保存外部证据，继续后续步骤</text>
    </g>
    <text x="40" y="610" font-size="17" fill="#475569">查询仍未知时，继续核对或按契约同键重试；不生成新键绕过去重。</text>
  </g>
</svg>
