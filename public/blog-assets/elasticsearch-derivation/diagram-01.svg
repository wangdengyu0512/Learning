<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="Elasticsearch 概念地图：索引由不可变 segment 和固定数量 shard 组成，两者各自派生出写入与检索行为" role="img" viewBox="0 0 780 480" xmlns="http://www.w3.org/2000/svg"><style>.node-fill{fill:#ffffff}.node-fill-accent{fill:#fff1ec}
.diagram-ink{stroke:#242424;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.diagram-accent{stroke:#d94a2b;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.diagram-soft{stroke:#a3a3a3;fill:none;stroke-width:1.1;stroke-dasharray:3 3}
.node-label{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#242424}
.node-label-accent{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:700;fill:#d94a2b}
.edge-label{font-family:Consolas,monospace;font-size:11px;fill:#666;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.branch-label{font-family:Consolas,monospace;font-size:11px;font-weight:700;fill:#d94a2b;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
<defs>
<marker id="cm-ink" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
</marker>
<marker id="cm-soft" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#A3A3A3"/>
</marker>
</defs>
<!-- Top: index -->
<rect class="diagram-ink node-fill" height="50" rx="6" width="200" x="290" y="28"/>
<text class="node-label" text-anchor="middle" x="390" y="50">Elasticsearch 索引</text>
<text class="edge-label" text-anchor="middle" x="390" y="68">index</text>
<!-- Two pillars -->
<rect class="diagram-accent node-fill-accent" height="60" rx="6" stroke-width="2" width="216" x="92" y="150"/>
<text class="node-label-accent" text-anchor="middle" x="200" y="176">① Lucene segment</text>
<text class="edge-label" text-anchor="middle" x="200" y="196">不可变 immutable</text>
<rect class="diagram-accent node-fill-accent" height="60" rx="6" stroke-width="2" width="216" x="472" y="150"/>
<text class="node-label-accent" text-anchor="middle" x="580" y="176">② shard 分片</text>
<text class="edge-label" text-anchor="middle" x="580" y="196">数量创建即固定</text>
<!-- index -> pillars -->
<line class="diagram-ink" marker-end="url(#cm-ink)" x1="350" x2="232" y1="78" y2="150"/>
<text class="edge-label" text-anchor="middle" x="262" y="116">物理由…组成</text>
<line class="diagram-ink" marker-end="url(#cm-ink)" x1="430" x2="548" y1="78" y2="150"/>
<text class="edge-label" text-anchor="middle" x="520" y="116">水平切分为</text>
<!-- segment children -->
<rect class="diagram-ink node-fill" height="60" rx="6" width="116" x="16" y="288"/>
<text class="node-label" text-anchor="middle" x="74" y="312">倒排索引</text>
<text class="edge-label" text-anchor="middle" x="74" y="331">term→postings</text>
<rect class="diagram-ink node-fill" height="60" rx="6" width="116" x="146" y="288"/>
<text class="node-label" text-anchor="middle" x="204" y="312">refresh</text>
<text class="edge-label" text-anchor="middle" x="204" y="331">近实时·1s</text>
<rect class="diagram-ink node-fill" height="60" rx="6" width="116" x="276" y="288"/>
<text class="node-label" text-anchor="middle" x="334" y="312">段合并 merge</text>
<text class="edge-label" text-anchor="middle" x="334" y="331">删除才生效</text>
<!-- shard children -->
<rect class="diagram-ink node-fill" height="60" rx="6" width="128" x="452" y="288"/>
<text class="node-label" text-anchor="middle" x="516" y="312">路由 hash%N</text>
<text class="edge-label" text-anchor="middle" x="516" y="331">定位文档</text>
<rect class="diagram-ink node-fill" height="60" rx="6" width="160" x="596" y="288"/>
<text class="node-label" text-anchor="middle" x="676" y="312">分布式检索</text>
<text class="edge-label" text-anchor="middle" x="676" y="331">两阶段·IDF偏差</text>
<!-- segment -> children (fan) -->
<line class="diagram-ink" marker-end="url(#cm-ink)" x1="170" x2="80" y1="210" y2="288"/>
<line class="diagram-ink" marker-end="url(#cm-ink)" x1="200" x2="204" y1="210" y2="288"/>
<line class="diagram-ink" marker-end="url(#cm-ink)" x1="234" x2="330" y1="210" y2="288"/>
<text class="edge-label" text-anchor="middle" x="150" y="252">不可变⇒</text>
<!-- shard -> children (fan) -->
<line class="diagram-ink" marker-end="url(#cm-ink)" x1="548" x2="516" y1="210" y2="288"/>
<line class="diagram-ink" marker-end="url(#cm-ink)" x1="612" x2="676" y1="210" y2="288"/>
<text class="edge-label" text-anchor="middle" x="600" y="252">固定⇒</text>
<!-- text/keyword bottom -->
<rect class="diagram-ink node-fill" height="56" rx="6" width="292" x="244" y="402"/>
<text class="node-label" text-anchor="middle" x="390" y="426">text / keyword 分水岭</text>
<text class="edge-label" text-anchor="middle" x="390" y="445">分词可搜 / 原样可聚合排序</text>
<line class="diagram-soft" marker-end="url(#cm-soft)" x1="92" x2="320" y1="338" y2="404"/>
<text class="edge-label" text-anchor="middle" x="208" y="378">字段类型决定 term</text>
</svg>
