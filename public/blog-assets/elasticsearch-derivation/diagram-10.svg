<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="query_then_fetch 两阶段：阶段一各分片回传 id 和 score 给协调节点归并，阶段二只对选中文档取原文" role="img" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg"><style>.node-fill{fill:#ffffff}.node-fill-accent{fill:#fff1ec}
.diagram-ink{stroke:#242424;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.diagram-accent{stroke:#d94a2b;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.diagram-soft{stroke:#a3a3a3;fill:none;stroke-width:1.1;stroke-dasharray:3 3}
.node-label{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#242424}
.node-label-accent{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:700;fill:#d94a2b}
.edge-label{font-family:Consolas,monospace;font-size:11px;fill:#666;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.branch-label{font-family:Consolas,monospace;font-size:11px;font-weight:700;fill:#d94a2b;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
<defs>
<marker id="tp-ink" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
</marker>
<marker id="tp-acc" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"/>
</marker>
</defs>
<!-- coordinator -->
<rect class="diagram-accent node-fill-accent" height="56" rx="6" stroke-width="2" width="180" x="270" y="24"/>
<text class="node-label-accent" text-anchor="middle" x="360" y="48">coordinator</text>
<text class="edge-label" text-anchor="middle" x="360" y="67">归并全局 top-K</text>
<!-- three shards -->
<rect class="diagram-ink node-fill" height="60" rx="6" width="150" x="40" y="250"/>
<text class="node-label" text-anchor="middle" x="115" y="275">shard 0</text>
<text class="edge-label" text-anchor="middle" x="115" y="294">本地 top-K</text>
<rect class="diagram-ink node-fill" height="60" rx="6" width="150" x="285" y="250"/>
<text class="node-label" text-anchor="middle" x="360" y="275">shard 1</text>
<text class="edge-label" text-anchor="middle" x="360" y="294">本地 top-K</text>
<rect class="diagram-ink node-fill" height="60" rx="6" width="150" x="530" y="250"/>
<text class="node-label" text-anchor="middle" x="605" y="275">shard 2</text>
<text class="edge-label" text-anchor="middle" x="605" y="294">本地 top-K</text>
<!-- phase 1: shards -> coordinator (id+score up). left of each link -->
<line class="diagram-ink" marker-end="url(#tp-ink)" x1="120" x2="305" y1="250" y2="80"/>
<line class="diagram-ink" marker-end="url(#tp-ink)" x1="355" x2="352" y1="250" y2="80"/>
<line class="diagram-ink" marker-end="url(#tp-ink)" x1="600" x2="415" y1="250" y2="80"/>
<text class="edge-label" text-anchor="middle" x="150" y="150">① id + score</text>
<!-- phase 2: coordinator -> shards (fetch chosen docs) -->
<line class="diagram-accent" marker-end="url(#tp-acc)" x1="318" x2="158" y1="80" y2="250"/>
<text class="branch-label" text-anchor="middle" x="232" y="195">② fetch _source</text>
<text class="edge-label" text-anchor="middle" x="560" y="150">仅取选中的 K 条</text>
</svg>
