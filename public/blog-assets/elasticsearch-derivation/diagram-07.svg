<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="三个小 segment 含若干 soft-deleted 文档，经 merge 重写成一个新 segment，被删文档消失、空间回收" role="img" viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg"><style>.node-fill{fill:#ffffff}.node-fill-accent{fill:#fff1ec}
.diagram-ink{stroke:#242424;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.diagram-accent{stroke:#d94a2b;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.diagram-soft{stroke:#a3a3a3;fill:none;stroke-width:1.1;stroke-dasharray:3 3}
.node-label{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#242424}
.node-label-accent{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:700;fill:#d94a2b}
.edge-label{font-family:Consolas,monospace;font-size:11px;fill:#666;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.branch-label{font-family:Consolas,monospace;font-size:11px;font-weight:700;fill:#d94a2b;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
<defs>
<marker id="mg-ink" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"/>
</marker>
</defs>
<text class="edge-label" font-weight="700" text-anchor="middle" x="120" y="34">3 个小 segment（含 soft-deleted）</text>
<!-- seg 1 -->
<rect class="diagram-ink node-fill" height="58" rx="6" width="160" x="40" y="52"/>
<rect class="diagram-ink node-fill" height="30" rx="3" width="28" x="52" y="66"/>
<rect fill="#E5E5E5" height="30" rx="3" stroke="#A3A3A3" stroke-width="1" width="28" x="86" y="66"/>
<rect class="diagram-ink node-fill" height="30" rx="3" width="28" x="120" y="66"/>
<rect class="diagram-ink node-fill" height="30" rx="3" width="28" x="154" y="66"/>
<!-- seg 2 -->
<rect class="diagram-ink node-fill" height="58" rx="6" width="160" x="40" y="128"/>
<rect fill="#E5E5E5" height="30" rx="3" stroke="#A3A3A3" stroke-width="1" width="28" x="52" y="142"/>
<rect class="diagram-ink node-fill" height="30" rx="3" width="28" x="86" y="142"/>
<rect fill="#E5E5E5" height="30" rx="3" stroke="#A3A3A3" stroke-width="1" width="28" x="120" y="142"/>
<rect class="diagram-ink node-fill" height="30" rx="3" width="28" x="154" y="142"/>
<!-- seg 3 -->
<rect class="diagram-ink node-fill" height="58" rx="6" width="160" x="40" y="204"/>
<rect class="diagram-ink node-fill" height="30" rx="3" width="28" x="52" y="218"/>
<rect class="diagram-ink node-fill" height="30" rx="3" width="28" x="86" y="218"/>
<rect fill="#E5E5E5" height="30" rx="3" stroke="#A3A3A3" stroke-width="1" width="28" x="120" y="218"/>
<rect class="diagram-ink node-fill" height="30" rx="3" width="28" x="154" y="218"/>
<!-- legend -->
<rect fill="#E5E5E5" height="20" rx="3" stroke="#A3A3A3" stroke-width="1" width="20" x="40" y="282"/>
<text class="edge-label" x="68" y="297">= soft-deleted（占空间）</text>
<!-- merge arrow -->
<line class="diagram-accent" marker-end="url(#mg-ink)" x1="200" x2="408" y1="157" y2="157"/>
<text class="branch-label" text-anchor="middle" x="304" y="148">merge 重写</text>
<text class="edge-label" text-anchor="middle" x="304" y="176">只搬存活文档</text>
<!-- new merged segment -->
<text class="edge-label" font-weight="700" text-anchor="middle" x="560" y="100">1 个新 segment</text>
<rect class="diagram-accent node-fill-accent" height="82" rx="6" width="248" x="436" y="116"/>
<rect class="diagram-ink node-fill" height="34" rx="3" width="32" x="452" y="140"/>
<rect class="diagram-ink node-fill" height="34" rx="3" width="32" x="492" y="140"/>
<rect class="diagram-ink node-fill" height="34" rx="3" width="32" x="532" y="140"/>
<rect class="diagram-ink node-fill" height="34" rx="3" width="32" x="572" y="140"/>
<rect class="diagram-ink node-fill" height="34" rx="3" width="32" x="612" y="140"/>
<text class="node-label-accent" text-anchor="middle" x="560" y="216">被删文档消失 · 空间回收</text>
</svg>
