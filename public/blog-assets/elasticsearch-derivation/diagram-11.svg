<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="倒排索引提供 term 到文档的方向，doc_values 提供文档到值的反方向，分别服务搜索与聚合" role="img" viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg"><style>.node-fill{fill:#ffffff}.node-fill-accent{fill:#fff1ec}
.diagram-ink{stroke:#242424;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.diagram-accent{stroke:#d94a2b;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.diagram-soft{stroke:#a3a3a3;fill:none;stroke-width:1.1;stroke-dasharray:3 3}
.node-label{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#242424}
.node-label-accent{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:13px;font-weight:700;fill:#d94a2b}
.edge-label{font-family:Consolas,monospace;font-size:11px;fill:#666;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.branch-label{font-family:Consolas,monospace;font-size:11px;font-weight:700;fill:#d94a2b;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
<defs>
<marker id="dv-ink" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
</marker>
<marker id="dv-acc" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"/>
</marker>
</defs>
<!-- left: inverted index -->
<rect class="diagram-ink node-fill" height="60" rx="6" width="170" x="30" y="95"/>
<text class="node-label" text-anchor="middle" x="115" y="120">倒排索引</text>
<text class="edge-label" text-anchor="middle" x="115" y="139">term → docs</text>
<!-- right: doc_values -->
<rect class="diagram-accent node-fill-accent" height="60" rx="6" stroke-width="2" width="170" x="500" y="95"/>
<text class="node-label-accent" text-anchor="middle" x="585" y="120">doc_values</text>
<text class="edge-label" text-anchor="middle" x="585" y="139">doc → value（列式）</text>
<!-- top arrow: search uses inverted (left to right meaning search) -->
<line class="diagram-soft" marker-end="url(#dv-acc)" x1="200" x2="500" y1="118" y2="118"/>
<text class="edge-label" text-anchor="middle" x="350" y="58">搜索走左边 · 聚合 / 排序走右边</text>
<text class="edge-label" text-anchor="middle" x="350" y="110">方向相反</text>
<!-- usage labels under boxes -->
<text class="edge-label" text-anchor="middle" x="115" y="185">服务：match / term 检索</text>
<text class="edge-label" text-anchor="middle" x="585" y="185">服务：聚合 · 排序 · 脚本字段</text>
</svg>
