<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc">
<title id="title">最小可观测架构</title><desc id="desc">任务入口到业务验证，分别保存Trace、用量和关键动作，再进入排障及回归评估。</desc>
<style>text{font-family:Segoe UI,Microsoft YaHei,PingFang SC,sans-serif;fill:#1e293b} .muted{fill:#64748b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1040" height="650" rx="18" fill="#f8fafc"/>
<text x="32" y="42" font-size="26" fill="#1e293b" style="fill:#1e293b">从一条可排障的执行链开始</text>
<text x="32" y="70" font-size="16" fill="#64748b" style="fill:#64748b">工程示例 · 三类记录共享关联标识，按不同完整性要求保存</text>
<rect x="30" y="108" width="210" height="76" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
<text x="46" y="137" font-size="18" fill="#1e293b" style="fill:#1e293b">任务入口</text>
<text x="46" y="162" font-size="14" fill="#475569" style="fill:#475569">任务、用户、配置版本</text>
<rect x="290" y="108" width="210" height="76" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
<text x="306" y="137" font-size="18" fill="#1e293b" style="fill:#1e293b">Agent 执行</text>
<text x="306" y="162" font-size="14" fill="#475569" style="fill:#475569">模型、检索、工具调用</text>
<rect x="550" y="108" width="210" height="76" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
<text x="566" y="137" font-size="18" fill="#1e293b" style="fill:#1e293b">动作边界</text>
<text x="566" y="162" font-size="14" fill="#475569" style="fill:#475569">授权、审批、幂等检查</text>
<rect x="810" y="108" width="200" height="76" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
<text x="826" y="137" font-size="18" fill="#1e293b" style="fill:#1e293b">结果验证</text>
<text x="826" y="162" font-size="14" fill="#475569" style="fill:#475569">回执、业务状态</text>
<path d="M240 146 L290 146" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M500 146 L550 146" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M760 146 L810 146" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="235" font-size="17" fill="#475569" style="fill:#475569">任务 ID / 执行 ID / 调用与动作 ID 连接下方记录</text>
<rect x="35" y="284" width="300" height="100" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="51" y="313" font-size="18" fill="#1e293b" style="fill:#1e293b">Trace 与调试内容</text>
<text x="51" y="338" font-size="14" fill="#475569" style="fill:#475569">执行步骤、受控内容引用</text>
<text x="51" y="364" font-size="15" fill="#64748b" style="fill:#64748b">明确采样范围与保留期限</text>
<rect x="370" y="284" width="300" height="100" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="386" y="313" font-size="18" fill="#1e293b" style="fill:#1e293b">用量记录</text>
<text x="386" y="338" font-size="14" fill="#475569" style="fill:#475569">计量来源、价格版本、完整性</text>
<text x="386" y="364" font-size="15" fill="#64748b" style="fill:#64748b">逐次计费去重，未知用量可补齐</text>
<rect x="705" y="284" width="300" height="100" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="721" y="313" font-size="18" fill="#1e293b" style="fill:#1e293b">动作与业务记录</text>
<text x="721" y="338" font-size="14" fill="#475569" style="fill:#475569">获批参数、实际参数、执行回执</text>
<text x="721" y="364" font-size="15" fill="#64748b" style="fill:#64748b">关键动作持久化，与业务系统核对</text>
<path d="M395 184 L185 284" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M395 184 L520 284" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M910 184 L855 284" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M185 384 L185 436" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M520 384 L520 436" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M855 384 L855 436" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="436" width="970" height="72" rx="10" fill="#f0fdf4" stroke="#86efac"/>
<text x="51" y="465" font-size="18" fill="#1e293b" style="fill:#1e293b">统一查询入口：从任务进入 Trace，关联成本、动作证据与最终结果</text>
<text x="51" y="490" font-size="14" fill="#475569" style="fill:#475569">排障 → 定位首次偏差 → 修复 → 在隔离环境中执行回归样本</text>
<text x="32" y="555" font-size="18" fill="#1e293b" style="fill:#1e293b">验收用故障：查询超时 / 受理后拒绝 / 重复投递 / 遥测采集故障</text>
<text x="32" y="593" font-size="17" fill="#475569" style="fill:#475569">调试 Trace 可以采样；总用量和关键动作证据需要独立的完整性策略。</text>
</svg>