<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="差旅助理 agent 一次运行的 span 树：invoke_agent 为根，下有 4 个 chat span，每个 chat 下挂 execute_tool 或 retriever 子 span" role="img" viewbox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arr12" markerheight="7" markerwidth="7" orient="auto" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"></path>
</marker>
</defs>
<!-- Root: invoke_agent -->
<rect class="diagram-accent node-fill-accent" height="44" rx="6" stroke-width="2" width="280" x="240" y="20"></rect>
<text class="node-label-accent" text-anchor="middle" x="380" y="40">invoke_agent</text>
<text class="edge-label" text-anchor="middle" x="380" y="56">trace_id: t001 · parent: —</text>
<!-- Lines from root to chat nodes -->
<line class="diagram-ink" marker-end="url(#arr12)" x1="380" x2="110" y1="64" y2="118"></line>
<line class="diagram-ink" marker-end="url(#arr12)" x1="380" x2="280" y1="64" y2="118"></line>
<line class="diagram-ink" marker-end="url(#arr12)" x1="380" x2="460" y1="64" y2="118"></line>
<line class="diagram-ink" marker-end="url(#arr12)" x1="380" x2="630" y1="64" y2="118"></line>
<!-- chat 1: 查政策 -->
<rect class="diagram-ink node-fill" height="44" rx="5" width="160" x="30" y="118"></rect>
<text class="node-label" text-anchor="middle" x="110" y="138">chat</text>
<text class="edge-label" text-anchor="middle" x="110" y="154">决定查差旅政策</text>
<!-- chat 2: 查航班 -->
<rect class="diagram-ink node-fill" height="44" rx="5" width="160" x="200" y="118"></rect>
<text class="node-label" text-anchor="middle" x="280" y="138">chat</text>
<text class="edge-label" text-anchor="middle" x="280" y="154">决定查航班</text>
<!-- chat 3: 选航班 -->
<rect class="diagram-ink node-fill" height="44" rx="5" width="160" x="380" y="118"></rect>
<text class="node-label" text-anchor="middle" x="460" y="138">chat</text>
<text class="edge-label" text-anchor="middle" x="460" y="154">选符合政策的票</text>
<!-- chat 4: 生成确认 -->
<rect class="diagram-ink node-fill" height="44" rx="5" width="160" x="560" y="118"></rect>
<text class="node-label" text-anchor="middle" x="640" y="138">chat</text>
<text class="edge-label" text-anchor="middle" x="640" y="154">生成确认答复</text>
<!-- Tool under chat 1: retrieve_policy -->
<line class="diagram-ink" marker-end="url(#arr12)" x1="110" x2="110" y1="162" y2="224"></line>
<rect class="diagram-soft node-fill" height="44" rx="5" width="160" x="30" y="224"></rect>
<text class="node-label" text-anchor="middle" x="110" y="244">retriever</text>
<text class="edge-label" text-anchor="middle" x="110" y="260">retrieve_policy</text>
<!-- Tool under chat 2: search_flights -->
<line class="diagram-ink" marker-end="url(#arr12)" x1="280" x2="280" y1="162" y2="224"></line>
<rect class="diagram-soft node-fill" height="44" rx="5" width="160" x="200" y="224"></rect>
<text class="node-label" text-anchor="middle" x="280" y="244">execute_tool</text>
<text class="edge-label" text-anchor="middle" x="280" y="260">search_flights</text>
<!-- Tool under chat 3: book_flight -->
<line class="diagram-ink" marker-end="url(#arr12)" x1="460" x2="460" y1="162" y2="224"></line>
<rect class="diagram-soft node-fill" height="44" rx="5" width="160" x="380" y="224"></rect>
<text class="node-label" text-anchor="middle" x="460" y="244">execute_tool</text>
<text class="edge-label" text-anchor="middle" x="460" y="260">book_flight</text>
<!-- Legend -->
<rect class="diagram-accent node-fill-accent" height="26" rx="4" stroke-width="1.5" width="140" x="30" y="330"></rect>
<text class="edge-label" text-anchor="middle" x="100" y="348">编排根 span</text>
<rect class="diagram-ink node-fill" height="26" rx="4" width="140" x="200" y="330"></rect>
<text class="edge-label" text-anchor="middle" x="270" y="348">LLM 调用 span</text>
<rect class="diagram-soft node-fill" height="26" rx="4" width="140" x="380" y="330"></rect>
<text class="edge-label" text-anchor="middle" x="450" y="348">工具/检索 span</text>
<text class="edge-label" text-anchor="middle" x="380" y="400">所有 span 共享同一 trace_id；parent_span_id 指向父节点</text>
<style>
.diagram-ink{stroke:#0A0A0A;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.diagram-accent{stroke:#B73B2F;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.diagram-soft{stroke:#A3A3A3;fill:none;stroke-width:1.1;stroke-dasharray:3 3}.node-fill{fill:#FFFFFF}.node-fill-accent{fill:rgba(183,59,47,.06)}.node-label{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:13px;font-weight:500;fill:#0A0A0A}.node-label-accent{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:13px;font-weight:700;fill:#B73B2F}.edge-label{font-family:monospace;font-size:11px;fill:#525252;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}.branch-label{font-family:monospace;font-size:11px;font-weight:700;fill:#B73B2F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}</style>
</svg>