<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1230" viewBox="0 0 1100 1230" role="img" aria-labelledby="title desc">
<title id="title">企业级 Agent OS 总体架构</title><desc id="desc">业务入口向 Agent OS 提交目标与约束。Agent OS 包含运行框架、调度管理、数据基座、生态链接、安全管理与持续进化六项能力。所有资源访问经过受控接口，连接模型服务、企业系统与执行基础设施。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3266ad"/></marker>
<marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#157d7a"/></marker>
<style>text { font-family: 'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif; } .title { font-size: 32px; font-weight: 700; fill: #182c44; } .heading { font-size: 25px; font-weight: 700; fill: #182c44; } .body { font-size: 22px; fill: #50647b; } .small { font-size: 20px; fill: #50647b; }</style>
</defs><rect width="1100" height="1230" rx="20" fill="#f8fafc"/>
<text x="40" y="56" class="title" text-anchor="start">企业级 Agent OS 总体架构</text>
<text x="40" y="94" class="body" text-anchor="start">业务定义目标，公共运行底座组织执行，企业系统提供权威状态</text>
<rect x="40" y="130" width="1020" height="100" rx="14" fill="#eef4fc" stroke="#d4dfeb" stroke-width="1.5"/>
<rect x="40" y="145" width="4" height="70" rx="2" fill="#3266ad"/>
<text x="62" y="166" class="heading" text-anchor="start">业务应用与任务入口</text>
<text x="62" y="200" class="body" text-anchor="start">目标与完成标准  ·  业务规则  ·  用户请求与业务事件</text>
<path d="M 550 230 L 550 280" fill="none" stroke="#3266ad" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="285" width="1020" height="640" rx="18" fill="#f0f5fa" stroke="#b8cce2" stroke-width="1.5"/>
<text x="64" y="327" class="heading" text-anchor="start">Agent OS · 公共运行与治理</text>
<text x="64" y="361" class="body" text-anchor="start">共同契约：任务标识 / 身份授权 / 状态语义 / 能力版本 / 审计关联</text>
<rect x="64" y="390" width="474" height="140" rx="14" fill="#fff" stroke="#d4dfeb" stroke-width="1.5"/>
<rect x="64" y="405" width="4" height="110" rx="2" fill="#3266ad"/>
<text x="86" y="426" class="heading" text-anchor="start">01  统一运行框架</text>
<text x="86" y="460" class="body" text-anchor="start">任务生命周期与计划管理</text>
<text x="86" y="490" class="body" text-anchor="start">质量校验、动作记录与结果核验</text>
<rect x="562" y="390" width="474" height="140" rx="14" fill="#fff" stroke="#d4dfeb" stroke-width="1.5"/>
<rect x="562" y="405" width="4" height="110" rx="2" fill="#3266ad"/>
<text x="584" y="426" class="heading" text-anchor="start">02  统一调度管理</text>
<text x="584" y="460" class="body" text-anchor="start">队列、并发、配额与隔离环境</text>
<text x="584" y="490" class="body" text-anchor="start">资源分配、模型路由与故障转移</text>
<rect x="64" y="550" width="474" height="140" rx="14" fill="#fff" stroke="#d4dfeb" stroke-width="1.5"/>
<rect x="64" y="565" width="4" height="110" rx="2" fill="#3266ad"/>
<text x="86" y="586" class="heading" text-anchor="start">03  统一数据基座</text>
<text x="86" y="620" class="body" text-anchor="start">业务语义、可信事实与知识规则</text>
<text x="86" y="650" class="body" text-anchor="start">上下文组织、任务状态与分层记忆</text>
<rect x="562" y="550" width="474" height="140" rx="14" fill="#fff" stroke="#d4dfeb" stroke-width="1.5"/>
<rect x="562" y="565" width="4" height="110" rx="2" fill="#3266ad"/>
<text x="584" y="586" class="heading" text-anchor="start">04  统一生态链接</text>
<text x="584" y="620" class="body" text-anchor="start">模型、工具、服务与智能体注册</text>
<text x="584" y="650" class="body" text-anchor="start">接口适配、异步回执与执行契约</text>
<rect x="64" y="710" width="474" height="140" rx="14" fill="#eaf6f3" stroke="#d4dfeb" stroke-width="1.5"/>
<rect x="64" y="725" width="4" height="110" rx="2" fill="#157d7a"/>
<text x="86" y="746" class="heading" text-anchor="start">05  统一安全管理</text>
<text x="86" y="780" class="body" text-anchor="start">身份、授权、审批与隔离</text>
<text x="86" y="810" class="body" text-anchor="start">贯穿执行的策略、观测与审计</text>
<rect x="562" y="710" width="474" height="140" rx="14" fill="#eaf6f3" stroke="#d4dfeb" stroke-width="1.5"/>
<rect x="562" y="725" width="4" height="110" rx="2" fill="#157d7a"/>
<text x="584" y="746" class="heading" text-anchor="start">06  统一持续进化</text>
<text x="584" y="780" class="body" text-anchor="start">反馈提炼、证据校验与回归评估</text>
<text x="584" y="810" class="body" text-anchor="start">共享资产的版本发布与失效管理</text>
<text x="550" y="893" class="small" text-anchor="middle">六项能力协同工作；安全治理贯穿全程，运行结果进入持续反馈</text>
<path d="M 550 925 L 550 960" fill="none" stroke="#3266ad" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="965" width="1020" height="66" rx="14" fill="#e8f0fc" stroke="#b8cce2" stroke-width="1.5"/>
<text x="550" y="1007" class="body" text-anchor="middle" style="fill:#3266ad">受控资源访问：身份传递 → 策略校验 → 协议执行 → 回执与结果核对</text>
<path d="M 550 1031 L 550 1052 L 205 1052 L 205 1075" fill="none" stroke="#3266ad" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 550 1052 L 550 1075" fill="none" stroke="#3266ad" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 550 1052 L 895 1052 L 895 1075" fill="none" stroke="#3266ad" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="1080" width="330" height="105" rx="14" fill="#fff" stroke="#d4dfeb" stroke-width="1.5"/>
<rect x="40" y="1095" width="4" height="75" rx="2" fill="#3266ad"/>
<text x="62" y="1116" class="heading" text-anchor="start">模型服务</text>
<text x="62" y="1150" class="body" text-anchor="start">推理、规划与候选输出</text>
<rect x="385" y="1080" width="330" height="105" rx="14" fill="#fff" stroke="#d4dfeb" stroke-width="1.5"/>
<rect x="385" y="1095" width="4" height="75" rx="2" fill="#3266ad"/>
<text x="407" y="1116" class="heading" text-anchor="start">企业数据与业务系统</text>
<text x="407" y="1150" class="body" text-anchor="start">权威事实与受控业务操作</text>
<rect x="730" y="1080" width="330" height="105" rx="14" fill="#fff" stroke="#d4dfeb" stroke-width="1.5"/>
<rect x="730" y="1095" width="4" height="75" rx="2" fill="#3266ad"/>
<text x="752" y="1116" class="heading" text-anchor="start">执行基础设施</text>
<text x="752" y="1150" class="body" text-anchor="start">计算、存储、消息与沙箱</text>
<text x="550" y="1212" class="small" text-anchor="middle">统一治理规则支持多副本、分布式执行与按边界隔离部署</text>
</svg>
