<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">研究报告系统架构</title><desc id="desc">协调 Agent 通过 A2A 对接检索、分析和写作 Agent，管理任务与产物；结果验证器决定验收，各专业 Agent 使用自己的工具与数据。</desc>
