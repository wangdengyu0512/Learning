<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="三层梯度金字塔：概念层、机制层、应用判别层，自上而下整合度与难度上升" role="img" viewbox="0 0 760 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="grad-down" markerheight="8" markerwidth="8" orient="auto" refx="5" refy="9" viewbox="0 0 10 10">
<path d="M 0 0 L 5 10 L 10 0 z" fill="#525252"></path>
</marker>
</defs>
<!-- difficulty axis on the left -->
<line class="diagram-ink" marker-end="url(#grad-down)" x1="70" x2="70" y1="92" y2="252"></line>
<text class="edge-label" text-anchor="middle" x="70" y="84">易</text>
<text class="edge-label" text-anchor="middle" x="70" y="272">难</text>
<!-- band 1: 概念层 (narrow, top) -->
<rect class="diagram-ink node-fill" height="58" rx="5" width="200" x="280" y="72"></rect>
<text class="node-label" text-anchor="middle" x="380" y="96">① 概念层</text>
<text class="edge-label" text-anchor="middle" x="380" y="114">记得 · 认得（词汇 / 边界）</text>
<!-- band 2: 机制层 (mid) -->
<rect class="diagram-ink node-fill" height="58" rx="5" width="340" x="210" y="142"></rect>
<text class="node-label" text-anchor="middle" x="380" y="166">② 机制层</text>
<text class="edge-label" text-anchor="middle" x="380" y="184">会推 · 会算（传播 / 归因 / instrument）</text>
<!-- band 3: 应用判别层 (wide, bottom, accent) -->
<rect class="diagram-accent node-fill-accent" height="58" rx="5" stroke-width="2" width="520" x="120" y="212"></rect>
<text class="node-label-accent" text-anchor="middle" x="380" y="236">③ 应用判别层</text>
<text class="edge-label" text-anchor="middle" x="380" y="254">会选 · 会判（obs/eval/APM · 选型 · 根因）</text>
<style>
.diagram-ink{stroke:#0A0A0A;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.diagram-accent{stroke:#B73B2F;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.diagram-soft{stroke:#A3A3A3;fill:none;stroke-width:1.1;stroke-dasharray:3 3}.node-fill{fill:#FFFFFF}.node-fill-accent{fill:rgba(183,59,47,.06)}.node-label{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:13px;font-weight:500;fill:#0A0A0A}.node-label-accent{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:13px;font-weight:700;fill:#B73B2F}.edge-label{font-family:monospace;font-size:11px;fill:#525252;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}.branch-label{font-family:monospace;font-size:11px;font-weight:700;fill:#B73B2F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}</style>
</svg>