<text class="node-label" font-weight="700" text-anchor="middle" x="560" y="100">events（opt-in）</text>
<text class="edge-label" text-anchor="middle" x="560" y="118">name: gen_ai.input.messages</text>
<text class="edge-label" text-anchor="middle" x="560" y="136">timestamp: 2026-06-03T09:00:00Z</text>
<text class="edge-label" text-anchor="middle" x="560" y="154">body: [{role:system, …},</text>
<text class="edge-label" text-anchor="middle" x="560" y="170">       {role:user, content:…}]</text>
<line class="diagram-soft" x1="480" x2="640" y1="182" y2="182"></line>
<text class="edge-label" text-anchor="middle" x="560" y="200">name: gen_ai.output.messages</text>
<text class="edge-label" text-anchor="middle" x="560" y="218">timestamp: 2026-06-03T09:00:01Z</text>
