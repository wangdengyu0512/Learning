<text class="edge-label" text-anchor="middle" x="200" y="118">gen_ai.provider.name: openai</text>
<text class="edge-label" text-anchor="middle" x="200" y="136">gen_ai.request.model: gpt-4o</text>
<text class="edge-label" text-anchor="middle" x="200" y="154">gen_ai.response.model: gpt-4o-2024-11-20</text>
<text class="edge-label" text-anchor="middle" x="200" y="172">gen_ai.usage.input_tokens: 1284</text>
<text class="edge-label" text-anchor="middle" x="200" y="190">gen_ai.usage.output_tokens: 312</text>
<text class="edge-label" text-anchor="middle" x="200" y="208">gen_ai.usage.cache_read.input_tokens: 800</text>
