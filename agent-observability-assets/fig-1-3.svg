<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="一个 chat span 的解剖：左侧是 attributes（结构化元数据），右侧是 events（prompt/completion 文本），底部是 status 和时间" role="img" viewbox="0 0 760 460" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arr13" markerheight="7" markerwidth="7" orient="auto" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"></path>
</marker>
<marker id="arr13-r" markerheight="7" markerwidth="7" orient="auto" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#B73B2F"></path>
</marker>
</defs>
<!-- span outer frame -->
<rect class="diagram-accent node-fill-accent" height="400" rx="8" stroke-width="2" width="700" x="30" y="20"></rect>
<text class="node-label-accent" font-size="15" text-anchor="middle" x="380" y="46">chat span</text>
<text class="edge-label" text-anchor="middle" x="380" y="62">name="chat" · kind=CLIENT · trace_id=t001 · span_id=s003 · parent=s001</text>
