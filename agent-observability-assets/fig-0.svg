<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="Agent 可观测性概念地图：中心是把一次运行还原成 span 因果树，四个内容章环绕，右下虚线为 eval 边界" role="img" viewbox="0 0 820 500" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="cm-arrow" markerheight="7" markerwidth="7" orient="auto" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"></path>
</marker>
</defs>
<!-- spokes drawn first, under the boxes -->
<line class="diagram-ink" marker-end="url(#cm-arrow)" x1="410" x2="410" y1="232" y2="100"></line>
<line class="diagram-ink" marker-end="url(#cm-arrow)" x1="312" x2="252" y1="254" y2="194"></line>
<line class="diagram-ink" marker-end="url(#cm-arrow)" x1="508" x2="568" y1="254" y2="194"></line>
<line class="diagram-ink" marker-end="url(#cm-arrow)" x1="312" x2="252" y1="286" y2="406"></line>
<line class="diagram-soft" marker-end="url(#cm-arrow)" x1="508" x2="568" y1="286" y2="406"></line>
<!-- spoke labels -->
<text class="edge-label" x="420" y="172">是什么</text>
<text class="edge-label" text-anchor="end" x="300" y="214">怎么造</text>
<text class="edge-label" text-anchor="start" x="520" y="214">用什么</text>
<text class="edge-label" text-anchor="end" x="300" y="356">做什么</text>
<text class="branch-label" text-anchor="start" x="528" y="356">≠ 接缝</text>
<!-- center node -->
<rect class="diagram-accent node-fill-accent" height="76" rx="8" stroke-width="2" width="200" x="310" y="232"></rect>
<text class="node-label-accent" font-size="15" text-anchor="middle" x="410" y="266">Agent 可观测性</text>
<text class="edge-label" font-weight="700" text-anchor="middle" x="410" y="288">一次运行 → span 因果树</text>
<!-- N: 01 concepts -->
<rect class="diagram-ink node-fill" height="56" rx="6" width="220" x="300" y="44"></rect>
<text class="node-label" text-anchor="middle" x="410" y="68">① 概念与边界</text>
<text class="edge-label" text-anchor="middle" x="410" y="86">可观测性 ≠ eval ≠ APM</text>
<!-- NW: 02 mechanism -->
<rect class="diagram-ink node-fill" height="60" rx="6" width="210" x="42" y="146"></rect>
<text class="node-label" text-anchor="middle" x="147" y="170">② 机制</text>
<text class="edge-label" text-anchor="middle" x="147" y="190">trace 树怎么长出来</text>
<!-- NE: 04 tools & frontier -->
<rect class="diagram-ink node-fill" height="60" rx="6" width="210" x="568" y="146"></rect>
<text class="node-label" text-anchor="middle" x="673" y="170">④ 工具与前沿</text>
<text class="edge-label" text-anchor="middle" x="673" y="190">选型 · 2026 走向</text>
<!-- SW: 03 operations -->
<rect class="diagram-ink node-fill" height="60" rx="6" width="210" x="42" y="394"></rect>
<text class="node-label" text-anchor="middle" x="147" y="418">③ 落地</text>
<text class="edge-label" text-anchor="middle" x="147" y="438">调试·监控·在线评估</text>
<!-- SE dashed: eval boundary -->
<rect class="diagram-soft node-fill" height="60" rx="6" width="210" x="568" y="394"></rect>
<text class="node-label" text-anchor="middle" x="673" y="418">eval（你已有）</text>
<text class="edge-label" text-anchor="middle" x="673" y="438">开发期·数据集·打分</text>
<style>
.diagram-ink{stroke:#0A0A0A;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.diagram-accent{stroke:#B73B2F;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.diagram-soft{stroke:#A3A3A3;fill:none;stroke-width:1.1;stroke-dasharray:3 3}.node-fill{fill:#FFFFFF}.node-fill-accent{fill:rgba(183,59,47,.06)}.node-label{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:13px;font-weight:500;fill:#0A0A0A}.node-label-accent{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:13px;font-weight:700;fill:#B73B2F}.edge-label{font-family:monospace;font-size:11px;fill:#525252;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}.branch-label{font-family:monospace;font-size:11px;font-weight:700;fill:#B73B2F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}</style>
</svg>