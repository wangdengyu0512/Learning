<text class="edge-label" text-anchor="end" x="140" y="74">2024末</text>
<rect class="diagram-ink node-fill" height="34" rx="4" width="566" x="178" y="53"></rect>
<text class="node-label" font-size="12" text-anchor="start" x="192" y="74">v1.38：弃用 gen_ai.prompt → 改 gen_ai.input.messages</text>
<!-- 2 · 2025-02 · OpenLLMetry 捐赠停滞 -->
<circle cx="152" cy="122" fill="#A3A3A3" r="5"></circle>
<text class="edge-label" text-anchor="end" x="140" y="126">2025-02</text>
<rect fill="none" height="34" rx="4" stroke="#A3A3A3" stroke-dasharray="3 3" stroke-width="1" width="566" x="178" y="105"></rect>
<text class="node-label" font-size="12" text-anchor="start" x="192" y="126">OpenLLMetry 提交捐赠 OTel —— 至今停滞 14+ 个月（未决）</text>
<!-- 3 · 2025-03 · Arize 收 Velvet -->
<circle cx="152" cy="174" fill="#0A0A0A" r="5"></circle>
<text class="edge-label" text-anchor="end" x="140" y="178">2025-03</text>
<rect class="diagram-ink node-fill" height="34" rx="4" width="566" x="178" y="157"></rect>
<text class="node-label" font-size="12" text-anchor="start" x="192" y="178">Arize 收购 Velvet（同期 Arize 完成 $70M C 轮）</text>
<!-- 4 · 2025-04 · v1.41 -->
<circle cx="152" cy="226" fill="#0A0A0A" r="5"></circle>
<text class="edge-label" text-anchor="end" x="140" y="230">2025-04</text>
<rect class="diagram-ink node-fill" height="34" rx="4" width="566" x="178" y="209"></rect>
<text class="node-label" font-size="12" text-anchor="start" x="192" y="230">v1.41：拆分 invoke_agent + 加 cache / reasoning token 属性</text>
