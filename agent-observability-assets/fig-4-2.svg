<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="前沿时间线（纵向）：2024末弃用属性、2025 多次规格与并购、到 2026-03 Helicone 转维护，规格/并购/停滞/过时四类事件" role="img" viewbox="0 0 820 472" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="tl-down" markerheight="8" markerwidth="8" orient="auto" refx="5" refy="9" viewbox="0 0 10 10">
<path d="M 0 0 L 5 10 L 10 0 z" fill="#525252"></path>
</marker>
</defs>
<!-- 纵向时间轴（时间向下流） -->
<text class="edge-label" text-anchor="middle" x="152" y="30">时间 ↓</text>
