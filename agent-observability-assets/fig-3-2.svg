<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="在线评估接缝闭环：生产 trace 采样后异步 scorer 打分，写回 trace，低分提拔进离线集，喂回 agent-eval" role="img" viewbox="0 0 820 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="oe-arrow" markerheight="7" markerwidth="7" orient="auto" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
<marker id="oe-soft" markerheight="7" markerwidth="7" orient="auto" refx="9" refy="5" viewbox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#A3A3A3"></path>
</marker>
</defs>
<!-- Production environment -->
<rect class="diagram-soft" height="100" rx="8" width="260" x="10" y="10"></rect>
<text class="edge-label" text-anchor="middle" x="140" y="30">生产环境</text>
<rect class="diagram-ink node-fill" height="56" rx="6" width="220" x="30" y="40"></rect>
<text class="node-label" text-anchor="middle" x="140" y="65">agent 运行</text>
<text class="edge-label" text-anchor="middle" x="140" y="83">trace 落库（含中间状态）</text>
<!-- Trace store -->
<rect class="diagram-ink node-fill" height="60" rx="6" width="180" x="310" y="30"></rect>
<text class="node-label" text-anchor="middle" x="400" y="57">Trace 存储</text>
<text class="edge-label" text-anchor="middle" x="400" y="75">所有 span 落库</text>
<line class="diagram-ink" marker-end="url(#oe-arrow)" x1="250" x2="310" y1="68" y2="60"></line>
<text class="edge-label" text-anchor="middle" x="280" y="52">emit</text>
<!-- Sampling -->
<rect class="diagram-ink node-fill" height="56" rx="6" width="180" x="310" y="140"></rect>
<text class="node-label" text-anchor="middle" x="400" y="165">分层采样</text>
<text class="edge-label" text-anchor="middle" x="400" y="183">1–10%，坏区多采</text>
<line class="diagram-ink" marker-end="url(#oe-arrow)" x1="400" x2="400" y1="90" y2="140"></line>
<!-- Async scorer -->
<rect class="diagram-accent node-fill-accent" height="56" rx="6" width="200" x="530" y="140"></rect>
<text class="node-label-accent" text-anchor="middle" x="630" y="165">异步 scorer</text>
<text class="edge-label" text-anchor="middle" x="630" y="183">LLM-as-judge / 规则</text>
<line class="diagram-ink" marker-end="url(#oe-arrow)" x1="490" x2="530" y1="168" y2="168"></line>
<text class="edge-label" text-anchor="middle" x="510" y="160">异步</text>
<!-- Score writeback -->
<line class="diagram-ink" marker-end="url(#oe-arrow)" x1="630" x2="630" y1="196" y2="256"></line>
<rect class="diagram-ink node-fill" height="54" rx="6" width="200" x="530" y="258"></rect>
<text class="node-label" text-anchor="middle" x="630" y="282">写回 score</text>
<text class="edge-label" text-anchor="middle" x="630" y="300">name/value/comment</text>
<line class="diagram-ink" marker-end="url(#oe-arrow)" x1="530" x2="490" y1="285" y2="285"></line>
<text class="edge-label" text-anchor="middle" x="510" y="277">写回</text>
<!-- connect score writeback back to trace store -->
<line class="diagram-soft" marker-end="url(#oe-soft)" x1="400" x2="400" y1="285" y2="196"></line>
<text class="edge-label" x="415" y="245">score 字段</text>
<!-- Low-score filter → dataset -->
<rect class="diagram-ink node-fill" height="54" rx="6" width="220" x="40" y="258"></rect>
<text class="node-label" text-anchor="middle" x="150" y="282">低分提拔 → 离线集</text>
<text class="edge-label" text-anchor="middle" x="150" y="300">一键 export + 标注</text>
<line class="diagram-ink" marker-end="url(#oe-arrow)" x1="310" x2="260" y1="285" y2="285"></line>
<text class="edge-label" text-anchor="middle" x="285" y="277">过滤</text>
<!-- Feed to agent-eval -->
<rect class="diagram-soft node-fill" height="40" rx="6" width="220" x="40" y="352"></rect>
<text class="node-label" text-anchor="middle" x="150" y="372">agent-eval（开发期回归）</text>
<line class="diagram-ink" marker-end="url(#oe-arrow)" x1="150" x2="150" y1="312" y2="352"></line>
<text class="edge-label" x="170" y="338">喂回</text>
<!-- Reflexion: separate, dashed box on right -->
<rect class="diagram-soft" height="52" rx="6" width="286" x="522" y="340"></rect>
<text class="node-label" fill="#A3A3A3" text-anchor="middle" x="665" y="360">Reflexion（运行期自纠）</text>
<text class="edge-label" text-anchor="middle" x="665" y="378">≠ 在线评估 · 见 agent-reasoning-patterns</text>
<style>
.diagram-ink{stroke:#0A0A0A;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.diagram-accent{stroke:#B73B2F;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.diagram-soft{stroke:#A3A3A3;fill:none;stroke-width:1.1;stroke-dasharray:3 3}.node-fill{fill:#FFFFFF}.node-fill-accent{fill:rgba(183,59,47,.06)}.node-label{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:13px;font-weight:500;fill:#0A0A0A}.node-label-accent{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:13px;font-weight:700;fill:#B73B2F}.edge-label{font-family:monospace;font-size:11px;fill:#525252;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}.branch-label{font-family:monospace;font-size:11px;font-weight:700;fill:#B73B2F;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}</style>
</svg>