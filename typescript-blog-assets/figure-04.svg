<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="联合类型 string | number 经过 typeof 守卫，在两个分支里分别收窄成 string 和 number" height="320" role="img" viewBox="0 0 680 320" width="680" xmlns="http://www.w3.org/2000/svg"><style>
:root { --bg:#fff; --ink:#0a0a0a; --ink-soft:#525252; --ink-faint:#a3a3a3; --vermilion:#b73b2f; --vermilion-soft:rgba(183,59,47,.08); }
svg { background:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; }
.diagram-ink { stroke:var(--ink); fill:none; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
.diagram-accent { stroke:var(--vermilion); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.diagram-soft { stroke:var(--ink-faint); fill:none; stroke-width:1.1; stroke-dasharray:3 3; }
.node-fill { fill:var(--bg); }
.node-fill-accent { fill:var(--vermilion-soft); }
.node-label { font-size:13px; font-weight:500; fill:var(--ink); }
.node-label-accent { font-size:13px; font-weight:700; fill:var(--vermilion); }
.edge-label { font-family:Consolas,"SFMono-Regular",monospace; font-size:11px; fill:var(--ink-soft); paint-order:stroke; stroke:var(--bg); stroke-width:4px; stroke-linejoin:round; }
.branch-label { font-family:Consolas,"SFMono-Regular",monospace; font-size:11px; font-weight:700; fill:var(--vermilion); paint-order:stroke; stroke:var(--bg); stroke-width:4px; stroke-linejoin:round; }
</style>
<defs>
<marker id="ar-dec" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0A0A0A"></path>
</marker>
</defs>
<!-- top: union -->
<rect class="diagram-ink node-fill" height="46" rx="6" width="210" x="235" y="20"></rect>
<text class="node-label" text-anchor="middle" x="340" y="48">value: string | number</text>
<!-- arrow down to diamond -->
<line class="diagram-ink" marker-end="url(#ar-dec)" x1="340" x2="340" y1="66" y2="92"></line>
<!-- diamond -->
<polygon class="diagram-accent node-fill-accent" points="340,96 480,178 340,260 200,178"></polygon>
<text class="node-label" text-anchor="middle" x="340" y="174">typeof value</text>
<text class="node-label" text-anchor="middle" x="340" y="192">=== "string" ?</text>
<!-- true branch left -->
<line class="diagram-ink" marker-end="url(#ar-dec)" x1="200" x2="132" y1="178" y2="178"></line>
<text class="branch-label" text-anchor="middle" x="170" y="168">真</text>
<rect class="diagram-ink node-fill" height="46" rx="6" width="120" x="12" y="156"></rect>
<text class="node-label" text-anchor="middle" x="72" y="178">value: string</text>
<text class="edge-label" style="stroke:none" text-anchor="middle" x="72" y="194">.toUpperCase()</text>
<!-- false branch right -->
<line class="diagram-ink" marker-end="url(#ar-dec)" x1="480" x2="548" y1="178" y2="178"></line>
<text class="branch-label" text-anchor="middle" x="514" y="168">假</text>
<rect class="diagram-ink node-fill" height="46" rx="6" width="120" x="548" y="156"></rect>
<text class="node-label" text-anchor="middle" x="608" y="178">value: number</text>
<text class="edge-label" style="stroke:none" text-anchor="middle" x="608" y="194">.toFixed(2)</text>
</svg>