<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="把类型看成值的集合：unknown 是全集，never 是空集，字面量是单点集合，string 与 number 是不相交的子集" height="380" role="img" viewBox="0 0 700 380" width="700" xmlns="http://www.w3.org/2000/svg"><style>
:root { --bg:#fff; --ink:#0a0a0a; --ink-soft:#525252; --ink-faint:#a3a3a3; --vermilion:#b73b2f; --vermilion-soft:rgba(183,59,47,.08); }
svg { background:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; }
.diagram-ink { stroke:var(--ink); fill:none; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
.diagram-accent { stroke:var(--vermilion); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.diagram-soft { stroke:var(--ink-faint); fill:none; stroke-width:1.1; stroke-dasharray:3 3; }
.node-fill { fill:var(--bg); }
.node-fill-accent { fill:var(--vermilion-soft); }
.node-label { font-size:13px; font-weight:500; fill:var(--ink); }
.node-label-accent { font-size:13px; font-weight:700; fill:var(--vermilion); }
.edge-label { font-family:Consolas,"SFMono-Regular",monospace; font-size:11px; fill:var(--ink-soft); paint-order:stroke; stroke:var(--bg); stroke-width:4px; stroke-linejoin:round; }
.branch-label { font-family:Consolas,"SFMono-Regular",monospace; font-size:11px; font-weight:700; fill:var(--vermilion); paint-order:stroke; stroke:var(--bg); stroke-width:4px; stroke-linejoin:round; }
</style>
<!-- outer set: unknown -->
<rect class="diagram-soft" height="300" rx="10" width="640" x="30" y="50"></rect>
<text class="edge-label" font-weight="700" style="stroke:none" x="48" y="74">unknown = 所有值的集合（全集）</text>
<!-- string set -->
<ellipse class="diagram-ink node-fill" cx="210" cy="215" rx="145" ry="92"></ellipse>
<text class="node-label" text-anchor="middle" x="210" y="210">string</text>
<text class="edge-label" style="stroke:none" text-anchor="middle" x="210" y="230">所有字符串</text>
<!-- literal point inside string -->
<circle cx="150" cy="180" fill="#B73B2F" r="4"></circle>
<text class="branch-label" text-anchor="middle" x="150" y="166">"hi"</text>
<!-- number set (disjoint from string) -->
<ellipse class="diagram-ink node-fill" cx="490" cy="215" rx="135" ry="92"></ellipse>
<text class="node-label" text-anchor="middle" x="490" y="210">number</text>
<text class="edge-label" style="stroke:none" text-anchor="middle" x="490" y="230">所有数字</text>
<!-- never = empty set, in the gap -->
<text class="branch-label" text-anchor="middle" x="350" y="332">never = ∅（空集，没有任何值）</text>
</svg>